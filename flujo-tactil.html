<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Flujo táctil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== SyMula: estilo común (igual en todos los simuladores) ===== */
:root{
  --bg:#0b1226;--panel:#121a36;--btn:#1b2650;--line:#2c3a6e;--ink:#eef1ff;--soft:#a3aed8;--acc:#ffc94a;--acc-ink:#2a1c00;--cyan:#5ec8f2;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b1226;--panel:#121a36;--btn:#1b2650;--line:#2c3a6e;--ink:#eef1ff;--soft:#a3aed8;--acc:#ffc94a;--acc-ink:#2a1c00;--cyan:#5ec8f2}
}
:root[data-theme="dark"]{--bg:#0b1226;--panel:#121a36;--btn:#1b2650;--line:#2c3a6e;--ink:#eef1ff;--soft:#a3aed8;--acc:#ffc94a;--acc-ink:#2a1c00;--cyan:#5ec8f2}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font:700 15px/1.3 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.home{position:absolute;top:10px;left:10px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;z-index:3;
  background:rgba(18,26,54,.88);border:1px solid var(--line);color:var(--ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{position:absolute;top:10px;left:72px;right:10px;max-width:460px;min-height:52px;padding:7px 12px;border-radius:16px;z-index:2;pointer-events:none;
  background:rgba(18,26,54,.88);border:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card h1{font:800 18px/1.15 Nunito,sans-serif;margin:0;color:var(--acc)}
.card p{margin:2px 0 0;font-size:14px;color:#d8ddf7}
.card .data{font-size:13px;color:#8fd8ff;font-variant-numeric:tabular-nums}
.card p:empty{display:none}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:92%;padding:10px 18px;border-radius:999px;z-index:3;
  background:var(--acc);color:var(--acc-ink);font-weight:800;text-align:center;pointer-events:none;transition:opacity .4s}
.toast.off{opacity:0}
.dock{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.dock>*{width:100%;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px}
.tile{flex:1 1 0;min-width:0;min-height:60px;padding:6px 3px;border-radius:16px;border:1px solid var(--line);background:var(--btn);color:var(--ink);
  font:800 13px/1.1 Nunito,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;touch-action:manipulation}
.tile svg{width:26px;height:26px;flex:none}
.tile[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tile:active{transform:scale(.96)}
.tile:disabled{opacity:.4;cursor:default}
.lbl{font-size:12px;font-weight:800;color:var(--soft);margin-bottom:-3px;padding:0 2px}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
/* ===== fin del estilo común ===== */
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv" aria-label="Piscina: toca el agua y arrastra el dedo para moverla"></canvas>
  <a class="home" href="index.html" aria-label="Volver al inicio"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5.5 9.5V20h13V9.5"/></svg></a>
  <div class="card" id="card"><h1>Flujo táctil</h1><p id="say">Toca el agua y arrastra el dedo.</p></div>
  <div class="toast off" id="toast"></div>
</div>
<nav class="dock" aria-label="Controles">
  <div class="row">
    <button class="tile" type="button" data-view="agua" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 9c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></svg>Ondas</button>
    <button class="tile" type="button" data-view="vorticidad" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 12a2 2 0 1 1 2-2 4 4 0 1 1-4-4 6 6 0 1 1-6 6"/></svg>Remolinos</button>
    <button class="tile" type="button" id="calm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h18"/></svg>Calmar</button>
    <button class="tile" type="button" id="fs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" id="fsIco"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg><span id="fsLbl">Pantalla</span></button>
  </div>
</nav>
<script>
(function(){
"use strict";
// ---------- Configuración ----------
// Lattice Boltzmann D2Q9 + Smagorinsky en una piscina cerrada. La malla se ajusta sola al equipo
// y los pasos siguen el tiempo real (se ve igual a 60 Hz que a 120 Hz).
const LEVELS = [12000, 17000, 24000, 33000, 45000, 60000, 80000];
const STEPS = 5;              // pasos de simulación por cada 1/60 s
const BUDGET = 11;            // ms de cálculo por cuadro
const NU = 0.005, CS2 = 0.0144;
const VMAX = 0.2, VREF = 0.06, TAP = 0.14, WAKE = 0.35, NPART = 800;
const EX=[0,1,0,-1,0,1,-1,-1,1], EY=[0,0,1,0,-1,1,1,-1,-1];
const W=[4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36];

// ---------- Estado ----------
let NX, NY, N, cellPx, touchR, level = 2;
let f, g, rho, ux, uy, curl, bar, img, px, pxs, pys;
const off = document.createElement("canvas"), octx = off.getContext("2d");
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const touches = new Map();
let mode = "agua";

// ---------- Malla ajustada a la pantalla ----------
function setup(){
  const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(w*dpr)); cv.height = Math.max(1, Math.round(h*dpr));
  cellPx = Math.sqrt(w*h/LEVELS[level]);
  NX = Math.max(20, Math.round(w/cellPx)); NY = Math.max(20, Math.round(h/cellPx)); N = NX*NY;
  touchR = Math.max(3, 26/cellPx);
  f = new Float32Array(9*N); g = new Float32Array(9*N);
  rho = new Float32Array(N); ux = new Float32Array(N); uy = new Float32Array(N); curl = new Float32Array(N);
  bar = new Uint8Array(N);
  for (let x = 0; x < NX; x++){ bar[x] = 1; bar[x+(NY-1)*NX] = 1; }
  for (let y = 0; y < NY; y++){ bar[y*NX] = 1; bar[NX-1+y*NX] = 1; }
  off.width = NX; off.height = NY; img = octx.createImageData(NX, NY); px = img.data;
  pxs = new Float32Array(NPART); pys = new Float32Array(NPART);
  initFlow();
  for (let k = 0; k < NPART; k++) spawn(k);
  touches.clear();
}

// ---------- Física ----------
function setEq(i, r, vx, vy){
  const u2 = 1.5*(vx*vx+vy*vy);
  for (let q = 0; q < 9; q++){ const eu = EX[q]*vx+EY[q]*vy; f[q*N+i] = W[q]*r*(1+3*eu+4.5*eu*eu-u2); }
  rho[i] = r; ux[i] = vx; uy[i] = vy;
}
function initFlow(){ for (let i = 0; i < N; i++) setEq(i, 1, 0, 0); }

// Colisión y transporte en una pasada (empuje a los vecinos, rebote en paredes).
// Todas las celdas de agua son interiores, así que siempre tienen los 8 vecinos.
function step(){
  const tau0 = 3*NU+0.5, C = 18*Math.SQRT2*CS2;
  for (let y = 1; y < NY-1; y++){
    for (let i = y*NX+1, e = y*NX+NX-1; i < e; i++){
      if (bar[i]) continue;
      const f0=f[i],f1=f[N+i],f2=f[2*N+i],f3=f[3*N+i],f4=f[4*N+i],f5=f[5*N+i],f6=f[6*N+i],f7=f[7*N+i],f8=f[8*N+i];
      const r=f0+f1+f2+f3+f4+f5+f6+f7+f8, ir=1/r;
      const vx=(f1-f3+f5-f6-f7+f8)*ir, vy=(f2-f4+f5+f6-f7-f8)*ir;
      const u2=1.5*(vx*vx+vy*vy), a=r/9, b=r/36, xp=vx+vy, xm=vx-vy;
      const ax=4.5*vx*vx, ay=4.5*vy*vy, bp=4.5*xp*xp, bm=4.5*xm*xm;
      const d0=f0-4*a*(1-u2), d1=f1-a*(1+3*vx+ax-u2), d3=f3-a*(1-3*vx+ax-u2), d2=f2-a*(1+3*vy+ay-u2), d4=f4-a*(1-3*vy+ay-u2);
      const d5=f5-b*(1+3*xp+bp-u2), d7=f7-b*(1-3*xp+bp-u2), d8=f8-b*(1+3*xm+bm-u2), d6=f6-b*(1-3*xm+bm-u2);
      const pxx=d1+d3+d5+d6+d7+d8, pyy=d2+d4+d5+d6+d7+d8, pxy=d5-d6+d7-d8;
      const om=2/(tau0+Math.sqrt(tau0*tau0+C*Math.sqrt(pxx*pxx+pyy*pyy+2*pxy*pxy)*ir));
      rho[i]=r; ux[i]=vx; uy[i]=vy;
      g[i]=f0-om*d0; let j;
      j=i+1;    if (bar[j]) g[3*N+i]=f1-om*d1; else g[N+j]=f1-om*d1;
      j=i+NX;   if (bar[j]) g[4*N+i]=f2-om*d2; else g[2*N+j]=f2-om*d2;
      j=i-1;    if (bar[j]) g[N+i]=f3-om*d3;   else g[3*N+j]=f3-om*d3;
      j=i-NX;   if (bar[j]) g[2*N+i]=f4-om*d4; else g[4*N+j]=f4-om*d4;
      j=i+NX+1; if (bar[j]) g[7*N+i]=f5-om*d5; else g[5*N+j]=f5-om*d5;
      j=i+NX-1; if (bar[j]) g[8*N+i]=f6-om*d6; else g[6*N+j]=f6-om*d6;
      j=i-NX-1; if (bar[j]) g[5*N+i]=f7-om*d7; else g[7*N+j]=f7-om*d7;
      j=i-NX+1; if (bar[j]) g[6*N+i]=f8-om*d8; else g[8*N+j]=f8-om*d8;
    }
  }
  const t = f; f = g; g = t;
}

// El dedo impone su velocidad en un disco y empuja hacia afuera: eso genera ondas de presión.
function stir(t){
  const R = touchR, R2 = R*R, sp = Math.hypot(t.vx, t.vy), push = WAKE*sp + t.boost;
  const y0 = Math.max(1, Math.floor(t.gy-R)), y1 = Math.min(NY-2, Math.ceil(t.gy+R));
  const x0 = Math.max(1, Math.floor(t.gx-R)), x1 = Math.min(NX-2, Math.ceil(t.gx+R));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
    const dx = x-t.gx, dy = y-t.gy, d2 = dx*dx+dy*dy;
    if (d2 > R2) continue;
    const i = x+y*NX, d = Math.sqrt(d2) || 1, fall = 1-d2/R2, w = 0.6*fall;
    let tx = t.vx + dx/d*push*(d/R), ty = t.vy + dy/d*push*(d/R);
    const m = Math.hypot(tx, ty); if (m > 0.28){ tx *= 0.28/m; ty *= 0.28/m; }
    setEq(i, rho[i], ux[i]+(tx-ux[i])*w, uy[i]+(ty-uy[i])*w);
  }
}

// ---------- Toques ----------
function toGrid(e){ const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*NX, (e.clientY-r.top)/r.height*NY]; }
function upd(id, e, down){
  const [gx, gy] = toGrid(e), t = touches.get(id);
  if (t){ t.gx = gx; t.gy = gy; if (down) t.boost = TAP; }
  else touches.set(id, {gx, gy, lx:gx, ly:gy, vx:0, vy:0, boost: down ? TAP : 0});
  $("card").style.opacity = "0.55";
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); upd(e.pointerId, e, true); });
cv.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" && e.buttons === 0) upd("mouse", e, false);   // en computador basta mover el mouse
  else if (touches.has(e.pointerId)) upd(e.pointerId, e, false);
});
const end = e => touches.delete(e.pointerId);
cv.addEventListener("pointerup", end);
cv.addEventListener("pointercancel", end);
cv.addEventListener("pointerleave", () => touches.delete("mouse"));
function updateVelocity(t, n){
  let vx = (t.gx-t.lx)/n, vy = (t.gy-t.ly)/n;
  const m = Math.hypot(vx, vy); if (m > VMAX){ vx *= VMAX/m; vy *= VMAX/m; }
  t.vx = 0.5*t.vx+0.5*vx; t.vy = 0.5*t.vy+0.5*vy; t.lx = t.gx; t.ly = t.gy;
}

// ---------- Partículas ----------
function spawn(k){ pxs[k] = 1.5+Math.random()*(NX-3); pys[k] = 1.5+Math.random()*(NY-3); }
function advect(n){
  for (let k = 0; k < NPART; k++){
    const i = (pxs[k]|0)+(pys[k]|0)*NX;
    pxs[k] += ux[i]*n; pys[k] += uy[i]*n;
    if (pxs[k] < 1 || pxs[k] >= NX-1 || pys[k] < 1 || pys[k] >= NY-1) spawn(k);
  }
}

// ---------- Dibujo ----------
function makeLut(stops){
  const t = new Uint8Array(768);
  for (let k = 0; k < 256; k++){
    const v = k/255; let j = 0;
    while (j < stops.length-2 && v > stops[j+1][0]) j++;
    const [a, ca] = stops[j], [b, cb] = stops[j+1], u = (v-a)/(b-a);
    for (let c = 0; c < 3; c++) t[k*3+c] = Math.round(ca[c]+(cb[c]-ca[c])*u);
  }
  return t;
}
const LUT_CURL = makeLut([[0,[120,200,255]],[0.25,[30,100,190]],[0.5,[11,18,38]],[0.75,[220,110,40]],[1,[255,210,150]]]);
// Agua: color según rapidez + sombreado por la pendiente de la presión (así se ven las ondas)
const LX = -0.6, LY = -0.8, GAIN = 260;
function render(){
  const water = mode === "agua";
  for (let y = 1; y < NY-1; y++) for (let x = 1; x < NX-1; x++){
    const i = x+y*NX; curl[i] = uy[i+1]-uy[i-1]-ux[i+NX]+ux[i-NX];
  }
  let bad = false;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++){
    const i = x+y*NX, p = i*4;
    if (bar[i]){ px[p]=150; px[p+1]=190; px[p+2]=205; px[p+3]=255; continue; }
    const r = rho[i];
    if (!(r > 0.3 && r < 3)) bad = true;
    if (water){
      const sp = Math.min(1, Math.hypot(ux[i], uy[i])/VREF);
      const c = Math.min(1, Math.abs(curl[i])/(0.5*VREF));
      const gx = rho[i+1]-rho[i-1], gy = rho[i+NX]-rho[i-NX];
      let L = (gx*LX + gy*LY)*GAIN; L = L > 1 ? 1 : L < -1 ? -1 : L;
      const spec = L > 0.55 ? (L-0.55)*400 : 0;
      px[p]   = 10 + 30*sp + 20*c + 70*L + spec;
      px[p+1] = 72 + 70*sp + 40*c + 95*L + spec;
      px[p+2] = 98 + 70*sp + 45*c + 105*L + spec;
    } else {
      const v = 0.5+0.5*curl[i]/(0.35*VREF);
      const k = (v <= 0 ? 0 : v >= 1 ? 255 : (v*255)|0)*3;
      px[p]=LUT_CURL[k]; px[p+1]=LUT_CURL[k+1]; px[p+2]=LUT_CURL[k+2];
    }
    px[p+3] = 255;
  }
  octx.putImageData(img, 0, 0);
  const dw = cv.width, dh = cv.height;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(off, 0, 0, dw, dh);
  const sx = dw/NX, sy = dh/NY, s = Math.max(1.5, sx*0.4);
  ctx.fillStyle = water ? "rgba(235,250,255,0.35)" : "rgba(235,242,250,0.55)";
  for (let k = 0; k < NPART; k++) ctx.fillRect(pxs[k]*sx-s/2, pys[k]*sy-s/2, s, s);
  return bad;
}

// ---------- Bucle: pasos según el tiempo real y calidad automática ----------
let last = 0, acc = 0, perfN = 0, perfMs = 0, perfSteps = 0, decisions = 0, wentDown = false;
function frame(now){
  const dt = last ? Math.min(50, now-last) : 16.7; last = now;
  acc += STEPS*dt/16.7;
  const want = Math.min(Math.floor(acc), 2*STEPS); acc -= Math.floor(acc);
  for (const t of touches.values()) updateVelocity(t, Math.max(1, want));
  const t0 = performance.now(); let done = 0;
  while (done < want){
    for (const t of touches.values()){ stir(t); t.boost *= 0.7; }
    step(); done++;
    if (performance.now()-t0 > BUDGET) break;
  }
  if (done < want) acc = 0;
  if (done) advect(done);
  quality(performance.now()-t0, done);
  if (render()) initFlow();
  requestAnimationFrame(frame);
}
function quality(ms, done){
  if (decisions >= 4 || !done) return;
  perfN++; if (perfN <= 15) return;
  perfMs += ms; perfSteps += done;
  if (perfN < 60) return;
  const perFrame = perfMs/perfSteps*STEPS;
  perfN = 0; perfMs = 0; perfSteps = 0;
  if (perFrame > BUDGET && level > 0){ level--; wentDown = true; decisions++; setup(); }
  else if (perFrame < BUDGET*0.42 && level < LEVELS.length-1 && !wentDown){ level++; decisions++; setup(); }
  else decisions = 4;
}

// ---------- Botones ----------
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b));
}));
$("calm").addEventListener("click", () => { initFlow(); for (let k = 0; k < NPART; k++) spawn(k); });

// Pantalla completa (se oculta donde el navegador no lo permite, como Safari en iPhone)
const fsBtn = $("fs"), root = document.documentElement;
const reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
const isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
if (!reqFs) fsBtn.hidden = true;
fsBtn.addEventListener("click", () => {
  try {
    const p = isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : reqFs.call(root);
    if (p && p.catch) p.catch(() => { fsBtn.hidden = true; });
  } catch (err) { fsBtn.hidden = true; }
});
const ENTER = '<path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/>', EXIT = '<path d="M8 3v5H3M21 8h-5V3M16 21v-5h5M3 16h5v5"/>';
const syncFs = () => { const on = !!isFs(); $("fsIco").innerHTML = on ? EXIT : ENTER; $("fsLbl").textContent = on ? "Salir" : "Pantalla"; };
document.addEventListener("fullscreenchange", syncFs);
document.addEventListener("webkitfullscreenchange", syncFs);

let rt = 0;
new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(setup, 150); }).observe(cv);
setup();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
