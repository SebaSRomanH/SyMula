<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1526">
<!-- SyMula: tema (va antes del estilo para no parpadear) -->
<script>(function(){var t=null;try{t=localStorage.getItem("symula-tema");if(!t&&localStorage.getItem("symula-noche")==="1")t="night";}catch(e){}
if(t!=="light"&&t!=="dark"&&t!=="night")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
document.documentElement.setAttribute("data-theme",t);})();</script>
<!-- fin SyMula: tema -->
<title>Fórmulas de la simulación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== SyMula: estilo común (sistema de diseño v1.0, igual en todas las páginas) ===== */
:root,:root[data-theme="dark"]{
  --background:#0B1526;--surface:#15253A;--surface-2:#1B2E47;--text:#F0F6FC;--text-muted:#B8C6D3;
  --primary:#42C7CF;--primary-text:#0B1526;--accent:#E6B66A;--border:#30445B;--control-border:#5D7590;
  --sem-1:#6CB4F0;--sem-2:#F29C6B;--sem-3:#6FCF97;--sem-4:#C49BEA;--sem-5:#E6C15A;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --background:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F8;--text:#102A43;--text-muted:#526779;
  --primary:#087481;--primary-text:#FFFFFF;--accent:#D9A15B;--border:#DCE5EB;--control-border:#7B8FA1;
  --sem-1:#1F6FB2;--sem-2:#B4532A;--sem-3:#2E7D4F;--sem-4:#7E4AB0;--sem-5:#8A6400;
  color-scheme:light;
}
:root[data-theme="night"]{
  --background:#09221D;--surface:#12382F;--surface-2:#174238;--text:#E7F8F2;--text-muted:#C1F4DD;
  --primary:#21B68B;--primary-text:#09221D;--accent:#C1F4DD;--border:#286052;--control-border:#4E8A78;
  --sem-1:#8FD3FF;--sem-2:#F5B38A;--sem-3:#9BE8C0;--sem-4:#D5B8F2;--sem-5:#F0D58A;
  color-scheme:dark;
}
:root{
  /* nombres antiguos que usa el código de cada página */
  --bg:var(--background);--panel:var(--surface);--btn:var(--surface-2);--line:var(--border);--ink:var(--text);
  --soft:var(--text-muted);--acc:var(--primary);--acc-ink:var(--primary-text);--cyan:var(--primary);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--background);color:var(--text);font:500 15px/1.4 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{flex:1;min-width:0;margin:0;font:700 17px/1.2 Inter,sans-serif;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{flex:none;min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);border:1px solid var(--control-border);color:var(--text);text-decoration:none;font-weight:600}
@media (hover:hover){.btn:hover{border-color:var(--primary)}}
.btn svg{width:22px;height:22px}
main{max-width:860px;margin:0 auto;padding:16px 12px 32px;display:flex;flex-direction:column;gap:16px}
main canvas{width:100%;height:auto;border-radius:12px;background:#fff;border:1px solid var(--border)}
.msg{color:var(--text-muted);text-align:center;padding:32px 12px}
.msg a{color:var(--primary)}
a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>
</head>
<body>
<header>
  <a class="btn" href="../index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5.5 9.5V20h13V9.5"/></svg></a>
  <h1 id="title">Fórmulas</h1>
  <a class="btn" id="dl" href="#" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</a>
</header>
<main id="pages"><p class="msg" id="msg">Cargando…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// Muestra la ficha PDF dibujada con PDF.js, así se ve igual en cualquier celular (muchos no abren
// PDF dentro del navegador). El botón PDF descarga el archivo original.
(function(){
  const NAMES = {"gravitacion":"Planetas y gravedad", "ondas-sonoras":"Sonido en una sala", "flujo-tubo":"Flujo en un tubo",
                 "flujo-tactil":"Flujo táctil", "lanzamiento":"Lanzamiento vertical", "mareas":"Bola de agua",
                 "fractales":"Fractales", "lissajous":"Figuras de Lissajous", "radio":"Radio AM y FM"};
  const f = new URLSearchParams(location.search).get("f"), msg = document.getElementById("msg");
  if (!NAMES[f]){ msg.innerHTML = 'No encontré esa ficha. <a href="../index.html">Volver al inicio</a>.'; return; }
  const url = f + ".pdf";
  document.title = "Fórmulas: " + NAMES[f];
  document.getElementById("title").textContent = NAMES[f];
  document.getElementById("dl").href = url;
  const fail = () => { msg.innerHTML = `No pude mostrar la ficha aquí. <a href="${url}">Abrir o descargar el PDF</a>.`; };
  if (!window.pdfjsLib) return fail();
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  pdfjsLib.getDocument(url).promise.then(async pdf => {
    msg.remove();
    const box = document.getElementById("pages"), dpr = Math.min(2, window.devicePixelRatio || 1);
    for (let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i), w = Math.min(860, box.clientWidth);
      const vp = page.getViewport({scale: w/page.getViewport({scale:1}).width*dpr});
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
      cv.setAttribute("aria-label", `Página ${i} de ${pdf.numPages}`);
      box.appendChild(cv);
      await page.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
    }
  }).catch(fail);
})();
</script>
<!-- SyMula: selector de tema (botones con data-theme-set) -->
<script>(function(){
function sync(){var t=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-theme-set")===t);});
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--background").trim());}
window.SyMulaTheme=function(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("symula-tema",t);}catch(e){}sync();
  window.dispatchEvent(new Event("symula-tema"));};
// colores del tema para dibujar en el lienzo: SyMulaColor("sem-1"), SyMulaColor("primary")...
window.SyMulaColor=function(name){return getComputedStyle(document.documentElement).getPropertyValue("--"+name).trim();};
document.querySelectorAll("[data-theme-set]").forEach(function(b){b.addEventListener("click",function(){SyMulaTheme(b.getAttribute("data-theme-set"));});});
try{if(!localStorage.getItem("symula-tema")&&window.matchMedia)matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(e){document.documentElement.setAttribute("data-theme",e.matches?"light":"dark");sync();window.dispatchEvent(new Event("symula-tema"));});}catch(e){}
sync();})();</script>
<!-- fin SyMula: selector de tema -->
</body>
</html>
