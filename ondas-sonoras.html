if(t!=="light"&&t!=="dark"&&t!=="night")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";

<title>Sonido en una sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== SyMula: estilo común (sistema de diseño v1.0, igual en todas las páginas) ===== */
:root,:root[data-theme="dark"]{
  --background:#0B1526;--surface:#15253A;--surface-2:#1B2E47;--text:#F0F6FC;--text-muted:#B8C6D3;
  --primary:#42C7CF;--primary-text:#0B1526;--accent:#E6B66A;--border:#30445B;--control-border:#5D7590;
  --sem-1:#6CB4F0;--sem-2:#F29C6B;--sem-3:#6FCF97;--sem-4:#C49BEA;--sem-5:#E6C15A;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --background:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F8;--text:#102A43;--text-muted:#526779;
  --primary:#087481;--primary-text:#FFFFFF;--accent:#D9A15B;--border:#DCE5EB;--control-border:#7B8FA1;
  --sem-1:#1F6FB2;--sem-2:#B4532A;--sem-3:#2E7D4F;--sem-4:#7E4AB0;--sem-5:#8A6400;
  color-scheme:light;
}
:root[data-theme="night"]{
  --background:#09221D;--surface:#12382F;--surface-2:#174238;--text:#E7F8F2;--text-muted:#C1F4DD;
  --primary:#21B68B;--primary-text:#09221D;--accent:#C1F4DD;--border:#286052;--control-border:#4E8A78;
  --sem-1:#8FD3FF;--sem-2:#F5B38A;--sem-3:#9BE8C0;--sem-4:#D5B8F2;--sem-5:#F0D58A;
  color-scheme:dark;
}
:root{
  /* nombres antiguos que usa el código de cada página */
  --bg:var(--background);--panel:var(--surface);--btn:var(--surface-2);--line:var(--border);--ink:var(--text);
  --soft:var(--text-muted);--acc:var(--primary);--acc-ink:var(--primary-text);--cyan:var(--primary);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--background)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--background);color:var(--text);
  font:500 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--background)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
:root[data-theme="night"] .stage canvas{filter:grayscale(1) sepia(.8) hue-rotate(92deg) saturate(.85) brightness(.88)}   /* verde suave, sin fluorescencia */
.home{position:absolute;top:12px;left:12px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;z-index:3;
  background:var(--surface);border:1px solid var(--control-border);color:var(--text)}
.card{position:absolute;top:12px;left:72px;right:12px;max-width:480px;min-height:48px;padding:10px 16px;border-radius:12px;z-index:2;pointer-events:none;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border)}
.card h1{font:700 17px/1.2 Inter,sans-serif;margin:0;color:var(--text);letter-spacing:-.01em}
.card p{margin:3px 0 0;font-size:14px;color:var(--text-muted)}
.card .data{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.card p:empty{display:none}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:92%;padding:10px 16px;border-radius:12px;z-index:3;
  background:var(--surface);color:var(--text);border:1px solid var(--primary);font-weight:600;text-align:center;pointer-events:none;transition:opacity .3s}
.toast.off{opacity:0}
.dock{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.dock>*{width:100%;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px}
.tile{flex:1 1 0;min-width:0;min-height:56px;padding:6px 4px;border-radius:12px;border:1px solid var(--control-border);background:var(--surface-2);color:var(--text);
  font:600 13px/1.15 Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  touch-action:manipulation;transition:border-color .15s,background-color .15s}
.tile svg{width:24px;height:24px;flex:none}
.tile small{font-size:11px;font-weight:500;opacity:.85}
@media (hover:hover){.tile:hover:not(:disabled),.home:hover{border-color:var(--primary)}}
.tile[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile[aria-busy="true"]{position:relative;color:transparent}
.tile[aria-busy="true"]::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--text-muted);border-top-color:var(--primary);animation:sy-spin .8s linear infinite}
@keyframes sy-spin{to{transform:rotate(360deg)}}
.lbl{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:-4px;padding:0 2px;letter-spacing:.02em}
.themes{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.themes button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text);font:600 13px Inter,sans-serif;cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text)}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
/* ===== fin del estilo común ===== */
.tile.s{font-size:11.5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:62px;min-height:52px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:var(--btn);color:var(--ink);
  font:800 17px/1 Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation}
.chip small{font-size:11px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip[aria-pressed="true"] small{color:var(--primary-text)}
.chips .wait{font-size:13px;color:var(--soft);padding:16px 2px}
.sheet{display:flex;flex-direction:column;gap:8px;max-height:32vh;overflow-y:auto;padding:2px 0 8px;border-bottom:1px solid var(--line)}
.rng{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px;color:var(--soft)}
.rng span{width:88px;flex:none}
.rng input{flex:1;height:32px;accent-color:var(--acc)}
.rng output{width:64px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
#plot{display:block;width:100%;height:92px;border-radius:12px;background:#0d1530;border:1px solid var(--border);touch-action:none;cursor:pointer}
</style>
</head>
<body>
<div class="stage">
  <canvas id="room" aria-label="Sala vista desde arriba: arrastra el parlante o el oyente"></canvas>
  <a class="home" href="index.html" aria-label="Volver al inicio"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5.5 9.5V20h13V9.5"/></svg></a>
  <div class="card" id="card" aria-live="polite"><h1>Sonido en una sala</h1><p id="say">Toca una nota y arrastra el parlante o el oyente.</p><p class="data" id="data">0 Hz · λ = 0 m · oyente 0 dB</p></div>
  <div class="toast off" id="toast"></div>
</div>
<nav class="dock" aria-label="Controles">
  <div class="sheet" id="sheet" hidden>
    <div class="lbl">Tema</div>
    <div class="themes" role="group" aria-label="Tema"><button type="button" data-theme-set="light">Claro</button><button type="button" data-theme-set="dark">Oscuro</button><button type="button" data-theme-set="night">Nocturno</button></div>
    <div class="lbl">Qué mostrar</div>
    <div class="row" role="group" aria-label="Vista">
      <button class="tile" type="button" data-view="p" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 12c2.5-6 5-6 7.5 0s5 6 7.5 0 3.5-4 5-2"/></svg>Presión</button>
      <button class="tile" type="button" data-view="i" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8" opacity=".5"/></svg>Fuerza del sonido</button>
    </div>
    <div class="lbl">Parlantes</div>
    <div class="row" id="srcSeg" role="group" aria-label="Parlante elegido"></div>
    <div class="row">
      <button class="tile" type="button" id="addSrc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Agregar parlante</button>
      <button class="tile" type="button" id="delSrc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>Quitar parlante</button>
    </div>
    <div class="row" role="group" aria-label="Hacia dónde suena">
      <button class="tile" type="button" data-pat="omni" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>Todo alrededor</button>
      <button class="tile" type="button" data-pat="cardioid" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12c0-5 4-7 8-7s8 3 8 7-4 7-8 7-8-2-8-7z"/><circle cx="6" cy="12" r="2" fill="currentColor"/></svg>Hacia adelante</button>
      <button class="tile" type="button" data-pat="dipole" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="6.5" cy="12" r="4.5"/><circle cx="17.5" cy="12" r="4.5"/></svg>Adelante y atrás</button>
    </div>
    <label class="rng" id="orientWrap" hidden><span>Orientación</span><input id="orient" type="range" min="0" max="355" step="5" value="0"><output id="orientOut">0°</output></label>
    <label class="rng" id="phaseWrap" hidden><span>Fase</span><input id="phaseIn" type="range" min="0" max="345" step="15" value="0"><output id="phaseOut">0°</output></label>
    <label class="rng"><span>Absorción de las paredes</span><input id="damp" type="range" min="2" max="40" step="1" value="8"><output id="t60"></output></label>
    <div class="lbl" id="ptl">Respuesta de la sala: toca para elegir frecuencia</div>
    <canvas id="plot" aria-label="Respuesta en frecuencia de la sala"></canvas>
    <div class="lbl" id="dims"></div>
  </div>
  <div id="shapeBox" style="display:flex;flex-direction:column;gap:8px">
  <div class="lbl">Forma de la sala</div>
  <div class="row" role="group" aria-label="Forma de la sala">
    <button class="tile s" type="button" data-shape="rect" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="12"/></svg>Rectángulo</button>
    <button class="tile s" type="button" data-shape="circle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/></svg>Círculo</button>
    <button class="tile s" type="button" data-shape="tri" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 4l9 16H3z"/></svg>Triángulo</button>
    <button class="tile s" type="button" data-shape="ellipse" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="12" rx="10" ry="6.5"/></svg>Elipse</button>
    <button class="tile s" type="button" data-shape="para" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 6h15l-5 12H2z"/></svg>Romboide</button>
  </div>
  </div>
  <div class="lbl">Notas en que la sala resuena</div>
  <div class="chips" id="chips" role="group" aria-label="Modos normales"></div>
  <div class="row">
    <button class="tile" type="button" id="listen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3.5L13 4.5v15L7.5 15H4z" fill="currentColor"/><path d="M16.5 8.5q2 3.5 0 7M19 6q4 6 0 12"/></svg><span id="listenLbl">Escuchar</span></button>
    <button class="tile" type="button" id="pause"><svg viewBox="0 0 24 24" id="pauseIco"></svg><span id="pauseLbl">Pausa</span></button>
    <button class="tile" type="button" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h18"/></svg>Silencio</button>
    <button class="tile" type="button" id="more" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Más</button>
  </div>
</nav>

<script>
(function(){
"use strict";
// ---------- Sala y discretización ----------
const C_SOUND = 343;            // m/s
const LONG = 5, SHORT = 3.5;    // sala rectangular (m)
const DIAM = 4.5;               // sala circular (m)
const SIDE = 5;                 // sala triangular equilátera (m)
const TRI_H = SIDE*Math.sqrt(3)/2;
const ELL_W = 5.5, ELL_H = 3.5;  // sala elíptica: ejes (m)
const PARA_B = 4.5, PARA_S = 3.5, PARA_ANG = 60*Math.PI/180;   // romboide: lados y ángulo
const PARA_H = PARA_S*Math.sin(PARA_ANG), PARA_OFF = PARA_S*Math.cos(PARA_ANG);
const CELLS = 48000;            // nodos del rectángulo que contiene la sala (antes 30 000)
const COUR = 0.5;               // número de Courant (estable si < 1/√2)
const FMIN = 20, FMAX = 400;
const BUDGET = 10;              // ms de cálculo por cuadro como máximo

let shape = "rect", rot = false, pendingFirst = false, NX = 0, NY = 0, dx, dt, Wb, Hb, area, mask, fl, nl, nr, nu, nd, K;
let p0, p1, p2, en, img, px32;
let freq = 0, phase = 0, stepN = 0, beta = 8, paused = false, view = "p";
const MAX_SRC = 3;
let srcs = [{x:0, y:0, pattern:"omni", orient:0, ph:0}], sel = 0;
let lis = {x:0, y:0}, dragLis = false, levelDb = 0;
let modes = [], pk = 1e-6, ek = 1e-9, dirty = true, placed = null;
const $ = id => document.getElementById(id);
const room = $("room"), rctx = room.getContext("2d");
const plot = $("plot"), pctx = plot.getContext("2d");
const off = document.createElement("canvas"), octx = off.getContext("2d");
const fmt = (v, d) => v.toFixed(d).replace(".", ",");
let rect = {x:0, y:0, w:1, h:1}, dpr = 1;

// ---------- Funciones de Bessel (para la sala circular) ----------
function J(m, x){                                    // J_m(x) = (1/π)∫₀^π cos(mτ − x sen τ) dτ
  const N = 64; let s = 0;
  for (let k = 0; k < N; k++){ const t = (k+0.5)*Math.PI/N; s += Math.cos(m*t - x*Math.sin(t)); }
  return s/N;
}
const dJ = (m, x) => m === 0 ? -J(1, x) : 0.5*(J(m-1, x) - J(m+1, x));
let besselZeros = null;                              // ceros de J'_m: condición de pared rígida
function computeBesselZeros(){
  besselZeros = [];
  for (let m = 0; m <= 16; m++){
    const x0 = m ? m : 0.2;
    let f0 = dJ(m, x0);
    for (let x = x0+0.05; x < 34; x += 0.05){
      const f1 = dJ(m, x);
      if (f0*f1 < 0){
        let a = x-0.05, b = x, fa = f0;
        for (let it = 0; it < 40; it++){ const c = (a+b)/2, fc = dJ(m, c); if (fa*fc <= 0) b = c; else { a = c; fa = fc; } }
        besselZeros.push({m, x:(a+b)/2});
      }
      f0 = f1;
    }
  }
}

// ---------- Geometría ----------
// Coordenadas en metros dentro del rectángulo contenedor, en orientación apaisada.
// En pantallas verticales, la sala rectangular, la elíptica y el romboide se trasponen.
function insideL(X, Y){
  switch (shape){
    case "rect": return true;
    case "circle": { const r = DIAM/2; return (X-r)**2 + (Y-r)**2 <= r*r; }
    case "tri": { const yb = TRI_H - Y; return yb >= 0 && yb <= Math.sqrt(3)*X && yb <= Math.sqrt(3)*(SIDE-X); }
    case "ellipse": { const a = ELL_W/2, b = ELL_H/2; return ((X-a)/a)**2 + ((Y-b)/b)**2 <= 1; }
    case "para": { if (Y < 0 || Y > PARA_H) return false; const s = PARA_OFF*(PARA_H-Y)/PARA_H; return X >= s && X <= PARA_B + s; }
  }
}
const inside = (X, Y) => rot ? insideL(Y, X) : insideL(X, Y);
const DIMS = {rect:[LONG, SHORT], circle:[DIAM, DIAM], tri:[SIDE, TRI_H], ellipse:[ELL_W, ELL_H], para:[PARA_B+PARA_OFF, PARA_H]};
// posiciones en fracciones de la sala apaisada: sobreviven a cambios de tamaño y de orientación
const toFrac = p => rot ? [(p.y+0.5)/NY, (p.x+0.5)/NX] : [(p.x+0.5)/NX, (p.y+0.5)/NY];
function fromFrac(p, [u, v]){ const [a, b] = rot ? [v, u] : [u, v]; p.x = Math.min(NX-2, Math.max(1, Math.floor(a*NX))); p.y = Math.min(NY-2, Math.max(1, Math.floor(b*NY))); }
function setup(keepFreq){
  const keep = placed === shape && NX ? {s:srcs.map(toFrac), l:toFrac(lis)} : null;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = room.clientWidth, ch = room.clientHeight;
  room.width = Math.round(cw*dpr); room.height = Math.round(ch*dpr);
  rot = ch > cw && (shape === "rect" || shape === "ellipse" || shape === "para");
  [Wb, Hb] = rot ? [DIMS[shape][1], DIMS[shape][0]] : DIMS[shape];
  const d0 = Math.sqrt(Wb*Hb/CELLS);
  NX = Math.round(Wb/d0); NY = Math.round(Hb/d0); dx = Wb/NX;
  if (shape === "rect") Hb = NY*dx;
  dt = COUR*dx/C_SOUND;
  const N = NX*NY;
  mask = new Uint8Array(N);
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) mask[y*NX+x] = inside((x+0.5)*dx, (y+0.5)*dx) ? 1 : 0;
  K = 0; for (let i = 0; i < N; i++) K += mask[i];
  fl = new Int32Array(K); nl = new Int32Array(K); nr = new Int32Array(K); nu = new Int32Array(K); nd = new Int32Array(K);
  let k = 0;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++){
    const i = y*NX+x; if (!mask[i]) continue;
    fl[k] = i;                                       // vecino pared → la misma celda (pared rígida)
    nl[k] = x > 0 && mask[i-1] ? i-1 : i;      nr[k] = x < NX-1 && mask[i+1] ? i+1 : i;
    nu[k] = y > 0 && mask[i-NX] ? i-NX : i;    nd[k] = y < NY-1 && mask[i+NX] ? i+NX : i;
    k++;
  }
  area = K*dx*dx;
  p0 = new Float32Array(N); p1 = new Float32Array(N); p2 = new Float32Array(N); en = new Float32Array(N);
  off.width = NX; off.height = NY; img = octx.createImageData(NX, NY); px32 = new Uint32Array(img.data.buffer);
  const top = $("card").offsetTop + $("card").offsetHeight + 10, pad = 14;
  const s = Math.min((cw-2*pad)/Wb, (ch-top-pad-14)/Hb);
  rect = {w:Wb*s, h:Hb*s, x:(cw-Wb*s)/2, y:top+(ch-top-14-Hb*s)/2};
  const ensure = p => { if (!mask[p.y*NX+p.x]){ const i = fl[(K*0.5)|0]; p.x = i%NX; p.y = (i/NX)|0; } };
  if (keep){
    srcs.forEach((s, k) => { fromFrac(s, keep.s[k]); ensure(s); }); fromFrac(lis, keep.l); ensure(lis);
  } else {
    const start = {rect:[0.22, 0.3], circle:[0.33, 0.4], tri:[0.4, 0.62], ellipse:[0.3, 0.4], para:[0.35, 0.5]}[shape];
    const spots = [start, [1-start[0], 1-start[1]], [0.5, 0.5]];
    lis.x = Math.round(NX*(1-start[0]*0.9)); lis.y = Math.round(NY*0.55);

      for (let t = 0; t <= 96; t++){
        const th = t/96*Math.PI*2, r = 28*(sr.pattern === "cardioid" ? (1+Math.cos(th))/2 : Math.abs(Math.cos(th))), a = th + sr.orient;
        t ? rctx.lineTo(X + r*Math.cos(a), Y + r*Math.sin(a)) : rctx.moveTo(X + r*Math.cos(a), Y + r*Math.sin(a));
      }
      rctx.stroke();
    }
    rctx.fillStyle = "#ffffff"; rctx.beginPath(); rctx.arc(X, Y, 7, 0, Math.PI*2); rctx.fill();
    if (srcs.length > 1){
      rctx.strokeStyle = k === sel ? "#ffc94a" : "rgba(255,255,255,0.35)"; rctx.lineWidth = 2.5;
      rctx.beginPath(); rctx.arc(X, Y, 10, 0, Math.PI*2); rctx.stroke();
      rctx.fillStyle = k === sel ? "#ffc94a" : "#eef1ff"; rctx.font = "800 13px Inter, sans-serif";
      rctx.fillText(String(k+1), X + 11, Y - 11);
    }
  });
  // oyente: distancia a cada parlante y posición desde la esquina
  const X = cellX(lis.x), Y = cellY(lis.y);
  rctx.save();
  rctx.font = "700 12px Inter, sans-serif"; rctx.strokeStyle = "rgba(255,255,255,0.3)"; rctx.setLineDash([2, 5]); rctx.lineWidth = 1;
  srcs.forEach((s, k) => {
    const sx = cellX(s.x), sy = cellY(s.y);
    rctx.beginPath(); rctx.moveTo(X, Y); rctx.lineTo(sx, sy); rctx.stroke();
    rctx.fillStyle = "rgba(238,241,255,0.85)";
    rctx.fillText((srcs.length > 1 ? (k+1) + ": " : "") + fmt(Math.hypot(s.x - lis.x, s.y - lis.y)*dx, 1) + " m", (X+sx)/2 + 4, (Y+sy)/2 - 4);
  });
  rctx.restore();
  rctx.strokeStyle = "#5ec8f2"; rctx.fillStyle = "#5ec8f2"; rctx.lineWidth = 2.6;
  rctx.beginPath(); rctx.arc(X, Y+2, 10, Math.PI, 0); rctx.stroke();
  rctx.fillRect(X-12.5, Y, 6, 9); rctx.fillRect(X+6.5, Y, 6, 9);
  rctx.font = "800 12px Inter, sans-serif"; rctx.textAlign = "center"; rctx.fillText("Oyente", X, Y+24); rctx.textAlign = "start";
  // escala de 1 m
  const m1 = rect.w/Wb, bx = rect.x+rect.w, by = rect.y+rect.h+11;
  rctx.strokeStyle = FG; rctx.lineWidth = 2;
  rctx.beginPath(); rctx.moveTo(bx-m1, by); rctx.lineTo(bx, by); rctx.stroke();
  rctx.fillStyle = FG; rctx.font = "700 12px Inter, sans-serif"; rctx.fillText("1 m", bx-m1-28, by+4);
}

// ---------- Interfaz ----------
function nearMode(){ for (const md of modes) if (Math.abs(md.f-freq)/md.f < 0.004) return md; return null; }
const modeName = md => md.a === null ? `modo ${md.idx}` : `modo (${md.a},${md.b})`;
function updateLabels(){
  const md = nearMode();
  $("say").textContent = !modes.length ? "Calculando las notas de esta sala…"
                       : md ? "La sala resuena: el sonido es fuerte en unas zonas y débil en otras."
                            : "Toca una nota y arrastra el parlante o el oyente.";
  $("t60").textContent = fmt(6.91/beta, 2) + " s";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", !!md && +c.dataset.k === modes.indexOf(md)));
  dataT = 0;
}
function buildChips(){
  const box = $("chips"); box.innerHTML = "";
  if (!modes.length){ box.innerHTML = '<span class="wait">Calculando las notas de esta sala…</span>'; return; }
  modes.slice(0, 14).forEach((md, k) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.k = k;
    b.innerHTML = `${k+1}<small>${fmt(md.f, md.f < 100 ? 1 : 0)} Hz</small>`;
    b.setAttribute("aria-label", `Nota ${k+1}, ${fmt(md.f, 1)} hercios`);
    b.addEventListener("click", () => setFreq(md.f));
    box.appendChild(b);
  });
}
function setFreq(f){ freq = Math.min(FMAX, Math.max(FMIN, f)); updateLabels(); }

function plotPick(e){
  const r = plot.getBoundingClientRect(), t = Math.min(1, Math.max(0, (e.clientX-r.left)/r.width));
  let f = xf(t);
  for (const md of modes){ if (Math.abs(fx(md.f)-t)*r.width < 8){ f = md.f; break; } }   // imán a los modos
  setFreq(f);
}
let plotDrag = false;
plot.addEventListener("pointerdown", e => { plotDrag = true; plot.setPointerCapture(e.pointerId); plotPick(e); });
plot.addEventListener("pointermove", e => { if (plotDrag) plotPick(e); });
plot.addEventListener("pointerup", () => plotDrag = false);
plot.addEventListener("pointercancel", () => plotDrag = false);

let roomDrag = false;
function moveSrc(e){
  const r = room.getBoundingClientRect(), X = e.clientX-r.left, Y = e.clientY-r.top;
  const x = Math.floor((X-rect.x)/rect.w*NX), y = Math.floor((Y-rect.y)/rect.h*NY);
  if (x < 1 || y < 1 || x > NX-2 || y > NY-2 || !mask[y*NX+x]) return;   // solo dentro de la sala
  if (dragLis){ lis.x = x; lis.y = y; return; }
  srcs[sel].x = x; srcs[sel].y = y; dirty = true;
}
room.addEventListener("pointerdown", e => {
  const r = room.getBoundingClientRect(), X = e.clientX-r.left, Y = e.clientY-r.top;
  const dl = Math.hypot(cellX(lis.x)-X, cellY(lis.y)-Y);
  let best = -1, bd = 1e9;
  srcs.forEach((s, k) => { const d = Math.hypot(cellX(s.x)-X, cellY(s.y)-Y); if (d < bd){ bd = d; best = k; } });
  if (Math.min(dl, bd) > 44) return;                // hay que tocar el parlante o el oyente (44 px de margen)
  roomDrag = true; room.setPointerCapture(e.pointerId);
  dragLis = dl < bd;
  if (!dragLis && best !== sel){ sel = best; syncSrcUI(); }
  moveSrc(e);
});
room.addEventListener("pointermove", e => { if (roomDrag) moveSrc(e); });
room.addEventListener("pointerup", () => roomDrag = false);
room.addEventListener("pointercancel", () => roomDrag = false);

document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b));
}));
document.querySelectorAll("[data-shape]").forEach(b => b.addEventListener("click", () => {
  if (shape === b.dataset.shape) return;
  shape = b.dataset.shape;
  document.querySelectorAll("[data-shape]").forEach(x => x.setAttribute("aria-pressed", x === b));
  setup(false);
}));
document.querySelectorAll("[data-pat]").forEach(b => b.addEventListener("click", () => { srcs[sel].pattern = b.dataset.pat; dirty = true; syncSrcUI(); }));
$("orient").addEventListener("input", e => { srcs[sel].orient = +e.target.value*Math.PI/180; $("orientOut").textContent = e.target.value + "°"; dirty = true; });
$("phaseIn").addEventListener("input", e => { srcs[sel].ph = +e.target.value*Math.PI/180; $("phaseOut").textContent = e.target.value + "°"; dirty = true; });
function syncSrcUI(){
  const s = srcs[sel], seg = $("srcSeg");
  seg.innerHTML = "";
  srcs.forEach((_, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.textContent = "Parlante " + (k+1); b.setAttribute("aria-pressed", k === sel);
    b.addEventListener("click", () => { sel = k; syncSrcUI(); });
    seg.appendChild(b);
  });
  seg.hidden = srcs.length < 2;
  $("addSrc").disabled = srcs.length >= MAX_SRC;
  $("delSrc").disabled = srcs.length < 2;
  $("phaseWrap").hidden = srcs.length < 2;
  document.querySelectorAll("[data-pat]").forEach(x => x.setAttribute("aria-pressed", x.dataset.pat === s.pattern));
  $("orientWrap").hidden = s.pattern === "omni";
  const deg = Math.round(s.orient*180/Math.PI), pd = Math.round(s.ph*180/Math.PI);
  $("orient").value = deg; $("orientOut").textContent = deg + "°";
  $("phaseIn").value = pd; $("phaseOut").textContent = pd + "°";
}
$("addSrc").addEventListener("click", () => {
  if (srcs.length >= MAX_SRC) return;
  const s0 = srcs[sel], cand = [[NX-1-s0.x, s0.y], [s0.x, NY-1-s0.y], [NX-1-s0.x, NY-1-s0.y]];
  let p = cand.find(([x, y]) => mask[y*NX+x] && !srcs.some(q => Math.hypot(q.x-x, q.y-y) < 8));
  if (!p){ const i = fl[(K*0.5)|0]; p = [i%NX, (i/NX)|0]; }
  srcs.push({x:p[0], y:p[1], pattern:"omni", orient:0, ph:0});
  sel = srcs.length-1; dirty = true; syncSrcUI();
});
$("delSrc").addEventListener("click", () => {
  if (srcs.length < 2) return;
  srcs.splice(sel, 1); sel = Math.max(0, sel-1); dirty = true; syncSrcUI();
});
$("damp").addEventListener("input", e => { beta = +e.target.value; dirty = true; updateLabels(); });
const PLAY = '<path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor"/>', PAUSE = '<rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"/>';
$("pause").addEventListener("click", () => { paused = !paused; $("pauseIco").innerHTML = paused ? PLAY : PAUSE; $("pauseLbl").textContent = paused ? "Seguir" : "Pausa"; });
$("reset").addEventListener("click", () => { p0.fill(0); p1.fill(0); p2.fill(0); en.fill(0); stepN = 0; pk = 1e-6; ek = 1e-9; });
$("more").addEventListener("click", () => {
  const open = $("sheet").hidden; $("sheet").hidden = !open; $("shapeBox").hidden = open; $("more").setAttribute("aria-pressed", open); dirty = true;
});

// ---------- Sonido real ----------
// Se reproduce un tono a la frecuencia elegida. Su volumen sigue el nivel que la simulación
// calcula en el oyente, comparado con el de una sola fuente en campo libre a 1 m (en 2D ese
// nivel cae como 1/f; calibrado numéricamente: p²·f ≈ 1,1). Resonancias y cancelaciones se oyen.
const FF = 1.1;
let actx = null, osc = null, gainN = null, listening = false;
function roomLevel(){
  let e = 0, n = 0;
  for (let dy = -1; dy <= 1; dy++) for (let dxx = -1; dxx <= 1; dxx++){
    const i = (lis.y+dy)*NX + lis.x+dxx; if (mask[i]){ e += en[i]; n++; }
  }
  return 10*Math.log10(Math.max(1e-12, e/Math.max(1, n))/(FF/freq));
}
let toastT = 0;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.remove("off"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("off"), 4500); }
function toggleListen(){
  listening = !listening;
  $("listen").setAttribute("aria-pressed", listening);
  $("listenLbl").textContent = listening ? "Callar" : "Escuchar";
  if (listening){
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC){ listening = false; $("listen").disabled = true; return; }
      actx = new AC(); gainN = actx.createGain(); gainN.gain.value = 0; gainN.connect(actx.destination);
    }
    actx.resume();
    osc = actx.createOscillator(); osc.type = "sine"; osc.frequency.value = freq; osc.connect(gainN); osc.start();
    toast("Usa audífonos: bajo 100 Hz el parlante del celular casi no suena.");
  } else if (osc){
    const t = actx.currentTime; gainN.gain.cancelScheduledValues(t); gainN.gain.setTargetAtTime(0, t, 0.03);
    const o = osc; setTimeout(() => o.stop(), 200); osc = null;
  }
}
$("listen").addEventListener("click", toggleListen);
let dataT = 0;
function updateAudio(now){
  levelDb = roomLevel();
  if (now - dataT > 150){
    dataT = now;
    const md = nearMode();
    $("data").textContent = `${fmt(freq, freq < 100 ? 1 : 0)} Hz · λ = ${fmt(C_SOUND/freq, 2)} m · oyente ${levelDb >= 0 ? "+" : "−"}${fmt(Math.abs(levelDb), 0)} dB` + (md ? ` · ${modeName(md)}` : "");
  }
  if (!listening || !osc) return;
  const t = actx.currentTime, g = Math.min(0.8, 0.08*Math.pow(10, levelDb/20));
  osc.frequency.setTargetAtTime(freq, t, 0.02);
  gainN.gain.setTargetAtTime(g, t, 0.08);
}

// ---------- Bucle ----------
// Cámara lenta: unos 10 cuadros de 1/60 s por periodo. Los pasos se reparten según el tiempo real
// (igual a 60 Hz que a 120 Hz) y nunca usan más de BUDGET ms por cuadro.
const SPF_MAX = Math.round(24*Math.sqrt(CELLS/30000));
let last = 0, acc = 0;
function frame(now){
  const dt60 = last ? Math.min(50, now-last)/16.7 : 1; last = now;
  if (!paused){
    const per = 1/(freq*dt), spf = Math.max(6, Math.min(SPF_MAX, Math.round(per/10)));
    acc += spf*dt60;
    const want = Math.min(Math.floor(acc), 2*SPF_MAX); acc -= Math.floor(acc);
    const t0 = performance.now(); let done = 0;
    while (done < want){ step(); done++; if ((done & 3) === 0 && performance.now()-t0 > BUDGET) break; }
    if (done < want) acc = 0;
  }
  drawRoom();
  if (!$("sheet").hidden) drawPlot();
  updateAudio(now);
  requestAnimationFrame(frame);
}
let rt = 0, lastW = 0, lastH = 0;
new ResizeObserver(() => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (room.clientWidth !== lastW || room.clientHeight !== lastH){ lastW = room.clientWidth; lastH = room.clientHeight; setup(true); } }, 150);
}).observe(room);
$("pauseIco").innerHTML = PAUSE;
setup(false); syncSrcUI(); lastW = room.clientWidth; lastH = room.clientHeight;
requestAnimationFrame(frame);
})();
</script>

<script>(function(){
function sync(){var t=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-theme-set")===t);});
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--background").trim());}
window.SyMulaTheme=function(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("symula-tema",t);}catch(e){}sync();
  window.dispatchEvent(new Event("symula-tema"));};
// colores del tema para dibujar en el lienzo: SyMulaColor("sem-1"), SyMulaColor("primary")...
window.SyMulaColor=function(name){return getComputedStyle(document.documentElement).getPropertyValue("--"+name).trim();};
document.querySelectorAll("[data-theme-set]").forEach(function(b){b.addEventListener("click",function(){SyMulaTheme(b.getAttribute("data-theme-set"));});});
try{if(!localStorage.getItem("symula-tema")&&window.matchMedia)matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(e){document.documentElement.setAttribute("data-theme",e.matches?"light":"dark");sync();window.dispatchEvent(new Event("symula-tema"));});}catch(e){}
sync();})();</script>
