<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1226">
<title>Planetas: las leyes de Kepler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== SyMula: estilo común (igual en todos los simuladores) ===== */
:root{
  --bg:#0b1226;--panel:#121a36;--btn:#1b2650;--line:#2c3a6e;--ink:#eef1ff;--soft:#a3aed8;--acc:#ffc94a;--acc-ink:#2a1c00;--cyan:#5ec8f2;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b1226;--panel:#121a36;--btn:#1b2650;--line:#2c3a6e;--ink:#eef1ff;--soft:#a3aed8;--acc:#ffc94a;--acc-ink:#2a1c00;--cyan:#5ec8f2}
}
:root[data-theme="dark"]{--bg:#0b1226;--panel:#121a36;--btn:#1b2650;--line:#2c3a6e;--ink:#eef1ff;--soft:#a3aed8;--acc:#ffc94a;--acc-ink:#2a1c00;--cyan:#5ec8f2}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font:700 15px/1.3 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.home{position:absolute;top:10px;left:10px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;z-index:3;
  background:rgba(18,26,54,.88);border:1px solid var(--line);color:var(--ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{position:absolute;top:10px;left:72px;right:10px;max-width:460px;min-height:52px;padding:7px 12px;border-radius:16px;z-index:2;pointer-events:none;
  background:rgba(18,26,54,.88);border:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card h1{font:800 18px/1.15 Nunito,sans-serif;margin:0;color:var(--acc)}
.card p{margin:2px 0 0;font-size:14px;color:#d8ddf7}
.card .data{font-size:13px;color:#8fd8ff;font-variant-numeric:tabular-nums}
.card p:empty{display:none}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:92%;padding:10px 18px;border-radius:999px;z-index:3;
  background:var(--acc);color:var(--acc-ink);font-weight:800;text-align:center;pointer-events:none;transition:opacity .4s}
.toast.off{opacity:0}
.dock{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.dock>*{width:100%;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px}
.tile{flex:1 1 0;min-width:0;min-height:60px;padding:6px 3px;border-radius:16px;border:1px solid var(--line);background:var(--btn);color:var(--ink);
  font:800 13px/1.1 Nunito,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;touch-action:manipulation}
.tile svg{width:26px;height:26px;flex:none}
.tile[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tile:active{transform:scale(.96)}
.tile:disabled{opacity:.4;cursor:default}
.lbl{font-size:12px;font-weight:800;color:var(--soft);margin-bottom:-3px;padding:0 2px}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
/* ===== fin del estilo común ===== */
.tile small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-top:-2px}
.card{right:auto;max-width:calc(100% - 82px);pointer-events:auto;display:flex;flex-direction:column;justify-content:center;padding:6px 6px 6px 12px}
.card p{font-size:13.5px;padding-right:6px}
.ctop{display:flex;align-items:center;gap:10px}
.card h1{font-size:16px;white-space:nowrap}
.energy{font-size:14px;color:#8fd8ff;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{flex:none;width:40px;height:40px;margin-left:auto;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--ink);font:800 17px Nunito,sans-serif;cursor:pointer}
.info[aria-expanded="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.corner.wide{width:auto;padding:0 14px;display:flex;align-items:center;gap:8px;font:800 14px Nunito,sans-serif}
.lbar{position:absolute;left:72px;bottom:10px;display:flex;gap:8px;z-index:3}
.lbar .corner{position:static}
.corner[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.zoom .corner{position:static}
.corner:disabled{opacity:.4}
.toast{bottom:72px}
/* "Solo ver": se oculta todo menos las órbitas; queda un botón tenue para volver */
body.clean .home,body.clean .card,body.clean #hideDock,body.clean .lbar,body.clean .zoom,body.clean .dock,body.clean .toast{display:none!important}
#showAll{display:none;left:auto;right:10px;opacity:.55}
body.clean #showAll{display:grid}
.corner{position:absolute;left:10px;bottom:10px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;z-index:3;cursor:pointer;padding:0;
  background:rgba(18,26,54,.88);border:1px solid var(--line);color:var(--ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* Botones semitransparentes: la botonera flota sobre el espacio y todo deja ver las órbitas detrás */
body{position:relative}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:4;background:rgba(18,26,54,.42);border-top-color:rgba(44,58,110,.6);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dock .tile:not([aria-pressed="true"]),.info:not([aria-expanded="true"]){background:rgba(27,38,80,.5);border-color:rgba(44,58,110,.7)}
.home,.card,.corner:not([aria-pressed="true"]){background:rgba(18,26,54,.45)}
.lbar,.zoom,#hideDock,#showAll{bottom:calc(var(--dock-h, 0px) + 10px)}
.toast{bottom:calc(var(--dock-h, 0px) + 72px)}
/* Modo noche: todo en verde y más oscuro, para mirar sin encandilarse */
body.night{filter:grayscale(1) sepia(1) hue-rotate(72deg) saturate(2.6) brightness(.78)}
</style>
</head>

<script>
(function(){
"use strict";
// Física: unidades con r = 1 (1 UA) de referencia y G·M☉ = 1, así una órbita circular en r = 1
// tarda 2π unidades = 1 año. Sol fijo: a(r) = 1/r^n.  Masas que se atraen: cada masa j acelera a i con m_j / r^n.
const DT = 0.0025, SUB = 6, SUN_R = 0.07, ESCAPE = 56, FAR = 2000, TRAIL = 1500, MAXP = 10, MAXN = 6, RMIN = 0.02;
const ETA = 0.015, MAXSUB = 4000, TRAIL_STEP = 0.006, YEAR = 2*Math.PI;
const COLORS = ["#5ec8f2","#f27b9b","#9be37c","#c7a2ff","#ffd166","#4fd1c5","#ff8a5c","#f0a742"];
const INFO_C = {}, INFO_N = "", FML = {}, KEP = {};   // (textos de la versión técnica: no se usan aquí)

let n = 2, mode = "central", bodies = [], paused = false, speed = 1, colorIdx = 0, drag = null, newMass = 1, tick = 0;
let mergeOn = true;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), $ = id => document.getElementById(id);
let Wd = 0, Hd = 0, dpr = 1, scale = 1, baseScale = 1, zoom = 1, cx = 0, cy = 0;
function resize(){
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  Wd = cv.clientWidth; Hd = cv.clientHeight;
  cv.width = Math.round(Wd*dpr); cv.height = Math.round(Hd*dpr);
  const top = document.querySelector(".card").offsetHeight + 20, bot = dockH;
  baseScale = 0.245*Math.min(Wd, Hd - (top + bot)*0.6); scale = baseScale*zoom*uz; cx = Wd/2; cy = top + (Hd - top - bot)/2;   // entre la tarjeta y la botonera
}
new ResizeObserver(resize).observe(cv);
let dockH = 0;                                       // alto de la botonera que flota sobre el espacio
new ResizeObserver(() => { dockH = document.getElementById("dock").offsetHeight; document.body.style.setProperty("--dock-h", dockH + "px"); resize(); }).observe(document.getElementById("dock"));
// cámara: en "Masas que se atraen" sigue con suavidad a la masa más grande; con el Sol queda en el origen
// vista fija: solo se mueve si la persona la desplaza (camX, camY) o hace zoom (uz)
let camX = 0, camY = 0, uz = 1;
const toWorld = (sx, sy) => [(sx-cx)/scale + camX, (sy-cy)/scale + camY];
const toScreen = (x, y) => [cx+(x-camX)*scale, cy+(y-camY)*scale];
const radius = m => 0.035*Math.cbrt(m);

// ---------- Física: Sol fijo (planetas sin masa) ----------
function accC(x, y){
  const r = Math.sqrt(x*x+y*y) || 1e-9, a = Math.pow(Math.max(r, RMIN), -n);
  return [-a*x/r, -a*y/r];
}
function stepC(p, h = DT){                           // leapfrog (simpléctico)
  p.vx += p.ax*h/2; p.vy += p.ay*h/2;
  p.x += p.vx*h; p.y += p.vy*h;
  [p.ax, p.ay] = accC(p.x, p.y);
  p.vx += p.ax*h/2; p.vy += p.ay*h/2;
}
const aliveC = p => { const r = Math.hypot(p.x, p.y); return r > SUN_R && r < FAR; };

// ---------- Física: N cuerpos ----------
function accN(bs){
  for (const b of bs){ b.ax = 0; b.ay = 0; }
  for (let i = 0; i < bs.length; i++) for (let j = i+1; j < bs.length; j++){
    const a = bs[i], b = bs[j], dx = b.x-a.x, dy = b.y-a.y, r = Math.hypot(dx, dy) || 1e-9;
    // sin fusión, la fuerza se suaviza dentro de los radios para que las masas se atraviesen sin dispararse
    const s = Math.pow(Math.max(r, mergeOn ? RMIN : radius(a.m)+radius(b.m)), -n)/r;

// ---------- Polvo galáctico ----------

// Verificado en Node: una órbita circular conserva el radio dentro de ~2,5 % tras 20 vueltas,

const MAXD = 6000, ETA_D = 0.03, KMAX_D = 60;

function addDust(x, y, count){
  const gas = gasMat, spread = gas ? 0.3 : 0.12;
  const c0 = mode === "nbody" ? com(bodies) : {VX:0, VY:0};
  for (let k = 0; k < count; k++){
    const g1 = Math.random()+Math.random()-1, g2 = Math.random()+Math.random()-1;   // nube más densa al centro
    const px = x + g1*spread, py = y + g2*spread;
    if (mode === "central" && Math.hypot(px, py) < SUN_R*1.5) continue;
    let vx, vy;
    if (dustRest){ vx = c0.VX; vy = c0.VY; }

    dX[i] = px; dY[i] = py; dVX[i] = vx; dVY[i] = vy;
    const u = Math.random(); let ci = 0; while (u > PAL_CUM[ci]) ci++;

// Dibujo del polvo: un resplandor difuso (densidad acumulada en una malla de 8 px y ampliada con

const HS = 8, hz = document.createElement("canvas"), hctx = hz.getContext("2d");
let hw = 0, hh = 0, hImg = null, hAcc = null;
const DUST_STYLE = PAL.map(c => [`rgba(${c},0.42)`, `rgba(${c},0.9)`]);
function drawDust(){
  if (!dN) return;
  const w = Math.ceil(Wd/HS) + 1, h = Math.ceil(Hd/HS) + 1;
  if (w !== hw || h !== hh){ hw = w; hh = h; hz.width = w; hz.height = h; hImg = hctx.createImageData(w, h); hAcc = new Float32Array(w*h*3); }
  hAcc.fill(0);

    d[j*4+1] = 255*(1 - Math.exp(-hAcc[k+1]/1100));

    for (let i = 0; i < dN; i++) if (dC[i] === c && dB[i] === b) ctx.fillRect(ox + dX[i]*scale - sz/2, oy + dY[i]*scale - sz/2, sz, sz);

  for (let i = 0; i < dN; i++){                     // estrellas brillantes con un pequeño halo

const GS = 22, gz = document.createElement("canvas"), gctx = gz.getContext("2d");
let gw = 0, gh2 = 0, gImg = null, gAcc = null;
function drawGas(ox, oy){                            // nebulosa: densidad del gas en celdas de 22 px, muy suavizada
  const w = Math.ceil(Wd/GS) + 2, h = Math.ceil(Hd/GS) + 2;
  if (w !== gw || h !== gh2){ gw = w; gh2 = h; gz.width = w; gz.height = h; gImg = gctx.createImageData(w, h); gAcc = new Float32Array(w*h*3); }
  gAcc.fill(0);

    if (gx < 0 || gy < 0 || gx >= w-1 || gy >= h-1) continue;

// ---------- Crear cuerpos ----------
function makeBody(x, y, vx, vy, m){ return {x, y, vx, vy, ax:0, ay:0, m, kind:"star", trail:[[x, y]], color:COLORS[colorIdx++ % COLORS.length]}; }
function addBody(x, y, vx, vy){
  if (mode === "central"){
    const b = makeBody(x, y, vx, vy, 0); [b.ax, b.ay] = accC(x, y);
    bodies.push(b); if (bodies.length > MAXP) bodies.shift();
  } else {
    if (bodies.length >= MAXN){ toast("Máximo 6 masas. Usa Borrar para empezar de nuevo."); return; }
    bodies.push(makeBody(x, y, vx, vy, newMass)); zeroMomentum(bodies); accN(bodies);
  }

}
function circularVel(x, y){                          // perpendicular al radio, antihorario en pantalla

    ox = c.X; oy = c.Y; M = c.M + newMass;          // órbita relativa de dos cuerpos: usa la masa total
  }
  const dx = x-ox, dy = y-oy, r = Math.hypot(dx, dy) || 1e-9, v = Math.sqrt(M*Math.pow(r, 1-n));

function predict(x, y, vx, vy, massless){
  const pts = [[x, y]];

    const p = {x, y, vx, vy, ax:0, ay:0}; [p.ax, p.ay] = accC(x, y);
    for (let k = 0; k < 2400; k++){ stepC(p); if (!aliveC(p)){ pts.push([p.x, p.y]); break; } if (k % 4 === 0) pts.push([p.x, p.y]); }

    const bs = bodies.map(b => ({x:b.x, y:b.y, vx:b.vx, vy:b.vy, ax:0, ay:0, m:b.m}));
    const me = {x, y, vx, vy, ax:0, ay:0, m:massless ? 1e-6 : newMass}; bs.push(me); zeroMomentum(bs); accN(bs);
    for (let k = 0; k < 1600; k++){ stepN(bs); if (k % 4 === 0) pts.push([me.x, me.y]); }

// ---------- Escenarios de N cuerpos ----------
function preset(name){
  camX = 0; camY = 0;
  bodies = []; colorIdx = 0;
  const add = (x, y, vx, vy, m) => bodies.push(makeBody(x, y, vx, vy, m));
  if (name === "binaria"){                           // separación 1: fuerza = 1 con cualquier ley
    const v = Math.sqrt(0.5);
    add(0.5, 0, 0, -v, 1); add(-0.5, 0, 0, v, 1);
  } else if (name === "ocho"){                       // Chenciner–Montgomery (exacta solo con 1/r²)
    const x1 = 0.97000436, y1 = -0.24308753, vx = -0.93240737, vy = -0.86473146;
    add(x1, y1, -vx/2, -vy/2, 1); add(-x1, -y1, -vx/2, -vy/2, 1); add(0, 0, vx, vy, 1);
  } else if (name === "cuadrado"){                   // 4 masas iguales, órbita circular para la ley activa
    const ac = Math.SQRT2*Math.pow(2, -n/2) + Math.pow(2, -n), v = Math.sqrt(ac);
    for (let k = 0; k < 4; k++){ const a = k*Math.PI/2, x = Math.cos(a), y = Math.sin(a); add(x, y, y*v, -x*v, 1); }

  } else if (name === "sistema"){                    // estrella masiva y 3 planetas livianos que se perturban
    add(0, 0, 0, 0, 3);
    for (const [r, m] of [[0.7, 0.05], [1.2, 0.08], [1.85, 0.12]]){
      const v = Math.sqrt(3*Math.pow(r, 1-n)), a = Math.random()*Math.PI*2, x = r*Math.cos(a), y = r*Math.sin(a);
      add(x, y, y/r*v, -x/r*v, m);

}

// ---------- Sonidos suaves ----------
let actx = null, soundOn = true;
function tone(f0, f1, dur, type = "sine", vol = 0.14){
  if (!soundOn) return;
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.03);
  } catch (err) {}
}
const sPop = () => tone(420, 760, 0.1), sEat = () => tone(260, 80, 0.5, "triangle", 0.22);

// ---------- Cometas ----------
// Sin masa, como el polvo: sienten la gravedad pero no atraen a nadie. Paso adaptativo más fino
// (ETA_C) porque pasan muy cerca de la estrella. Dos colas que apuntan en contra de la estrella que más
// lo atrae: la de gas (azul, recta) y la de polvo (curvada hacia atrás). Cerca de la estrella sueltan
// polvo que sigue su órbita, como el que produce las lluvias de estrellas.
const MAXC = 4, ETA_C = 0.008, KMAX_C = 400, COMET_ON = 4;   // a menos de 4 UA se forma la cola
let comets = [], cometTool = false;
function addComet(x, y, vx, vy){
  if (comets.length >= MAXC) comets.shift();
  comets.push({x, y, vx, vy, trail:[[x, y]]}); sPop();
}
function cometSource(c){                             // [x, y] de la estrella que más lo atrae
  if (mode === "central" || !bodies.length) return [0, 0];
  let best = bodies[0], bp = 0;
  for (const b of bodies){ const q = b.m*invPow(Math.max(Math.hypot(b.x-c.x, b.y-c.y), RMIN)); if (q > bp){ bp = q; best = b; } }
  return [best.x, best.y];
}
function stepComets(T){
  let Mt = 1; if (mode === "nbody"){ Mt = 0; for (const b of bodies) Mt += b.m; }
  for (const c of comets){
    if (!Mt){ c.dead = true; continue; }
    let rmin = Math.hypot(c.x, c.y);
    if (mode === "nbody"){ rmin = Infinity; for (const b of bodies) rmin = Math.min(rmin, Math.hypot(b.x-c.x, b.y-c.y)); }
    const k = Math.min(KMAX_C, Math.max(4, Math.ceil(T/(ETA_C*Math.sqrt(Math.pow(Math.max(rmin, RMIN), n+1)/Mt))))), h = T/k;
    if (!accDust(c.x, c.y)){ c.dead = true; continue; }
    for (let s = 0; s < k; s++){                     // leapfrog
      c.vx += gax*h/2; c.vy += gay*h/2; c.x += c.vx*h; c.y += c.vy*h;
      if (!accDust(c.x, c.y)){ c.dead = true; break; }
      c.vx += gax*h/2; c.vy += gay*h/2;
    }
    if (c.dead) continue;
    if (c.x*c.x + c.y*c.y > FAR*FAR){ c.dead = true; continue; }
    const l = c.trail[c.trail.length-1];
    if (Math.hypot(c.x-l[0], c.y-l[1]) > TRAIL_STEP){ c.trail.push([c.x, c.y]); if (c.trail.length > TRAIL) c.trail.shift(); }
    const [sx, sy] = cometSource(c), r = Math.max(Math.hypot(c.x-sx, c.y-sy), 0.05);
    let want = r < COMET_ON ? Math.min(6, 0.5/(r*r))*T/0.015 : 0;       // más polvo cuanto más cerca de la estrella
    while (want > 0){
      if (Math.random() < want){
        const ux = (c.x-sx)/r, uy = (c.y-sy)/r, sp = Math.hypot(c.vx, c.vy)*0.04;
        addDustRaw(c.x, c.y, c.vx + ux*sp*0.5 + (Math.random()-0.5)*sp, c.vy + uy*sp*0.5 + (Math.random()-0.5)*sp, Math.random() < 0.6 ? 2 : 0, Math.random() < 0.05 ? 2 : 1);
      }
      want -= 1;
    }
  }
  if (comets.some(c => c.dead)){
    if (comets.some(c => c.dead && accDust(c.x, c.y) === false)) toast("El cometa chocó con la estrella y se evaporó.", 3000);
    comets = comets.filter(c => !c.dead);
  }
}
function drawComets(){
  for (const c of comets){
    const t = c.trail;                               // órbita recorrida, tenue
    if (t.length > 1){
      ctx.strokeStyle = "rgba(170,215,255,0.22)"; ctx.lineWidth = 1.2; ctx.beginPath();
      t.forEach(([x, y], k) => { const [X, Y] = toScreen(x, y); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
      ctx.stroke();
    }
    const [X, Y] = toScreen(c.x, c.y), [sx, sy] = cometSource(c), r = Math.max(Math.hypot(c.x-sx, c.y-sy), 0.05);
    const ux = (c.x-sx)/r, uy = (c.y-sy)/r, v = Math.hypot(c.vx, c.vy) || 1;
    // Lejos de la estrella el cometa es solo un núcleo de hielo. Al acercarse (menos de COMET_ON UA) el hielo
    // se evapora: aparece la coma y la cola, que crece y brilla más cuanto más cerca pasa.
    const q = Math.min(1, Math.max(0, (COMET_ON - r)/(COMET_ON - 0.4))), act = q*q*(3 - 2*q);
    ctx.globalCompositeOperation = "lighter";
    if (act > 0.01){
      const L = Math.max(act*90, act*Math.min(3, 0.35 + 0.9/r)*scale);    // largo de la cola en px
      const tail = (dx, dy, len, w, c0, c1) => {
        const ex = X + dx*len, ey = Y + dy*len, nx = -dy, ny = dx;
        const g = ctx.createLinearGradient(X, Y, ex, ey); g.addColorStop(0, c0); g.addColorStop(1, c1);
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(X + nx*2, Y + ny*2);
        ctx.lineTo(ex + nx*w, ey + ny*w); ctx.lineTo(ex - nx*w, ey - ny*w); ctx.lineTo(X - nx*2, Y - ny*2); ctx.fill();
      };
      // cola de polvo: ancha, amarillenta y curvada hacia atrás de la órbita
      const bx = -c.vx/v, by = -c.vy/v, Ld = L*0.85;
      for (let k = 1; k <= 14; k++){
        const t = k/14, px = X + (ux*t + bx*0.55*t*t)*Ld, py = Y + (uy*t + by*0.55*t*t)*Ld;
        const rr = 3 + t*Math.min(22, 5 + Ld*0.12);
        glow(px, py, rr, `rgba(255,232,190,${(0.32*act*(1 - t)).toFixed(3)})`, "rgba(255,232,190,0)");
      }
      tail(ux, uy, L, Math.min(10, 2 + L*0.04), `rgba(140,200,255,${(0.8*act).toFixed(3)})`, "rgba(140,200,255,0)");   // gas: recta, azul
      glow(X, Y, 6 + 12*act, `rgba(200,230,255,${(0.35 + 0.5*act).toFixed(3)})`, "rgba(200,230,255,0)");             // coma
    } else glow(X, Y, 5, "rgba(210,225,240,0.4)", "rgba(210,225,240,0)");
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(X, Y, 2.6, 0, Math.PI*2); ctx.fill();
  }
}

// ---------- Láser: luz que la gravedad curva ----------
// La luz siempre va a la misma rapidez c; la gravedad solo le cambia la dirección. Según la relatividad
// general se desvía el doble que una partícula lenta, así que se usa a = 2·g (y se vuelve a fijar |v| = c).
// Con la c real (10 066 en estas unidades) la desviación junto al Sol es de 1,75 segundos de arco, invisible;
// aquí c = 6 (unos 180 km/s) para que la curva se vea: rozando el Sol se desvía unos 30°.
const C_LUZ = 6, MAXL = 3;
let lasers = [];
function traceRay(x, y, dx, dy){
  const d = Math.hypot(dx, dy) || 1; let vx = dx/d*C_LUZ, vy = dy/d*C_LUZ;
  const pts = [[x, y]], dsMax = 4/scale;                 // pasos de unos 4 px en pantalla
  const far = Math.hypot(x - camX, y - camY) + 1.3*Math.hypot(Wd, Hd)/scale;
  let s = 0, hit = false;
  for (let k = 0; k < 5000 && s < far; k++){
    let ax = 0, ay = 0, dmin = Infinity;
    if (mode === "central"){
      const r = Math.hypot(x, y); if (r < SUN_R){ hit = true; break; }
      const a = invPow(r)/r; ax = -a*x; ay = -a*y; dmin = r;
    } else for (const b of bodies){
      const ddx = b.x - x, ddy = b.y - y, r = Math.hypot(ddx, ddy);
      if (r < Math.max(radius(shownMass(b)), 0.02)){ hit = true; break; }
      const a = b.m*invPow(r)/r; ax += a*ddx; ay += a*ddy; dmin = Math.min(dmin, r);
    }
    if (hit) break;
    const ds = Math.min(dsMax, Math.max(0.001, 0.05*dmin)), h = ds/C_LUZ;
    vx += 2*ax*h; vy += 2*ay*h;
    const v = Math.hypot(vx, vy); vx *= C_LUZ/v; vy *= C_LUZ/v;
    x += vx*h; y += vy*h; s += ds;
    if (k % 2 === 0) pts.push([x, y]);
  }
  pts.push([x, y]);
  return {pts, hit};
}
function drawRay(x, y, dx, dy, alpha = 1){
  const {pts, hit} = traceRay(x, y, dx, dy);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const line = () => { ctx.beginPath(); pts.forEach(([px, py], k) => { const [X, Y] = toScreen(px, py); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); };
  ctx.globalAlpha = 0.35*alpha; ctx.strokeStyle = "#ff3355"; ctx.lineWidth = 7; line(); ctx.stroke();   // resplandor
  ctx.globalAlpha = alpha; ctx.strokeStyle = "#ff8a9c"; ctx.lineWidth = 2; line(); ctx.stroke();       // núcleo
  ctx.restore();
  const [X0, Y0] = toScreen(x, y);
  ctx.fillStyle = "#ff4d6a"; ctx.beginPath(); ctx.arc(X0, Y0, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(X0, Y0, 2, 0, Math.PI*2); ctx.fill();
  if (hit){ const [X, Y] = toScreen(...pts[pts.length-1]); glow(X, Y, 10, "rgba(255,120,140,0.9)", "rgba(255,80,110,0)"); }
}
function drawLasers(){ for (const l of lasers) drawRay(l.x, l.y, l.dx, l.dy); }

// ---------- Supernova, estrella de neutrones y agujero negro ----------
// Umbrales (difíciles a propósito): una estrella que llega a 1500 unidades hace supernova y deja una
// estrella de neutrones (el 30 %); esa estrella colapsa en agujero negro si junta 2500 unidades.
// (Antes: una estrella de unas 8 masas o más termina en supernova; expulsa
// la mayor parte de su gas (aquí el 70 %, como polvo que sale disparado) y deja un resto compacto.
// Si el resto supera unas 3 masas es un agujero negro; si no, una estrella de neutrones, que también
// colapsa en agujero negro cuando acumula más de 3 masas. La gravedad del resto, a distancia, es la de
// cualquier masa igual: lo distinto es que nada que lo toque vuelve a salir.
const M_NOVA = 15, M_BH = 25, NOVA_KEEP = 0.3;   // en masa interna: 15 = 1500 unidades
const KIND_TXT = {neutron:"estrella de neutrones", bh:"agujero negro"};
let novas = [];
function addDustRaw(x, y, vx, vy, ci, bi){
  const i = dN < MAXD ? dN++ : (Math.random()*MAXD)|0;
  dX[i] = x; dY[i] = y; dVX[i] = vx; dVY[i] = vy; dC[i] = ci; dB[i] = bi;
}
function collapse(b){
  if (b.kind === "star" && b.m >= M_NOVA){
    const M = b.m, r0 = radius(M);
    b.m = M*NOVA_KEEP; b.mt = 1; b.kind = b.m >= M_BH ? "bh" : "neutron";
    for (let k = 0; k < 1400; k++){                    // el gas expulsado: una cáscara que se expande
      const a = Math.random()*Math.PI*2, v = 1.2 + Math.random()*2.6, c = Math.cos(a), sn = Math.sin(a);
      const u = Math.random(), ci = u < 0.4 ? 2 : u < 0.7 ? 0 : u < 0.88 ? 3 : 4;
      addDustRaw(b.x + c*r0, b.y + sn*r0, b.vx + c*v, b.vy + sn*v, ci, Math.random() < 0.06 ? 2 : 1);
    }
    novas.push({x:b.x, y:b.y, t:0});
    tone(160, 28, 1.8, "sawtooth", 0.22);
    toast(`Supernova: la estrella llegó a ${fmtM(M)} unidades, explotó y dejó ${b.kind === "bh" ? "un agujero negro" : "una estrella de neutrones"} de ${fmtM(b.m)}.`, 5000);
  } else if (b.kind === "neutron" && b.m >= M_BH){
    b.kind = "bh"; tone(90, 30, 1.2, "triangle", 0.25);
    toast(`La estrella de neutrones llegó a ${fmtM(M_BH)} unidades y colapsó en un agujero negro.`, 4500);
  }
}
function drawBody(b, X, Y, pr, time){
  if (b.kind === "bh"){
    const g = ctx.createRadialGradient(X, Y, pr*0.9, X, Y, pr*2.6);   // disco de gas caliente alrededor
    g.addColorStop(0, "rgba(255,200,120,0.95)"); g.addColorStop(0.22, "rgba(255,130,60,0.55)"); g.addColorStop(1, "rgba(255,90,40,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X, Y, pr*2.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(X, Y, pr, 0, Math.PI*2); ctx.fill();   // horizonte de sucesos
    ctx.strokeStyle = "rgba(255,236,200,0.9)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(X, Y, pr*1.1, 0, Math.PI*2); ctx.stroke();
  } else if (b.kind === "neutron"){
    const a = time/160;                                // pulsar: dos haces que giran
    ctx.strokeStyle = "rgba(170,220,255,0.35)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(X - Math.cos(a)*34, Y - Math.sin(a)*34); ctx.lineTo(X + Math.cos(a)*34, Y + Math.sin(a)*34); ctx.stroke();
    glow(X, Y, 16, "rgba(190,230,255,0.7)", "rgba(190,230,255,0)");
    ctx.fillStyle = "#f2f8ff"; ctx.beginPath(); ctx.arc(X, Y, 4.5, 0, Math.PI*2); ctx.fill();
  } else ball(X, Y, pr, b.color);
}
function drawNovas(){
  for (const e of novas){
    e.t = Math.min(1, e.t + 0.008);
    const [X, Y] = toScreen(e.x, e.y), R = 12 + e.t*Math.max(Wd, Hd)*0.7, f = 1 - e.t;
    glow(X, Y, 30 + 220*Math.sqrt(e.t), `rgba(255,250,235,${0.9*f*f})`, "rgba(255,180,90,0)");
    ctx.strokeStyle = `rgba(255,200,140,${0.6*f})`; ctx.lineWidth = 2 + 6*f;
    ctx.beginPath(); ctx.arc(X, Y, R, 0, Math.PI*2); ctx.stroke();
  }
  novas = novas.filter(e => e.t < 1);
}

// ---------- Una masa se come a otra: animación ----------
// La física fusiona en un paso (masa y momento se conservan); aquí se muestra cómo la pequeña
// cae dentro de la grande y cómo la grande crece hasta la suma de ambas.
let ghosts = [];
const fmt = (v, d) => v.toFixed(d).replace(".", ",");
function onMerge(big, small){
  big.mShow0 = big.m - small.m; big.mt = 0;
  ghosts.push({x:small.x, y:small.y, r:Math.max(7, radius(small.m)*scale*1.5), color:small.color, to:big, t:0, label:`${fmtM(big.m-small.m)} + ${fmtM(small.m)} = ${fmtM(big.m)}`});
  sEat();
}
function onEaten(p){ ghosts.push({x:p.x, y:p.y, r:7, color:p.color, to:null, t:0, label:""}); sEat(); }
const shownMass = b => b.mt === undefined || b.mt >= 1 ? b.m : b.mShow0 + (b.m - b.mShow0)*ease(b.mt);
const ease = t => t < 0.5 ? 2*t*t : 1 - 2*(1-t)*(1-t);

// ---------- Mediciones para las leyes de Kepler (solo con Sol fijo) ----------
// Cada planeta mide: el ángulo recorrido (una vuelta = 2π), su distancia mínima y máxima en esa vuelta
// (a = semieje mayor = (r_min + r_max)/2) y el tiempo que tardó (T). También guarda dónde pasó más cerca.
function initTrack(p){ Object.assign(p, {t:0, ang:0, tRev:0, rlo:Infinity, rhi:0, T:null, a:null, peris:[], vrPrev:null, lastTh:Math.atan2(p.y, p.x)}); }
function track(p, h){
  p.t += h;
  const r = Math.hypot(p.x, p.y), th = Math.atan2(p.y, p.x);
  let d = th - p.lastTh; if (d > Math.PI) d -= 2*Math.PI; if (d < -Math.PI) d += 2*Math.PI;
  p.ang += Math.abs(d); p.lastTh = th;
  p.rlo = Math.min(p.rlo, r); p.rhi = Math.max(p.rhi, r);
  const vr = (p.x*p.vx + p.y*p.vy)/r;
  if (p.vrPrev !== null && p.vrPrev < 0 && vr >= 0 && (p.rhi - p.rlo) > 0.03*p.rhi){   // pasó por el punto más cercano
    p.peris.push([p.x, p.y]); if (p.peris.length > 14) p.peris.shift();
  }
  p.vrPrev = vr;
  if (p.ang >= 2*Math.PI){                           // completó una vuelta
    p.T = p.t - p.tRev; p.a = (p.rlo + p.rhi)/2;
    p.tRev = p.t; p.ang -= 2*Math.PI; p.rlo = r; p.rhi = r;
  }
}
// 2.ª ley: sectores barridos en intervalos de tiempo iguales
let sel = null, kep = 1, sectors = [], cur = null, dtArea = 0.5;
function estPeriod(p){
  const r = Math.hypot(p.x, p.y), v2 = p.vx*p.vx + p.vy*p.vy, E = v2/2 - 1/r;
  if (n === 2 && E < 0) return 2*Math.PI*Math.pow(-1/(2*E), 1.5);
  return 2*Math.PI*Math.pow(r, (1+n)/2);
}
function select(p){
  sel = p; sectors = []; cur = null;
  if (p) dtArea = estPeriod(p)/12;
}
function trackArea(p, h){
  if (p !== sel || kep !== 2) return;
  if (!cur) cur = {pts:[[p.x, p.y]], t:0, k:sectors.length + (sectors.k0 || 0)};
  cur.t += h;
  const l = cur.pts[cur.pts.length-1];
  if (Math.hypot(p.x-l[0], p.y-l[1]) > 0.01) cur.pts.push([p.x, p.y]);
  if (cur.t >= dtArea){
    cur.pts.push([p.x, p.y]);
    let A = 0; for (let i = 0; i < cur.pts.length-1; i++){ const [x1, y1] = cur.pts[i], [x2, y2] = cur.pts[i+1]; A += x1*y2 - x2*y1; }
    cur.area = Math.abs(A)/2; sectors.push(cur);
    if (sectors.length > 8){ sectors.shift(); sectors.k0 = (sectors.k0 || 0) + 1; }
    cur = {pts:[[p.x, p.y]], t:0, k:cur.k+1};
  }
}

// ---------- Textos ----------
const LAWTXT = {0.5:"1/√r", 1:"1/r", 2:"1/r²", 3:"1/r³"};
function updateCard(){
  let title, text;
  if (mode === "nbody"){
    title = "Masas";
    text = (mergeOn ? "Todas se atraen. Al chocar se juntan; una estrella que llega a 1500 unidades explota como supernova."
                    : "Todas se atraen entre sí. Al chocar se atraviesan.");
  } else if (kep === 1){
    title = "Elipses";
    text = n === 2 ? "Cada planeta da vueltas en una elipse, con el Sol en uno de sus focos."
                   : `Con gravedad ${LAWTXT[n]} la órbita no es una elipse: el punto más cercano se corre en cada vuelta.`;
  } else if (kep === 2){
    title = "Áreas";
    text = "En tiempos iguales el planeta barre áreas iguales: cerca del Sol va más rápido.";
  } else {
    title = "Tiempos";
    text = n === 2 ? "Mientras más lejos, más tarda en dar la vuelta: T² = a³ (en años y UA)."
                   : `Con gravedad ${LAWTXT[n]} los puntos se salen de la recta T² = a³.`;
  }
  const LAW = {1:"1.ª ley de Kepler. ", 2:"2.ª ley de Kepler. ", 3:"3.ª ley de Kepler. "};
  $("title").textContent = title; $("text").textContent = (mode === "central" ? LAW[kep] : "") + text;
}
// Energía. Potencial de la ley 1/rⁿ: φ(r) = −r^(1−n)/(n−1), y ln r cuando n = 1.
// Con el Sol: energía por unidad de masa del planeta elegido (negativa = ligado, si n > 1).
// Con masas: energía total, cinética + potencial de cada par; se conserva salvo en choques y supernovas.
const phi = r => n === 1 ? Math.log(r) : -Math.pow(r, 1-n)/(n-1);
const fmtS = v => (v < 0 ? "−" : "") + fmt(Math.abs(v), Math.abs(v) < 10 ? 2 : 1);
function energyText(){
  if (mode === "central"){
    if (!sel) return "";
    const E = (sel.vx*sel.vx + sel.vy*sel.vy)/2 + phi(Math.max(Math.hypot(sel.x, sel.y), RMIN));
    return `Energía ${fmtS(E)} · ${n > 1 && E >= 0 ? "se escapa" : "ligado"}`;
  }
  if (!bodies.length) return "";
  let K = 0, U = 0;
  for (const b of bodies) K += b.m*(b.vx*b.vx + b.vy*b.vy)/2;
  for (let i = 0; i < bodies.length; i++) for (let j = i+1; j < bodies.length; j++){
    const a = bodies[i], b = bodies[j], r = Math.max(Math.hypot(b.x-a.x, b.y-a.y), mergeOn ? RMIN : radius(a.m)+radius(b.m));
    U += a.m*b.m*phi(r);
  }
  return `Energía total ${fmtS(K + U)}`;
}
function updateData(){
  $("energy").textContent = energyText();
  updateData0();
  if (!dN) return;
  let g = 0; for (let i = 0; i < dN; i++) if (dB[i] === GAS) g++;
  const sep = mode === "nbody" ? "   " : "  ·  ";
  if (dN - g) $("data").textContent += sep + "Polvo: " + (dN-g).toLocaleString("es-CL") + " granos";
  if (g) $("data").textContent += sep + "Gas: " + g.toLocaleString("es-CL") + " nubes";
}
function updateData0(){
  if (mode === "nbody"){
    $("data").textContent = bodies.length ? "Masas: " + bodies.map(b => fmtM(shownMass(b))).join(" · ") + "   Total: " + fmtM(bodies.reduce((s, b) => s + b.m, 0)) : "Toca para poner una masa.";
    return;
  }
  if (!sel){ $("data").textContent = "Toca el cielo para crear un planeta, o toca uno para seguirlo."; return; }
  if (kep === 2){
    const A = sectors.map(s => fmt(s.area, 3));
    $("data").textContent = A.length ? "Áreas: " + A.slice(-5).join(" · ") : "Midiendo áreas…";
  } else if (sel.T){
    const T = sel.T/YEAR, a = sel.a;
    $("data").textContent = `a = ${fmt(a, 2)} UA   T = ${fmt(T, 2)} años   T² = ${fmt(T*T, 2)}   a³ = ${fmt(a*a*a, 2)}`;
  } else $("data").textContent = "Midiendo la primera vuelta…";
}

// ---------- Interfaz ----------
let toastT = 0;
function toast(t, ms = 3000){ const el = $("toast"); el.textContent = t; el.classList.remove("off"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("off"), ms); }
function updateCount(){}
function setLaw(v){
  n = v;
  document.querySelectorAll("#laws button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === n));
  if (mode === "central") for (const p of bodies){ [p.ax, p.ay] = accC(p.x, p.y); initTrack(p); }
  else accN(bodies);
  select(sel); updateCard();
}
function setMode(m){
  mode = m; lasers = []; bodies = []; colorIdx = 0; ghosts = []; novas = []; comets = []; dN = 0; camX = 0; camY = 0; setUZ(1); scale = baseScale*uz; select(null);
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("kepRow").hidden = mode !== "central"; $("nbRow").hidden = mode !== "nbody";
  if (mode === "central"){
    for (const [r, f] of [[1, 1], [1.7, 0.8]]){ const [vx, vy] = circularVel(-r, 0); addBody(-r, 0, vx*f, vy*f); initTrack(bodies[bodies.length-1]); }
    select(bodies[1]);
  } else preset("binaria");
  updateCard();
}
function addPlanet(x, y, vx, vy){
  const before = bodies.length; addBody(x, y, vx, vy);

      if (n === 2) drawEllipse(sel);
      ctx.fillStyle = "#ffc94a";
      for (const [x, y] of sel.peris){ const [X, Y] = toScreen(x, y); ctx.beginPath(); ctx.arc(X, Y, 3.5, 0, Math.PI*2); ctx.fill(); }
    }
    const sr = Math.max(SUN_R*scale, 16), [sx0, sy0] = toScreen(0, 0);
    glow(sx0, sy0, sr*3.4, "rgba(255,201,74,0.5)", "rgba(255,150,40,0)");
    const g = ctx.createRadialGradient(sx0-sr*0.3, sy0-sr*0.35, sr*0.1, sx0, sy0, sr);
    g.addColorStop(0, "#fff6c8"); g.addColorStop(0.45, "#ffd23f"); g.addColorStop(1, "#ffa31a");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx0, sy0, sr, 0, Math.PI*2); ctx.fill();
  }
  // cuerpos que están siendo comidos
  for (const gh of ghosts){
    gh.t = Math.min(1, gh.t + 0.022);
    const e = ease(gh.t);
    const tx = gh.to ? gh.to.x : 0, ty = gh.to ? gh.to.y : 0;
    const [X, Y] = toScreen(gh.x + (tx-gh.x)*e, gh.y + (ty-gh.y)*e);
    ctx.globalAlpha = 1 - e*0.6; ball(X, Y, gh.r*(1-e), gh.color, false); ctx.globalAlpha = 1;
  }
  for (const b of bodies){
    if (b.mt !== undefined && b.mt < 1) b.mt = Math.min(1, b.mt + 0.022);
    const [X, Y] = toScreen(b.x, b.y);
    const pr = mode === "nbody" ? Math.max(7, radius(shownMass(b))*scale*1.5) : (b === sel ? 8 : 6);
    drawBody(b, X, Y, pr, time);
    if (b === sel && mode === "central" && !clean){ ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X, Y, pr+5, 0, Math.PI*2); ctx.stroke(); }
  }
  ghosts = ghosts.filter(g => g.t < 1 || (g.label && g.t < 1));
  drawNovas();
  if (mode === "central" && kep === 3 && !clean) drawKepler3();
  // lanzamiento
  if (drag && drag.laser){                            // vista previa del láser mientras se apunta
    const [x, y] = toWorld(drag.sx, drag.sy), dx = drag.ex - drag.sx, dy = drag.ey - drag.sy;
    drawRay(x, y, Math.hypot(dx, dy) >= 8 ? dx : 1, Math.hypot(dx, dy) >= 8 ? dy : 0, 0.7);
  }
  if (drag && !drag.dust && !drag.laser){
    const [x, y] = toWorld(drag.sx, drag.sy);
    const moving = Math.hypot(drag.ex-drag.sx, drag.ey-drag.sy) >= 8;
    const [cvx, cvy] = circularVel(x, y), [vx, vy] = moving ? dragVel(drag.comet) : drag.comet ? [cvx*0.45, cvy*0.45] : [cvx, cvy];
    ctx.strokeStyle = drag.comet ? "rgba(170,215,255,0.7)" : "rgba(255,255,255,0.6)"; ctx.setLineDash([2, 7]); ctx.lineWidth = 2;
    path(predict(x, y, vx, vy, drag.comet)); ctx.stroke(); ctx.setLineDash([]);
    if (moving){
      ctx.strokeStyle = "#ffc94a"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(drag.sx, drag.sy); ctx.lineTo(drag.ex, drag.ey); ctx.stroke();
      const a = Math.atan2(drag.ey-drag.sy, drag.ex-drag.sx);
      ctx.fillStyle = "#ffc94a"; ctx.beginPath(); ctx.moveTo(drag.ex+5*Math.cos(a), drag.ey+5*Math.sin(a));
      ctx.lineTo(drag.ex-13*Math.cos(a-0.5), drag.ey-13*Math.sin(a-0.5)); ctx.lineTo(drag.ex-13*Math.cos(a+0.5), drag.ey-13*Math.sin(a+0.5)); ctx.fill();
    }
    ball(drag.sx, drag.sy, 7, COLORS[colorIdx % COLORS.length]);
  }
}

function pushTrail(b){
  const l = b.trail[b.trail.length-1];
  if (l && Math.hypot(b.x-l[0], b.y-l[1]) < TRAIL_STEP) return;
  b.trail.push([b.x, b.y]); if (b.trail.length > TRAIL) b.trail.shift();
}
function substeps(T, tdyn){ const k = Math.min(MAXSUB, Math.max(1, Math.ceil(T/Math.min(DT, ETA*tdyn)))); return [k, T/k]; }
let dataT = 0, lastT = 0;
function frame(time){
  const dt60 = lastT ? Math.min(50, time - lastT)/16.7 : 1; lastT = time;   // avanza según el tiempo real (60 o 120 Hz)
  if (!paused){
    const T = SUB*speed*DT*dt60;
    if (mode === "central"){
      for (const p of bodies){
        const [k, h] = substeps(T, tDynC(p));
        for (let s = 0; s < k; s++){
          stepC(p, h);
          if (!aliveC(p)){ p.dead = true; if (Math.hypot(p.x, p.y) <= SUN_R) onEaten(p); break; }
          track(p, h); trackArea(p, h); pushTrail(p);
        }
      }
      if (sel && sel.dead) select(bodies.find(b => !b.dead) || null);
      bodies = bodies.filter(p => !p.dead);
    } else if (bodies.length){
      let left = T;
      while (left > 1e-12){
        const [k, h] = substeps(left, tDynN(bodies)), n0 = bodies.length;
        for (let s = 0; s < k; s++){
          stepN(bodies, h); left -= h;
          while (mergeN(bodies));
          bodies.forEach(pushTrail);
          if (bodies.length !== n0) break;
        }
        if (bodies.length < 2) break;
      }
      bodies = bodies.filter(b => Math.hypot(b.x, b.y) < FAR);
    }
    if (dN) stepDust(T);
    if (comets.length) stepComets(T);
  }
  // cámara: sigue a la masa más grande y se aleja lo necesario para mostrar a las demás (hasta 0,3×)
  scale = baseScale*uz;
  draw(time || 0);
  if ((time || 0) - dataT > 150){ dataT = time || 0; updateData(); }
  requestAnimationFrame(frame);
}

resize(); syncSound(); $("playIcon").innerHTML = PAUSE;
setLaw(2); setMode("central");
requestAnimationFrame(frame);
})();
</script>
