<style>
/* ===== SyMula: estilo común (sistema de diseño v1.0, igual en todas las páginas) ===== */
:root,:root[data-theme="dark"]{
  --background:#0B1526;--surface:#15253A;--surface-2:#1B2E47;--text:#F0F6FC;--text-muted:#B8C6D3;
  --primary:#42C7CF;--primary-text:#0B1526;--accent:#E6B66A;--border:#30445B;--control-border:#5D7590;
  --sem-1:#6CB4F0;--sem-2:#F29C6B;--sem-3:#6FCF97;--sem-4:#C49BEA;--sem-5:#E6C15A;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --background:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F8;--text:#102A43;--text-muted:#526779;
  --primary:#087481;--primary-text:#FFFFFF;--accent:#D9A15B;--border:#DCE5EB;--control-border:#7B8FA1;
  --sem-1:#1F6FB2;--sem-2:#B4532A;--sem-3:#2E7D4F;--sem-4:#7E4AB0;--sem-5:#8A6400;
  color-scheme:light;
}
:root[data-theme="night"]{
  --background:#09221D;--surface:#12382F;--surface-2:#174238;--text:#E7F8F2;--text-muted:#C1F4DD;
  --primary:#21B68B;--primary-text:#09221D;--accent:#C1F4DD;--border:#286052;--control-border:#4E8A78;
  --sem-1:#8FD3FF;--sem-2:#F5B38A;--sem-3:#9BE8C0;--sem-4:#D5B8F2;--sem-5:#F0D58A;
  color-scheme:dark;
}
:root{
  /* nombres antiguos que usa el código de cada página */
  --bg:var(--background);--panel:var(--surface);--btn:var(--surface-2);--line:var(--border);--ink:var(--text);
  --soft:var(--text-muted);--acc:var(--primary);--acc-ink:var(--primary-text);--cyan:var(--primary);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--background)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--background);color:var(--text);
  font:500 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--background)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
:root[data-theme="night"] .stage canvas{filter:grayscale(1) sepia(.8) hue-rotate(92deg) saturate(.85) brightness(.88)}   /* verde suave, sin fluorescencia */
.home{position:absolute;top:12px;left:12px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;z-index:3;
  background:var(--surface);border:1px solid var(--control-border);color:var(--text)}
.card{position:absolute;top:12px;left:72px;right:12px;max-width:480px;min-height:48px;padding:10px 16px;border-radius:12px;z-index:2;pointer-events:none;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border)}
.card h1{font:700 17px/1.2 Inter,sans-serif;margin:0;color:var(--text);letter-spacing:-.01em}
.card p{margin:3px 0 0;font-size:14px;color:var(--text-muted)}
.card .data{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.card p:empty{display:none}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:92%;padding:10px 16px;border-radius:12px;z-index:3;
  background:var(--surface);color:var(--text);border:1px solid var(--primary);font-weight:600;text-align:center;pointer-events:none;transition:opacity .3s}
.toast.off{opacity:0}
.dock{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.dock>*{width:100%;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px}
.tile{flex:1 1 0;min-width:0;min-height:56px;padding:6px 4px;border-radius:12px;border:1px solid var(--control-border);background:var(--surface-2);color:var(--text);
  font:600 13px/1.15 Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  touch-action:manipulation;transition:border-color .15s,background-color .15s}
.tile svg{width:24px;height:24px;flex:none}
.tile small{font-size:11px;font-weight:500;opacity:.85}
@media (hover:hover){.tile:hover:not(:disabled),.home:hover{border-color:var(--primary)}}
.tile[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile[aria-busy="true"]{position:relative;color:transparent}
.tile[aria-busy="true"]::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--text-muted);border-top-color:var(--primary);animation:sy-spin .8s linear infinite}
@keyframes sy-spin{to{transform:rotate(360deg)}}
.lbl{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:-4px;padding:0 2px;letter-spacing:.02em}
.themes{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.themes button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text);font:600 13px Inter,sans-serif;cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text)}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
/* ===== fin del estilo común ===== */
.sheet{display:flex;flex-direction:column;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tile small{font-size:10.5px;font-weight:700;opacity:.85}
</style>

<body>
<div class="stage">
  <canvas id="cv" aria-label="Bola de agua en el espacio y un objeto que la estira con su gravedad; arrastra para girar la vista"></canvas>
  <a class="home" href="index.html" aria-label="Volver al inicio"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5.5 9.5V20h13V9.5"/></svg></a>

    <div class="row">

      <button class="tile" type="button" id="spinBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Girar la vista</button>
      <button class="tile" type="button" data-rho="22.59" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#9aa8bd"/></svg>Osmio<small>22,6 g/cm³</small></button>
    </div>
  </div>
  <div class="lbl">De qué está hecho el objeto</div>
  <div class="row" role="group" aria-label="Material">
    <button class="tile" type="button" data-rho="0.49" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#dcebff"/></svg>Metano<small>0,49 g/cm³</small></button>
    <button class="tile" type="button" data-rho="3" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#8f7766"/></svg>Roca<small>3 g/cm³</small></button>
    <button class="tile" type="button" data-rho="7.85" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#b9bfc9"/></svg>Acero<small>7,9 g/cm³</small></button>
    <button class="tile" type="button" data-rho="13.53" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#e6e9ef"/><circle cx="9.5" cy="9.5" r="2.5" fill="#fff"/></svg>Mercurio<small>13,5 g/cm³</small></button>
    <button class="tile" type="button" data-rho="19.32" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#f2c14e"/></svg>Oro<small>19,3 g/cm³</small></button>
  </div>
  <div class="row">
    <button class="tile" type="button" id="far"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="3"/><path d="M11 12h10M17 8l4 4-4 4"/></svg>Alejar</button>
    <button class="tile" type="button" id="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="3"/><path d="M21 12H11M15 8l-4 4 4 4"/></svg>Acercar</button>
    <button class="tile" type="button" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>Bola nueva</button>
    <button class="tile" type="button" id="more" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Más</button>
  </div>

<script>
(function(){
"use strict";
// @fisica ----------------------------------------------------------------------------------------
// Unidades: el radio de la bola es 1 y G·ρ_agua = 1, así la unidad de tiempo es 1/√(G·ρ_agua) ≈ 1,075 h
// (no depende del tamaño de la bola). El objeto es una esfera del mismo radio y densidad ρ (g/cm³).
// Se mira desde la bola, que cae libremente hacia el objeto (o lo orbita): solo queda la fuerza de marea.
const R_OBJ = 1, HOURS = 1/Math.sqrt(6.674e-11*1000)/3600;   // ≈ 1,075 h por unidad de tiempo
const massRatio = rho => rho*R_OBJ*R_OBJ*R_OBJ;             // M/m = (ρ/ρ_agua)·(R_obj/R)³
const GM = rho => rho*(4*Math.PI/3)*R_OBJ*R_OBJ*R_OBJ;       // G·M del objeto (G·ρ_agua = 1)
// Bola líquida homogénea que se atrae a sí misma (número de Love h₂ = 5/2): su superficie queda en
// r(θ) = 1 + q·P₂(cos θ), con q = (5/2)·(M/m)·(R/d)³; el eje hacia el objeto mide 1 + q y los otros 1 − q/2.
const qEq = (rho, d) => 2.5*massRatio(rho)/(d*d*d);
// Límite de Roche de un cuerpo líquido: más cerca que d_R = 2,44·R_obj·(ρ/ρ_agua)^(1/3), la marea lo rompe.
const roche = rho => 2.44*R_OBJ*Math.cbrt(rho);
// Oscilación propia de una gota que se atrae a sí misma (modo l = 2 de Kelvin): ω² = (16π/15)·G·ρ.
const W2 = 16*Math.PI/15;
// Marea sobre una gota suelta, en el marco de la bola: a = (G·M/d³)·(2x, −y, −z).
const tidalAcc = (rho, d, x, y, z) => { const k = GM(rho)/(d*d*d); return [2*k*x, -k*y, -k*z]; };
// @fin-fisica -----------------------------------------------------------------------------------

const $ = id => document.getElementById(id), cv = $("cv"), ctx = cv.getContext("2d");
const fmt = (v, dd) => v.toFixed(dd).replace(".", ",");
const MATS = {
  "0.49":  {name:"metano congelado", base:[220, 235, 255], metal:0, rough:0.6},
  "3":     {name:"roca", base:[143, 119, 102], metal:0, rough:1},
  "7.85":  {name:"acero", base:[185, 191, 201], metal:0.85, rough:0.35},
  "13.53": {name:"mercurio", base:[230, 233, 240], metal:1, rough:0.05},
  "19.32": {name:"oro", base:[242, 193, 78], metal:0.95, rough:0.25},
  "22.59": {name:"osmio", base:[154, 168, 189], metal:0.9, rough:0.3}
};
let rho = 7.85, d = 8, dShown = 8, q = 0, qv = 0, broken = false, drops = [], showAxes = true, autoSpin = false;
let yaw = -0.55, pitch = 0.32, W = 0, H = 0, dpr = 1, scale = 60, ox = 0, oy = 0, center = [0, 0, 0];
const D_MIN = 2.08, D_MAX = 14;

// ---------- Cámara (ortográfica, gira con el dedo) ----------
let cam = null;
function camera(){
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const f = [-cp*sy, -sp, -cp*cy];                           // hacia donde mira
  const r = [cy, 0, -sy];                                    // derecha
  const u = [r[1]*f[2] - r[2]*f[1], r[2]*f[0] - r[0]*f[2], r[0]*f[1] - r[1]*f[0]];   // arriba = derecha × adelante
  return {f, r, u};
}
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const proj = P => { const v = [P[0] - center[0], P[1] - center[1], P[2] - center[2]]; return [ox + dot(v, cam.r)*scale, oy - dot(v, cam.u)*scale, -dot(v, cam.f)]; };
function layout(){
  cam = camera();
  const top = $("card").offsetTop + $("card").offsetHeight + 8, avH = H - top - 8;
  // encuadre: la bola y el objeto (hasta 9 radios); más lejos, el objeto puede salir de la pantalla
  const reach = Math.min(dShown, 9), span = Math.abs(reach*cam.r[0]) + 2.6, spanV = Math.abs(reach*cam.u[0]) + 2.6;
  scale = Math.max(34, Math.min((W - 24)/span, avH/spanV, Math.min(W, avH)*0.24));
  center = [reach*0.5, 0, 0]; ox = W/2; oy = top + avH/2;
}
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); layout();
}
new ResizeObserver(resize).observe(cv);

// ---------- Trazado de rayos: la bola (elipsoide) y el objeto (esfera) ----------
const offB = document.createElement("canvas"), cB = offB.getContext("2d"), offO = document.createElement("canvas"), cO = offO.getContext("2d");
let quality = 1;
const L = (() => { const v = [-0.45, 0.75, 0.5], n = Math.hypot(...v); return v.map(x => x/n); })();   // luz de una estrella lejana
function sky(dir){                                          // reflejo del cielo: oscuro con un poco de azul arriba
  const t = 0.5 + 0.5*dir[1]; return [10 + 25*t, 14 + 35*t, 30 + 60*t];
}
function rayBox(cxw, rad, offc, c2){
  const [Xc, Yc] = proj(cxw), R = rad*scale + 3, k = quality*dpr;
  const size = Math.max(4, Math.ceil(2*R*k));
  if (offc.width !== size){ offc.width = size; offc.height = size; }
  return {X0:Xc - R, Y0:Yc - R, R, k, size, img:c2.createImageData(size, size)};
}
// Recorre los píxeles del cuadro; devuelve el punto de entrada del rayo en coordenadas de mundo.
function forPixels(box, hit){
  const {X0, Y0, k, size, img} = box, data = img.data, V = cam.f.map(x => -x);
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++){
    const sx = X0 + (i + 0.5)/k - ox, sy = -(Y0 + (j + 0.5)/k - oy);
    const o = [center[0] + cam.r[0]*sx/scale + cam.u[0]*sy/scale - 60*cam.f[0],
               center[1] + cam.r[1]*sx/scale + cam.u[1]*sy/scale - 60*cam.f[1],
               center[2] + cam.r[2]*sx/scale + cam.u[2]*sy/scale - 60*cam.f[2]];
    const c = hit(o, cam.f, V);
    if (c){ const p = 4*(j*size + i); data[p] = c[0]; data[p+1] = c[1]; data[p+2] = c[2]; data[p+3] = c[3]; }
  }
}
function renderBall(){
  const a = 1 + q, b = 1 - q/2, box = rayBox([0, 0, 0], a, offB, cB);
  forPixels(box, (o, f, V) => {
    // elipsoide x²/a² + (y² + z²)/b² = 1: se escala a una esfera unitaria
    const po = [o[0]/a, o[1]/b, o[2]/b], pd = [f[0]/a, f[1]/b, f[2]/b];
    const A = dot(pd, pd), B = 2*dot(po, pd), C = dot(po, po) - 1, D = B*B - 4*A*C;
    if (D <= 0) return null;
    const sD = Math.sqrt(D), t1 = (-B - sD)/(2*A), t2 = (-B + sD)/(2*A);
    const p = [o[0] + f[0]*t1, o[1] + f[1]*t1, o[2] + f[2]*t1];
    let n = [p[0]/(a*a), p[1]/(b*b), p[2]/(b*b)]; const nl = Math.hypot(...n); n = n.map(x => x/nl);
    const nv = Math.max(0, dot(n, V)), fres = 0.02 + 0.98*Math.pow(1 - nv, 5);
    const thick = t2 - t1;                                   // cuánta agua cruza el rayo
    const ab = Math.exp(-0.55*thick), wrap = Math.max(0, (dot(n, L) + 0.4)/1.4);
    const h = [L[0] + V[0], L[1] + V[1], L[2] + V[2]], hl = Math.hypot(...h), sp = Math.pow(Math.max(0, dot(n, h)/hl), 140);
    const rv = 2*dot(n, V), refl = sky([rv*n[0] - V[0], rv*n[1] - V[1], rv*n[2] - V[2]]);
    // el agua absorbe primero el rojo: por dentro se ve azul, más oscuro donde es más gruesa
    let r = 6 + 40*ab*wrap, g = 40 + 120*ab*wrap + 25*(1 - ab), bl = 85 + 150*ab*wrap + 40*(1 - ab);
    r = r*(1 - fres) + refl[0]*fres + 255*sp; g = g*(1 - fres) + refl[1]*fres + 255*sp; bl = bl*(1 - fres) + refl[2]*fres + 255*sp;
    return [r, g, bl, 200 + 55*fres];                          // un poco transparente: se ven los ejes adentro
  });
  cB.putImageData(box.img, 0, 0);
  return box;
}
function renderObject(){
  const m = MATS[String(rho)], box = rayBox([dShown, 0, 0], R_OBJ, offO, cO);
  forPixels(box, (o, f, V) => {
    const oc = [o[0] - dShown, o[1], o[2]], B = 2*dot(oc, f), C = dot(oc, oc) - R_OBJ*R_OBJ, D = B*B - 4*C;
    if (D <= 0) return null;
    const t = (-B - Math.sqrt(D))/2, p = [oc[0] + f[0]*t, oc[1] + f[1]*t, oc[2] + f[2]*t];
    const n = p.map(x => x/R_OBJ), lam = Math.max(0, dot(n, L)), nv = Math.max(0, dot(n, V));
    const h = [L[0] + V[0], L[1] + V[1], L[2] + V[2]], hl = Math.hypot(...h), nh = Math.max(0, dot(n, h)/hl);
    const rv = 2*dot(n, V), R = [rv*n[0] - V[0], rv*n[1] - V[1], rv*n[2] - V[2]], env = sky(R);
    // el lado que mira a la bola refleja su azul (metales y mercurio)
    const towardBall = Math.max(0, -R[0])*0.5, envB = [env[0] + 12*towardBall, env[1] + 35*towardBall, env[2] + 60*towardBall];
    const spec = Math.pow(nh, 8 + 300*(1 - m.rough)), bump = m.metal ? 0 : 0.85 + 0.3*noiseN(n);
    const out = [0, 1, 2].map(k => {
      const diff = m.base[k]*(0.06 + 0.94*lam)*bump;
      const eg = (envB[0] + envB[1] + envB[2])/3, met = m.base[k]/255*(eg*1.6 + (envB[k] - eg)*0.5 + 150*lam + 25);   // reflejo del cielo y de la bola, más la luz directa
      return diff*(1 - m.metal) + met*m.metal + 255*spec*(0.25 + 0.75*m.metal) + (1 - nv)*(m.metal ? 0 : 6);
    });
    return [out[0], out[1], out[2], 255];
  });
  cO.putImageData(box.img, 0, 0);
  return box;
}
function noiseN(n){                                          // manchas para la roca y el hielo
  const s = Math.sin(n[0]*12.9898 + n[1]*78.233 + n[2]*37.719)*43758.5453; const a = s - Math.floor(s);
  const s2 = Math.sin(n[0]*4.1 + n[1]*7.3 + n[2]*5.7)*0.5 + 0.5; return 0.6*s2 + 0.4*a;
}

// ---------- Gotas cuando la bola se rompe ----------
function breakBall(){
  broken = true; drops = [];
  const a = 1 + q, b = 1 - q/2;
  while (drops.length < 520){
    const x = Math.random()*2 - 1, y = Math.random()*2 - 1, z = Math.random()*2 - 1;
    if (x*x + y*y + z*z > 1) continue;
    drops.push({x:x*a, y:y*b, z:z*b, vx:0, vy:0, vz:0, r:0.075 + Math.random()*0.05});
  }
  toast(`¡La marea rompió la bola! Pasaste el límite de Roche (${fmt(roche(rho), 1)} radios).`, 5000);
}
function stepDrops(dt){
  for (const p of drops){
    if (p.gone) continue;
    const [ax, ay, az] = tidalAcc(rho, dShown, p.x, p.y, p.z);
    p.vx += ax*dt; p.vy += ay*dt; p.vz += az*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if (Math.hypot(p.x - dShown, p.y, p.z) < R_OBJ || Math.abs(p.x) > 30) p.gone = true;   // cae en el objeto o se aleja
  }
}
let dropSprite = null;
function sprite(){
  const s = document.createElement("canvas"); s.width = s.height = 64; const c = s.getContext("2d");
  const g = c.createRadialGradient(24, 22, 2, 32, 32, 31);
  g.addColorStop(0, "#e8f6ff"); g.addColorStop(0.25, "#5ab8f0"); g.addColorStop(0.8, "#0f4c8a"); g.addColorStop(1, "rgba(10,40,90,0)");
  c.fillStyle = g; c.beginPath(); c.arc(32, 32, 31, 0, Math.PI*2); c.fill(); return s;
}

// ---------- Dibujo ----------
const STARS = Array.from({length:220}, () => [Math.random(), Math.random(), Math.random()*1.2 + 0.3, Math.random()*6.3]);
function drawAxes(front){
  if (!showAxes) return;
  const a = 1 + q, b = 1 - q/2, AX = [[[1, 0, 0], "#ff6b6b", "x", a], [[0, 1, 0], "#6bdc8b", "y", b], [[0, 0, 1], "#6bb5ff", "z", b]];
  for (const [u, col, name, semi] of AX){
    for (const sg of [1, -1]){
      // tramo dentro del agua (tenue) y tramo afuera (firme); "front" dibuja solo lo que está hacia la cámara
      const p0 = proj([0, 0, 0]), p1 = proj(u.map(v => v*semi*sg)), p2 = proj(u.map(v => v*1.7*sg));
      const nearCam = p2[2] > 0;
      if (nearCam !== front) continue;
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = 0.55; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
      if (sg > 0){ ctx.fillStyle = col; ctx.font = "800 13px Inter, sans-serif"; ctx.fillText(name, p2[0] + 4, p2[1] - 4); }
    }
  }
  ctx.globalAlpha = 1;
}
function drawRoche(){                                         // anillo de peligro alrededor del objeto (plano x-z)
  const dr = roche(rho); if (dr <= 2.05) return;
  ctx.strokeStyle = broken ? "rgba(255,110,110,0.5)" : "rgba(255,201,74,0.4)"; ctx.lineWidth = 1.4; ctx.setLineDash([5, 6]); ctx.beginPath();
  for (let k = 0; k <= 96; k++){ const t = k/96*2*Math.PI, P = proj([dShown + dr*Math.cos(t), 0, dr*Math.sin(t)]); k ? ctx.lineTo(P[0], P[1]) : ctx.moveTo(P[0], P[1]); }
  ctx.stroke(); ctx.setLineDash([]);
  const P = proj([dShown - dr, 0, 0]); ctx.fillStyle = "rgba(255,201,74,0.8)"; ctx.font = "800 11px Inter, sans-serif"; ctx.fillText("Roche", P[0] - 16, P[1] + 16);
}
function drawArrows(){                                        // flechas de la marea: estira en x, aprieta en y y z
  if (broken || q < 0.004) return;
  const s = Math.min(0.9, 0.35 + q*3), a = 1 + q, b = 1 - q/2;
  const arrow = (from, to) => {
    const [x1, y1] = proj(from), [x2, y2] = proj(to), ang = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.moveTo(x2, y2); ctx.lineTo(x2 - 7*Math.cos(ang - 0.5), y2 - 7*Math.sin(ang - 0.5));
    ctx.moveTo(x2, y2); ctx.lineTo(x2 - 7*Math.cos(ang + 0.5), y2 - 7*Math.sin(ang + 0.5)); ctx.stroke();
  };
  ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 2;
  arrow([a + 0.08, 0, 0], [a + 0.08 + s, 0, 0]); arrow([-a - 0.08, 0, 0], [-a - 0.08 - s, 0, 0]);
  arrow([0, b + 0.08 + s*0.5, 0], [0, b + 0.08, 0]); arrow([0, -b - 0.08 - s*0.5, 0], [0, -b - 0.08, 0]);
}

// ---------- Bucle ----------
let last = 0, textT = 0, perf = [];
function frame(now){
  const dt = last ? Math.min(50, now - last)/1000 : 1/60; last = now;
  if (autoSpin && !drag) yaw += dt*0.25;
  dShown += (d - dShown)*Math.min(1, dt*3);
  const T = dt*1.0;                                          // 1 unidad de tiempo (≈ 1,07 h) por segundo
  if (!broken){
    // oscilación de la bola hacia su forma de equilibrio (modo de Kelvin, con un poco de roce)
    const qe = qEq(rho, dShown), steps = 8, h = T/steps;
    for (let s = 0; s < steps; s++){ qv += (-W2*(q - qe) - 0.6*qv)*h; q += qv*h; }
    if (dShown < roche(rho) && roche(rho) > D_MIN + 0.02) breakBall();
  } else stepDrops(T);
  layout();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#03050c"; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, p] of STARS){ ctx.globalAlpha = 0.25 + 0.3*Math.sin(now/1500 + p); ctx.fillStyle = "#fff"; ctx.fillRect(x*W, y*H, r, r); }
  ctx.globalAlpha = 1;
  const t0 = performance.now();
  const oBox = renderObject(), bBox = broken ? null : renderBall();
  const ms = performance.now() - t0;
  drawRoche();
  const zO = proj([dShown, 0, 0])[2], zB = proj([0, 0, 0])[2];
  const drawObj = () => ctx.drawImage(offO, oBox.X0, oBox.Y0, 2*oBox.R, 2*oBox.R);
  if (zO < zB) drawObj();
  drawAxes(false);
  if (bBox){ ctx.imageSmoothingEnabled = true; ctx.drawImage(offB, bBox.X0, bBox.Y0, 2*bBox.R, 2*bBox.R); }
  else {
    if (!dropSprite) dropSprite = sprite();
    const list = drops.filter(p => !p.gone).map(p => [proj([p.x, p.y, p.z]), p.r]).sort((A, B) => A[0][2] - B[0][2]);
    for (const [[X, Y], r] of list){ const s = r*scale*2.2; ctx.drawImage(dropSprite, X - s/2, Y - s/2, s, s); }
  }
  drawAxes(true); drawArrows();
  if (zO >= zB) drawObj();
  // si el objeto quedó fuera de la pantalla, una flecha indica dónde está
  const [Xo, Yo] = proj([dShown, 0, 0]);
  if (Xo > W - 10 || Xo < 10){
    const Xe = Math.min(W - 18, Math.max(18, Xo)); ctx.fillStyle = "#ffc94a"; ctx.font = "800 12px Inter, sans-serif"; ctx.textAlign = Xo > W ? "right" : "left";
    ctx.fillText(`${Xo > W ? "" : "← "}${MATS[String(rho)].name} a ${fmt(dShown, 1)} radios${Xo > W ? " →" : ""}`, Xe, Math.min(H - 14, Math.max(90, Yo))); ctx.textAlign = "start";
  }
  if (now - textT > 200){ textT = now; updateText(); }
  // la calidad del trazado de rayos se ajusta sola para no pasar de 10 ms por cuadro
  perf.push(ms); if (perf.length >= 30){ const avg = perf.reduce((x, y) => x + y)/perf.length; perf = [];
    if (avg > 10 && quality > 0.35) quality *= 0.8; else if (avg < 4 && quality < 1) quality = Math.min(1, quality*1.15); }
  requestAnimationFrame(frame);
}
function updateText(){
  const m = MATS[String(rho)], dr = roche(rho);
  let s = `${m.name[0].toUpperCase() + m.name.slice(1)} ${fmt(rho, rho < 10 ? 2 : 1)} g/cm³ · a ${fmt(dShown, 1)} radios`;
  s += broken ? " · la bola se rompió" : ` · se estira ${fmt(150*q, 1)} %`;
  s += dr > D_MIN ? ` · Roche ${fmt(dr, 1)} radios` : " · nunca la rompe";
  $("data").textContent = s;
}

// ---------- Controles ----------
let toastT = 0;
function toast(msg, ms = 3500){ const el = $("toast"); el.textContent = msg; el.classList.remove("off"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("off"), ms); }
function setD(v){
  const contact = 1 + q + R_OBJ + 0.06;
  d = Math.max(Math.max(D_MIN, contact), Math.min(D_MAX, v));
  if (v < contact && !broken) toast("¡Se tocan! El objeto no puede acercarse más.");
}
$("close").addEventListener("click", () => setD(d*0.85));
$("far").addEventListener("click", () => setD(d/0.85));
$("reset").addEventListener("click", () => {
  broken = false; drops = []; q = 0; qv = 0;
  if (d < roche(rho)) d = dShown = Math.min(D_MAX, roche(rho) + 1.5);
  toast("Una bola de agua nueva, quieta y redonda");
});
document.querySelectorAll("[data-rho]").forEach(b => b.addEventListener("click", () => {
  rho = +b.dataset.rho; document.querySelectorAll("[data-rho]").forEach(x => x.setAttribute("aria-pressed", x === b));
  const dr = roche(rho);
  toast(dr > D_MIN ? `${MATS[b.dataset.rho].name}: rompe la bola si se acerca a menos de ${fmt(dr, 1)} radios` : `${MATS[b.dataset.rho].name}: es tan liviano que nunca puede romperla`, 4000);
}));
$("more").addEventListener("click", () => { const open = $("sheet").hidden; $("sheet").hidden = !open; $("more").setAttribute("aria-pressed", open); });
$("axesBtn").addEventListener("click", () => { showAxes = !showAxes; $("axesBtn").setAttribute("aria-pressed", showAxes); });
$("spinBtn").addEventListener("click", () => { autoSpin = !autoSpin; $("spinBtn").setAttribute("aria-pressed", autoSpin); });
// arrastrar gira la vista
let drag = null;
cv.addEventListener("pointerdown", e => { try { cv.setPointerCapture(e.pointerId); } catch (err) {} drag = {x:e.clientX, y:e.clientY}; });
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  yaw += (e.clientX - drag.x)*0.008; pitch = Math.max(-1.35, Math.min(1.35, pitch + (e.clientY - drag.y)*0.008));
  drag = {x:e.clientX, y:e.clientY};
});
const end = () => drag = null;
cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
resize();
requestAnimationFrame(frame);
})();
</script>
<!-- SyMula: selector de tema (botones con data-theme-set) -->
<script>(function(){
function sync(){var t=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-theme-set")===t);});
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--background").trim());}
window.SyMulaTheme=function(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("symula-tema",t);}catch(e){}sync();
  window.dispatchEvent(new Event("symula-tema"));};
// colores del tema para dibujar en el lienzo: SyMulaColor("sem-1"), SyMulaColor("primary")...
window.SyMulaColor=function(name){return getComputedStyle(document.documentElement).getPropertyValue("--"+name).trim();};
document.querySelectorAll("[data-theme-set]").forEach(function(b){b.addEventListener("click",function(){SyMulaTheme(b.getAttribute("data-theme-set"));});});
try{if(!localStorage.getItem("symula-tema")&&window.matchMedia)matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(e){document.documentElement.setAttribute("data-theme",e.matches?"light":"dark");sync();window.dispatchEvent(new Event("symula-tema"));});}catch(e){}
sync();})();</script>
<!-- fin SyMula: selector de tema -->
