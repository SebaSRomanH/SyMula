<style>
/* ===== SyMula: estilo común (sistema de diseño v1.0, igual en todas las páginas) ===== */
:root,:root[data-theme="dark"]{
  --background:#0B1526;--surface:#15253A;--surface-2:#1B2E47;--text:#F0F6FC;--text-muted:#B8C6D3;
  --primary:#42C7CF;--primary-text:#0B1526;--accent:#E6B66A;--border:#30445B;--control-border:#5D7590;
  --sem-1:#6CB4F0;--sem-2:#F29C6B;--sem-3:#6FCF97;--sem-4:#C49BEA;--sem-5:#E6C15A;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --background:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F8;--text:#102A43;--text-muted:#526779;
  --primary:#087481;--primary-text:#FFFFFF;--accent:#D9A15B;--border:#DCE5EB;--control-border:#7B8FA1;
  --sem-1:#1F6FB2;--sem-2:#B4532A;--sem-3:#2E7D4F;--sem-4:#7E4AB0;--sem-5:#8A6400;
  color-scheme:light;
}
:root[data-theme="night"]{
  --background:#09221D;--surface:#12382F;--surface-2:#174238;--text:#E7F8F2;--text-muted:#C1F4DD;
  --primary:#21B68B;--primary-text:#09221D;--accent:#C1F4DD;--border:#286052;--control-border:#4E8A78;
  --sem-1:#8FD3FF;--sem-2:#F5B38A;--sem-3:#9BE8C0;--sem-4:#D5B8F2;--sem-5:#F0D58A;
  color-scheme:dark;
}
:root{
  /* nombres antiguos que usa el código de cada página */
  --bg:var(--background);--panel:var(--surface);--btn:var(--surface-2);--line:var(--border);--ink:var(--text);
  --soft:var(--text-muted);--acc:var(--primary);--acc-ink:var(--primary-text);--cyan:var(--primary);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--background)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--background);color:var(--text);
  font:500 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--background)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
:root[data-theme="night"] .stage canvas{filter:grayscale(1) sepia(.8) hue-rotate(92deg) saturate(.85) brightness(.88)}   /* verde suave, sin fluorescencia */
.home{position:absolute;top:12px;left:12px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;z-index:3;
  background:var(--surface);border:1px solid var(--control-border);color:var(--text)}
.card{position:absolute;top:12px;left:72px;right:12px;max-width:480px;min-height:48px;padding:10px 16px;border-radius:12px;z-index:2;pointer-events:none;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border)}
.card h1{font:700 17px/1.2 Inter,sans-serif;margin:0;color:var(--text);letter-spacing:-.01em}
.card p{margin:3px 0 0;font-size:14px;color:var(--text-muted)}
.card .data{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.card p:empty{display:none}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:92%;padding:10px 16px;border-radius:12px;z-index:3;
  background:var(--surface);color:var(--text);border:1px solid var(--primary);font-weight:600;text-align:center;pointer-events:none;transition:opacity .3s}
.toast.off{opacity:0}
.dock{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.dock>*{width:100%;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px}
.tile{flex:1 1 0;min-width:0;min-height:56px;padding:6px 4px;border-radius:12px;border:1px solid var(--control-border);background:var(--surface-2);color:var(--text);
  font:600 13px/1.15 Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  touch-action:manipulation;transition:border-color .15s,background-color .15s}
.tile svg{width:24px;height:24px;flex:none}
.tile small{font-size:11px;font-weight:500;opacity:.85}
@media (hover:hover){.tile:hover:not(:disabled),.home:hover{border-color:var(--primary)}}
.tile[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile[aria-busy="true"]{position:relative;color:transparent}
.tile[aria-busy="true"]::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--text-muted);border-top-color:var(--primary);animation:sy-spin .8s linear infinite}
@keyframes sy-spin{to{transform:rotate(360deg)}}
.lbl{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:-4px;padding:0 2px;letter-spacing:.02em}
.themes{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.themes button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text);font:600 13px Inter,sans-serif;cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text)}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
/* ===== fin del estilo común ===== */
.sheet{display:flex;flex-direction:column;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tile small{font-size:10.5px;font-weight:700;opacity:.85}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:3}
.zoom button{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--control-border);color:var(--text);cursor:pointer}
.zoom button:disabled{opacity:.45}
</style>

<script>
(function(){
"use strict";
// @fisica ----------------------------------------------------------------------------------------
// La bola de agua tiene radio 1 y se queda en el centro. Una masa (el dedo o el mouse) la atrae.
// Unidades de dibujo animado: G·ρ_agua = 1 y 1 unidad de tiempo por segundo.
// La altura del agua es una suma de ondas sobre la esfera: η = Σ a_lm·Y_lm (armónicos reales hasta l = 12),
// evaluada en una malla de 200 × 100 puntos. Cada onda oscila con la frecuencia de Kelvin de una gota que se
// atrae a sí misma, ω_l² = (4π/3)·2l(l−1)/(2l+1), y la masa la empuja hacia la marea de equilibrio:
//   η_l = h_l·s·(R/d)^(l+1)·P_l(cos θ),   h_l = (2l+1)/(2(l−1)) (número de Love de un líquido),
// donde s = M/m es la masa relativa y d la distancia. Todos los grados l = 2…12: cerca, el agua sube en punta
// hacia la masa; lejos, solo queda el estiramiento en dos jorobas (l = 2).
const LMAX = 12, NK = (LMAX + 1)*(LMAX + 1);
const omega2 = l => (4*Math.PI/3)*2*l*(l - 1)/(2*l + 1);
const loveH = l => (2*l + 1)/(2*(l - 1));
const etaEq = (l, s, d) => loveH(l)*s/Math.pow(d, l + 1);
// Armónicos esféricos reales y ortonormales hasta LMAX en la dirección unitaria (x, y, z); polo = eje y.
// Índice k = l² + l + m. Polinomios de Legendre normalizados con recurrencias estables.
function shAll(x, y, z, out = new Float64Array(NK)){
  const ct = Math.max(-1, Math.min(1, y)), st = Math.sqrt(Math.max(0, 1 - ct*ct)), ph = Math.atan2(z, x);
  const P = shAll.P || (shAll.P = new Float64Array(NK));
  P[0] = Math.sqrt(1/(4*Math.PI));
  for (let m = 1; m <= LMAX; m++) P[m*m + 2*m] = Math.sqrt((2*m + 1)/(2*m))*st*P[(m-1)*(m-1) + 2*(m-1)];
  for (let m = 0; m < LMAX; m++) P[(m+1)*(m+1) + (m+1) + m] = Math.sqrt(2*m + 3)*ct*P[m*m + 2*m];
  for (let m = 0; m <= LMAX; m++) for (let l = m + 2; l <= LMAX; l++){
    const a = Math.sqrt((4*l*l - 1)/(l*l - m*m)), b = Math.sqrt(((l-1)*(l-1) - m*m)/(4*(l-1)*(l-1) - 1));
    P[l*l + l + m] = a*(ct*P[(l-1)*(l-1) + (l-1) + m] - b*P[(l-2)*(l-2) + (l-2) + m]);
  }
  for (let l = 0; l <= LMAX; l++){
    out[l*l + l] = P[l*l + l];
    for (let m = 1; m <= l; m++){ const p = Math.SQRT2*P[l*l + l + m]; out[l*l + l + m] = p*Math.cos(m*ph); out[l*l + l - m] = p*Math.sin(m*ph); }
  }
  return out;
}
const lOf = k => Math.floor(Math.sqrt(k));
// Coeficientes de la marea de equilibrio con la masa en la dirección u, a distancia d (teorema de adición:
// P_l(n·u) = 4π/(2l+1)·Σ_m Y_lm(n)·Y_lm(u)).
function tideCoefs(s, d, u, out){
  out.fill(0); if (s <= 0) return out;
  const Yu = shAll(u[0], u[1], u[2]);
  for (let l = 2; l <= LMAX; l++){ const c = etaEq(l, s, d)*4*Math.PI/(2*l + 1); for (let k = l*l; k < (l+1)*(l+1); k++) out[k] = c*Yu[k]; }
  return out;
}
// La bola tiene un núcleo de roca (radio 0,62, densidad 3) bajo una capa de agua hasta el radio 1.
const R_CORE = 0.62, RHO_CORE = 3;
const M_BALL = (4*Math.PI/3)*(RHO_CORE*Math.pow(R_CORE, 3) + (1 - Math.pow(R_CORE, 3)));   // G·m de la bola
// Masa suelta: movimiento relativo de dos cuerpos, r'' = −G(M + m)·r/|r|³, con M = s·m.
function relAcc(s, x, y, z){ const r = Math.hypot(x, y, z), k = -M_BALL*(1 + s)/(r*r*r); return [k*x, k*y, k*z]; }
// Fuerza de marea en un punto p de la superficie (por unidad de G·M): la atracción de la masa en p menos la
// que siente el centro de la bola, a = (P − p)/|P − p|³ − P/|P|³. Su parte radial (a·p̂) es positiva donde
// levanta el agua y negativa donde la hunde. Escalas: bajo la masa vale 1/(r−1)² − 1/r²; a 90°, −1/(r² + 1)^(3/2).
function tidalRadial(px, py, pz, P){
  const dx = P[0] - px, dy = P[1] - py, dz = P[2] - pz, d3 = Math.pow(dx*dx + dy*dy + dz*dz, 1.5), r3 = Math.pow(P[0]*P[0] + P[1]*P[1] + P[2]*P[2], 1.5);
  const ax = dx/d3 - P[0]/r3, ay = dy/d3 - P[1]/r3, az = dz/d3 - P[2]/r3, pl = Math.hypot(px, py, pz);
  return (ax*px + ay*py + az*pz)/pl;
}
const tideScale = r => [1/((r - 1)*(r - 1)) - 1/(r*r), 1/Math.pow(r*r + 1, 1.5)];   // [máximo +, máximo −]
// Un paso de los osciladores: a'' = −ω_l²(a − a_eq) − γ·a'  (Euler simpléctico).
function stepModes(a, v, aEq, h, gamma){
  for (let k = 4; k < NK; k++){ const w2 = omega2(lOf(k)); v[k] += (-w2*(a[k] - aEq[k]) - gamma*v[k])*h; a[k] += v[k]*h; }
}
// @fin-fisica -----------------------------------------------------------------------------------

const $ = id => document.getElementById(id), cv = $("cv"), ctx = cv.getContext("2d");
const fmt = (v, dd) => v.toFixed(dd).replace(".", ",");
const NAMES = {"0.35":"Luna", "0.8":"Planeta", "1.6":"Estrella"};
const GAMMA = 0.1, D_MIN = 1.22;
let mass = 0.8, running = true, showAxes = true, W = 0, H = 0, dpr = 1, R = 100, R0 = 100, cx = 0, cy = 0, rotMode = false;
const amp = new Float64Array(NK), vel = new Float64Array(NK), aEq = new Float64Array(NK);
// la masa: posición en el plano de la pantalla (unidades de radio), con el puntero o girando sola
let px = 2.4, py = 0, tx = 2.4, ty = 0, pointerOn = false, idleT = 99, autoA = 0, sPull = 0;
// la masa en el espacio: posición P y velocidad V (mundo). "free": suelta, se mueve sola con la gravedad.
const trail = [];                                       // camino recorrido por la masa suelta
let touched = false;                                    // ¿ya la movió alguien? (deja de girar sola)
let P = [2.4, 0, 0], V = [0, 0, 0], free = false, stuck = false, inWater = false, vpx = 0, vpy = 0, mx = 2.4, my = 0, mz = 0;

// ---------- Superficie: 200 puntos alrededor × 100 de polo a polo ----------
const NLON = 200, NLAT = 100, NG = NLON*NLAT;
const BASIS = new Float32Array(NK*NG), eta = new Float32Array(NG), nrm = new Float32Array(3*NG);
const sinT = new Float32Array(NLAT), cosT = new Float32Array(NLAT), sinP = new Float32Array(NLON), cosP = new Float32Array(NLON);
(function buildBasis(){
  const Y = new Float64Array(NK);
  for (let j = 0; j < NLAT; j++){ const th = (j + 0.5)/NLAT*Math.PI; sinT[j] = Math.sin(th); cosT[j] = Math.cos(th); }
  for (let i = 0; i < NLON; i++){ const ph = i/NLON*2*Math.PI; sinP[i] = Math.sin(ph); cosP[i] = Math.cos(ph); }
  for (let j = 0; j < NLAT; j++) for (let i = 0; i < NLON; i++){
    const p = j*NLON + i; shAll(sinT[j]*cosP[i], cosT[j], sinT[j]*sinP[i], Y);
    for (let k = 0; k < NK; k++) BASIS[k*NG + p] = Y[k];
  }
})();
let etaMax = 0, etaMin = 0;
function updateSurface(){
  eta.fill(0);
  for (let k = 4; k < NK; k++){ const c = amp[k]; if (Math.abs(c) < 1e-7) continue; const o = k*NG; for (let p = 0; p < NG; p++) eta[p] += c*BASIS[o + p]; }
  etaMax = -1; etaMin = 1;
  for (let p = 0; p < NG; p++){ let e = eta[p]; e = e > 0.55 ? 0.55 + 0.3*Math.tanh((e - 0.55)/0.3) : Math.max(R_CORE - 1, e); eta[p] = e; if (e > etaMax) etaMax = e; if (e < etaMin) etaMin = e; }
  const dth = Math.PI/NLAT, dph = 2*Math.PI/NLON;
  for (let j = 0; j < NLAT; j++){
    const st = Math.max(sinT[j], 0.05), ct = cosT[j], jn = Math.min(NLAT - 1, j + 1), jp = Math.max(0, j - 1);
    for (let i = 0; i < NLON; i++){
      const p = j*NLON + i, iE = j*NLON + (i + 1) % NLON, iW = j*NLON + (i + NLON - 1) % NLON;
      const gT = (eta[jn*NLON + i] - eta[jp*NLON + i])/((jn - jp)*dth), gP = (eta[iE] - eta[iW])/(2*dph)/st, r = 1 + eta[p];
      const cp = cosP[i], sp = sinP[i];
      const nx = st*cp - (gT*ct*cp - gP*sp)/r, ny = ct + gT*st/r, nz = st*sp - (gT*ct*sp + gP*cp)/r, L = Math.hypot(nx, ny, nz);
      nrm[3*p] = nx/L; nrm[3*p+1] = ny/L; nrm[3*p+2] = nz/L;
    }
  }
}
const NN = [0, 0, 1];
function surf(x, y, z, wantN){
  const th = Math.acos(Math.max(-1, Math.min(1, y))), ph = Math.atan2(z, x);
  let fj = th/Math.PI*NLAT - 0.5, fi = (ph < 0 ? ph + 2*Math.PI : ph)/(2*Math.PI)*NLON;
  fj = Math.max(0, Math.min(NLAT - 1.001, fj));
  const j0 = fj | 0, tj = fj - j0, i0 = (fi | 0) % NLON, ti = fi - Math.floor(fi), i1 = (i0 + 1) % NLON, j1 = Math.min(NLAT - 1, j0 + 1);
  const p00 = j0*NLON + i0, p01 = j0*NLON + i1, p10 = j1*NLON + i0, p11 = j1*NLON + i1;
  const w00 = (1-ti)*(1-tj), w01 = ti*(1-tj), w10 = (1-ti)*tj, w11 = ti*tj;
  if (wantN){
    const a = nrm[3*p00]*w00 + nrm[3*p01]*w01 + nrm[3*p10]*w10 + nrm[3*p11]*w11;
    const b = nrm[3*p00+1]*w00 + nrm[3*p01+1]*w01 + nrm[3*p10+1]*w10 + nrm[3*p11+1]*w11;
    const c = nrm[3*p00+2]*w00 + nrm[3*p01+2]*w01 + nrm[3*p10+2]*w10 + nrm[3*p11+2]*w11;

    const off = (Math.random() - 0.5)*0.25, i = sN++;

  ctx.fillStyle = col; ctx.strokeStyle = "#0c203c"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(X, Y, rr, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.beginPath(); ctx.ellipse(X - rr*0.35, Y - rr*0.38, rr*0.28, rr*0.18, -0.5, 0, Math.PI*2); ctx.fill();
  if (mass < 0.5){ ctx.fillStyle = "rgba(120,125,140,0.6)"; ctx.beginPath(); ctx.arc(X + rr*0.25, Y + rr*0.2, rr*0.22, 0, Math.PI*2); ctx.fill(); }
}
// Leyenda de la escala: el color dice si la fuerza de marea levanta (+) o hunde (−) esa parte del agua.
function drawLegend(){
  // Fondo discreto para que se lea sobre las estrellas; título, barra y qué hace la fuerza en cada extremo.
  const w = Math.min(230, W - 120), h = 10, x = 14, pad = 10, top = H - 92;
  ctx.fillStyle = "rgba(10,26,51,0.78)"; ctx.strokeStyle = "rgba(93,117,144,0.7)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - pad, top - 8, w + 2*pad, 86, 12) : ctx.rect(x - pad, top - 8, w + 2*pad, 86); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#f0f6fc"; ctx.font = "700 12.5px Inter, sans-serif"; ctx.fillText("Fuerza de marea sobre el agua", x, top + 8);
  const y = top + 18;
  for (let k = 0; k < 18; k++){ const c = fireRGB(k/17 + 0.001); ctx.fillStyle = `rgb(${c.map(Math.round).join(",")})`; ctx.fillRect(x + k*w/18, y, w/18 + 0.5, h); }
  ctx.strokeStyle = "#0c203c"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = "#f0f6fc"; ctx.font = "600 12px Inter, sans-serif";
  ctx.fillText("↑ hacia afuera", x, y + h + 16); ctx.textAlign = "right"; ctx.fillText("hacia adentro ↓", x + w, y + h + 16);
  ctx.fillStyle = "#b8c6d3"; ctx.font = "500 11.5px Inter, sans-serif";
  ctx.textAlign = "start"; ctx.fillText("el agua sube", x, y + h + 32); ctx.textAlign = "right"; ctx.fillText("el agua baja", x + w, y + h + 32); ctx.textAlign = "start";
}
function drawSpray(){                                          // por colores, con cuadritos (rápido para miles)
  const COL = ["#8fd6ff", "#3f9fe0", "#9c7656"];
  for (let c = 0; c < 3; c++){                                  // un solo trazo por color: mucho más rápido
    ctx.beginPath();
    for (let i = 0; i < sN; i++){
      if (QK[i] !== c) continue;
      const z = Math.max(1.4, QS[i]*R*2); ctx.rect(cx + QX[i]*R - z/2, cy - QY[i]*R - z/2, z, z);
    }
    ctx.fillStyle = COL[c]; ctx.fill();
  }
}
let last = 0, textT = 0, perf = [];
function frame(now){
  const dt = last ? Math.min(50, now - last)/1000 : 1/60; last = now;
  if (cv.clientWidth !== W || cv.clientHeight !== H) resize();   // por si el tamaño cambió sin aviso
  const T = running ? dt : 0;
  // la masa: sigue al puntero (si nadie la mueve por 3 s, da vueltas sola) o, suelta, se mueve con la gravedad
  idleT += dt;
  const rMass = 0.16 + 0.1*mass;
  if (!free){
    // Al comienzo gira sola para mostrar el efecto; después de tocarla, queda donde la dejes.
    const auto = !touched && !pointerOn;
    if (auto){ autoA += dt*0.7; tx = 2.3*Math.cos(autoA); ty = 2.3*Math.sin(autoA)*0.85; }
    const c = toCam(...P), k = Math.min(1, dt*14);
    if (auto || pointerOn){ c[0] += (tx - c[0])*k; c[1] += (ty - c[1])*k; }   // se mueve paralela a la pantalla, a su propia profundidad
    const d0 = Math.hypot(...c); if (d0 < D_MIN) for (let i = 0; i < 3; i++) c[i] *= D_MIN/d0;
    const Pn = fromCam(...c);
    for (let i = 0; i < 3; i++){ V[i] = 0.8*V[i] + 0.2*(Pn[i] - P[i])/dt; } P = Pn;
  } else if (T > 0 && !stuck){
    const n = Math.max(2, Math.ceil(T/0.003)), h = T/n;
    for (let s = 0; s < n && !stuck; s++){                      // leapfrog de dos cuerpos
      let a = relAcc(mass, P[0], P[1], P[2]);
      for (let i = 0; i < 3; i++){ V[i] += a[i]*h/2; P[i] += V[i]*h; }
      a = relAcc(mass, P[0], P[1], P[2]);
      for (let i = 0; i < 3; i++) V[i] += a[i]*h/2;
      const r = Math.hypot(...P), u = P.map(v => v/r), rs = 1 + surf(u[0], u[1], u[2], false);
      if (r < rs + rMass*0.5){
        if (!inWater){                                           // ¡al agua! gran salpicadura y olas
          inWater = true; const sp = Math.hypot(...V), uc = toCam(...u), L2 = Math.hypot(uc[0], uc[1]) || 1;
          hitImpulse(u, Math.min(4, 0.6*sp*mass)); burst(uc[0]/L2, uc[1]/L2, rs, SPLASH_N, 1.2 + 0.3*sp, false);
        }
        for (let i = 0; i < 3; i++) V[i] *= 1 - Math.min(0.5, 3*h);   // el agua la frena
      } else inWater = false;
      if (r < R_CORE + rMass){                                   // choca con el núcleo de roca
        stuck = true; const uc = toCam(...u), L2 = Math.hypot(uc[0], uc[1]) || 1;
        hitImpulse(u, 3.5*mass); burst(uc[0]/L2, uc[1]/L2, 1, SPLASH_N, 2.6, true);
        toast("¡Chocaron! La masa golpeó el núcleo de roca: el agua y la roca salpican por todos lados.", 5000);
      }
    }
    if (Math.hypot(...P) > 14){ free = false; syncFree(); toast("Se escapó: iba más rápido que la velocidad de escape"); }
  }
  const Pc = toCam(...P); mx = Pc[0]; my = Pc[1]; mz = Pc[2];
  if (free && !stuck && T > 0){ trail.push(P.slice()); if (trail.length > 600) trail.shift(); }
  let dm = Math.max(D_MIN, Math.hypot(...P));
  sPull += ((stuck ? 0 : 1) - sPull)*Math.min(1, dt*3);   // la masa siempre tira (también cuando queda quieta)
  if (T > 0){
    const r0 = Math.hypot(...P) || 1, u = P.map(v => v/r0);
    tideCoefs(mass*sPull, dm, u, aEq);
    const n = Math.max(4, Math.ceil(T*Math.sqrt(omega2(LMAX))/0.15)), h = T/n;
    for (let s = 0; s < n; s++) stepModes(amp, vel, aEq, h, GAMMA);
    emitSpray(T); stepSpray(T);
  }
  updateSurface(); setCam(); lightView();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0a1a33"; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, p] of STARS){ ctx.globalAlpha = 0.35 + 0.35*Math.sin(now/1300 + p); ctx.fillStyle = "#cfe3ff"; ctx.beginPath(); ctx.arc(x*W, y*H, r, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  // sombra suave de la bola (plana, de dibujo)
  const t0 = performance.now();
  const ext = gpu ? renderGPU(now) : renderBall();
  const ms = performance.now() - t0;
  if (free && trail.length > 1){                               // camino de la masa suelta, punteado
    ctx.strokeStyle = "rgba(230,182,106,0.6)"; ctx.lineWidth = 2; ctx.setLineDash([4, 6]); ctx.beginPath();
    trail.forEach((q, k) => { const c = toCam(...q), X = cx + c[0]*R, Y = cy - c[1]*R; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.stroke(); ctx.setLineDash([]);
  }
  drawAxes(false);
  if (mz < 0) drawMass(now);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(gpu ? glc : off, cx - ext*R, cy - ext*R, 2*ext*R, 2*ext*R);
  drawOutline();
  drawAxes(true); drawSpray(); if (mz >= 0) drawMass(now);
  drawLegend();
  if (now - textT > 200){ textT = now; updateText(dm); }
  perf.push(ms); if (perf.length >= 8){ const avg = perf.reduce((a, b) => a + b)/perf.length; perf = [];
    if (avg > 11 && capRes > 160) capRes *= 0.85; else if (avg < 6 && capRes < 640) capRes *= 1.1; }   // resolución según lo que alcanza el equipo
  requestAnimationFrame(frame);
}
function updateText(dm){
  let waves = 0; for (let k = 4; k < NK; k++) waves += vel[k]*vel[k];
  const w = waves < 0.002 ? "tranquila" : waves < 0.03 ? "con olas" : "muy agitada";
  const state = stuck ? "chocó con la bola" : free ? `suelta, a ${fmt(Math.hypot(...P), 1)} radios, ${fmt(Math.hypot(...V), 2)} radios/s` : `a ${fmt(dm, 1)} radios`;
  $("data").textContent = `${NAMES[String(mass)]} ${state} · el agua sube ${fmt(100*Math.max(0, etaMax), 0)} % del radio · ${w}${sN ? " · salpica" : ""}`;
}

// ---------- Controles ----------
let toastT = 0;
function toast(msg, ms = 3200){ const el = $("toast"); el.textContent = msg; el.classList.remove("off"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("off"), ms); }
const PLAY = '<path d="M8 5v14l11-7z" fill="currentColor"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>';
function syncPlay(){ $("playIco").innerHTML = running ? PAUSE : PLAY; $("playLbl").textContent = running ? "Pausa" : "Seguir"; }
$("play").addEventListener("click", () => { running = !running; syncPlay(); });
$("rot").addEventListener("click", () => { rotMode = !rotMode; $("rot").setAttribute("aria-pressed", rotMode);
  toast(rotMode ? "Arrastra para girar la vista alrededor de la bola" : "Arrastra para mover la masa"); });
function setZoom(z){ uz = Math.max(0.35, Math.min(2.2, z)); R = R0*uz; $("zin").disabled = uz >= 2.2; $("zout").disabled = uz <= 0.35; }
$("zin").addEventListener("click", () => setZoom(uz*1.25));
$("zout").addEventListener("click", () => setZoom(uz/1.25));
cv.addEventListener("wheel", e => { e.preventDefault(); setZoom(uz*Math.exp(-e.deltaY*0.0015)); }, {passive:false});
cv.addEventListener("contextmenu", e => e.preventDefault());
function syncFree(){ $("free").setAttribute("aria-pressed", free); $("freeLbl").textContent = free ? "Atrapar" : "Soltar"; }
$("free").addEventListener("click", () => {
  if (!free){
    free = true; stuck = false; inWater = false;
    // sale en órbita circular, en el plano de la pantalla: v = √(G(M + m)/r)
    const r = Math.hypot(...P), vc = Math.sqrt(M_BALL*(1 + mass)/r), ax = fromCam(0, 0, 1);
    let t = [ax[1]*P[2] - ax[2]*P[1], ax[2]*P[0] - ax[0]*P[2], ax[0]*P[1] - ax[1]*P[0]];     // perpendicular a la masa y a la vista
    if (Math.hypot(...t) < 1e-3*r) t = [P[2], 0, -P[0]];                                       // si la masa está justo delante o detrás
    const tl = Math.hypot(...t); V = t.map(v => v/tl*vc); trail.length = 0;
    toast("¡Suelta! Ahora orbita sola con la gravedad. Cambia su masa o la vista y mira qué pasa.", 4000);
  } else { free = false; stuck = false; toast("Atrapada: vuelve a seguir tu dedo o tu mouse"); }
  syncFree();
});
$("calm").addEventListener("click", () => { amp.fill(0); vel.fill(0); sN = 0; if (stuck){ free = false; stuck = false; syncFree(); } toast("El agua vuelve a quedar redonda y quieta"); });
$("axesBtn").addEventListener("click", () => { showAxes = !showAxes; $("axesBtn").setAttribute("aria-pressed", showAxes); });
$("more").addEventListener("click", () => { const open = $("sheet").hidden; $("sheet").hidden = !open; $("more").setAttribute("aria-pressed", open); });
document.querySelectorAll("[data-mass]").forEach(b => b.addEventListener("click", () => {
  mass = +b.dataset.mass; document.querySelectorAll("[data-mass]").forEach(x => x.setAttribute("aria-pressed", x === b));
  toast(mass < 0.5 ? "Una luna liviana: mareas suaves" : mass < 1 ? "Un planeta: mareas y olas grandes" : "¡Una estrella! Tira tan fuerte que el agua salpica");
}));
// el puntero es la masa: con mouse basta moverlo; con el dedo, tocar y arrastrar
function setPointer(e){ const rc = cv.getBoundingClientRect(); tx = (e.clientX - rc.left - cx)/R; ty = -(e.clientY - rc.top - cy)/R; idleT = 0; touched = true; }
// girar la vista: con "Girar vista" activo, o con el botón derecho del mouse
let turn = null;
cv.addEventListener("pointermove", e => {
  if (turn){ yaw += (e.clientX - turn.x)*0.008; pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - turn.y)*0.008)); turn.x = e.clientX; turn.y = e.clientY; return; }
  if (!free && (e.pointerType === "mouse" || pointerOn)){ pointerOn = true; setPointer(e); }
});
cv.addEventListener("pointerdown", e => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  // mouse: moverlo lleva la masa y arrastrarlo gira la vista; dedo: arrastrar lleva la masa (o gira con «Girar vista»)
  if (rotMode || e.pointerType === "mouse"){ turn = {x:e.clientX, y:e.clientY}; return; }
  if (!free){ pointerOn = true; setPointer(e); }
});
cv.addEventListener("pointerup", e => { turn = null; if (e.pointerType !== "mouse") pointerOn = false; });
cv.addEventListener("pointercancel", () => { pointerOn = false; });
cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") pointerOn = false; });
syncPlay(); resize();
requestAnimationFrame(frame);
})();
</script>
<!-- SyMula: selector de tema (botones con data-theme-set) -->
<script>(function(){
function sync(){var t=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-theme-set")===t);});
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--background").trim());}
window.SyMulaTheme=function(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("symula-tema",t);}catch(e){}sync();
  window.dispatchEvent(new Event("symula-tema"));};
// colores del tema para dibujar en el lienzo: SyMulaColor("sem-1"), SyMulaColor("primary")...
window.SyMulaColor=function(name){return getComputedStyle(document.documentElement).getPropertyValue("--"+name).trim();};
document.querySelectorAll("[data-theme-set]").forEach(function(b){b.addEventListener("click",function(){SyMulaTheme(b.getAttribute("data-theme-set"));});});
try{if(!localStorage.getItem("symula-tema")&&window.matchMedia)matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(e){document.documentElement.setAttribute("data-theme",e.matches?"light":"dark");sync();window.dispatchEvent(new Event("symula-tema"));});}catch(e){}
sync();})();</script>
<!-- fin SyMula: selector de tema -->
