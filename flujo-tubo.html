<style>
/* ===== SyMula: estilo común (sistema de diseño v1.0, igual en todas las páginas) ===== */
:root,:root[data-theme="dark"]{
  --background:#0B1526;--surface:#15253A;--surface-2:#1B2E47;--text:#F0F6FC;--text-muted:#B8C6D3;
  --primary:#42C7CF;--primary-text:#0B1526;--accent:#E6B66A;--border:#30445B;--control-border:#5D7590;
  --sem-1:#6CB4F0;--sem-2:#F29C6B;--sem-3:#6FCF97;--sem-4:#C49BEA;--sem-5:#E6C15A;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --background:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F8;--text:#102A43;--text-muted:#526779;
  --primary:#087481;--primary-text:#FFFFFF;--accent:#D9A15B;--border:#DCE5EB;--control-border:#7B8FA1;
  --sem-1:#1F6FB2;--sem-2:#B4532A;--sem-3:#2E7D4F;--sem-4:#7E4AB0;--sem-5:#8A6400;
  color-scheme:light;
}
:root[data-theme="night"]{
  --background:#09221D;--surface:#12382F;--surface-2:#174238;--text:#E7F8F2;--text-muted:#C1F4DD;
  --primary:#21B68B;--primary-text:#09221D;--accent:#C1F4DD;--border:#286052;--control-border:#4E8A78;
  --sem-1:#8FD3FF;--sem-2:#F5B38A;--sem-3:#9BE8C0;--sem-4:#D5B8F2;--sem-5:#F0D58A;
  color-scheme:dark;
}
:root{
  /* nombres antiguos que usa el código de cada página */
  --bg:var(--background);--panel:var(--surface);--btn:var(--surface-2);--line:var(--border);--ink:var(--text);
  --soft:var(--text-muted);--acc:var(--primary);--acc-ink:var(--primary-text);--cyan:var(--primary);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--background)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--background);color:var(--text);
  font:500 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--background)}

:root[data-theme="night"] .stage canvas{filter:grayscale(1) sepia(.8) hue-rotate(92deg) saturate(.85) brightness(.88)}   /* verde suave, sin fluorescencia */
.home{position:absolute;top:12px;left:12px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;z-index:3;
  background:var(--surface);border:1px solid var(--control-border);color:var(--text)}
.card{position:absolute;top:12px;left:72px;right:12px;max-width:480px;min-height:48px;padding:10px 16px;border-radius:12px;z-index:2;pointer-events:none;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border)}
.card h1{font:700 17px/1.2 Inter,sans-serif;margin:0;color:var(--text);letter-spacing:-.01em}
.card p{margin:3px 0 0;font-size:14px;color:var(--text-muted)}
.card .data{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.card p:empty{display:none}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:92%;padding:10px 16px;border-radius:12px;z-index:3;
  background:var(--surface);color:var(--text);border:1px solid var(--primary);font-weight:600;text-align:center;pointer-events:none;transition:opacity .3s}
.toast.off{opacity:0}
.dock{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.dock>*{width:100%;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px}
.tile{flex:1 1 0;min-width:0;min-height:56px;padding:6px 4px;border-radius:12px;border:1px solid var(--control-border);background:var(--surface-2);color:var(--text);
  font:600 13px/1.15 Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  touch-action:manipulation;transition:border-color .15s,background-color .15s}
.tile svg{width:24px;height:24px;flex:none}
.tile small{font-size:11px;font-weight:500;opacity:.85}
@media (hover:hover){.tile:hover:not(:disabled),.home:hover{border-color:var(--primary)}}
.tile[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile[aria-busy="true"]{position:relative;color:transparent}
.tile[aria-busy="true"]::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--text-muted);border-top-color:var(--primary);animation:sy-spin .8s linear infinite}
@keyframes sy-spin{to{transform:rotate(360deg)}}
.lbl{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:-4px;padding:0 2px;letter-spacing:.02em}
.themes{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.themes button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text);font:600 13px Inter,sans-serif;cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text)}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
/* ===== fin del estilo común ===== */
.legend{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);pointer-events:none}
.legend i{width:90px;height:8px;border-radius:4px}

<div class="stage">

    <button class="tile" type="button" data-fluid="aire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3"/></svg>Aire</button>
    <button class="tile" type="button" data-fluid="agua"><svg viewBox="0 0 24 24"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z" fill="#5ec8f2"/></svg>Agua</button>

    <button class="tile" type="button" id="view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="viewLbl">Rapidez</span></button>

<script>
(function(){
"use strict";
// ---------- Configuración ----------
// Lattice Boltzmann D2Q9 con Smagorinsky. La malla se ajusta sola al equipo (LEVELS) y la
// simulación avanza según el tiempo real, así se ve igual a 60 Hz que a 120 Hz.
const LEVELS = [9000, 13000, 19000, 27000, 38000, 52000];
const NPART = 1000, MAXOBJ = 5, BUDGET = 11;      // ms de cálculo por cuadro
const EX = [0,1,0,-1,0,1,-1,-1,1], EY = [0,0,1,0,-1,1,1,-1,-1];
const W = [4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36];
// Viscosidades de red para un tubo de 100 celdas de ancho (se escalan con la malla para que el
// número de Reynolds no dependa de la resolución). Conservan el orden real.
const FLUIDS = {
  aire:      {nu:0.015, name:"aire",      real:"1,5 × 10⁻⁵ m²/s"},
  agua:      {nu:0.006, name:"agua",      real:"1,0 × 10⁻⁶ m²/s"},
  aceite:    {nu:0.04,  name:"aceite",    real:"≈ 1 × 10⁻⁴ m²/s"},
  glicerina: {nu:0.12,  name:"glicerina", real:"≈ 1,1 × 10⁻³ m²/s"},
  miel:      {nu:0.30,  name:"miel",      real:"≈ 7 × 10⁻³ m²/s"}
};
const CS2 = 0.0144;

// ---------- Estado ----------
let level = 2, NX = 0, NY = 0, N = 0, steps = 8;
let f, g, rho, ux, uy, curl, bar, prevBar, img, px32, pxs, pys;
let U = 0.06, fluid = "agua", nu = 0.006, mode = "speed", running = true;
let obstacles = [], selected = null, drag = null;
let rect = {x:0, y:0, w:1, h:1}, vertical = false, dpr = 1;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const off = document.createElement("canvas"), octx = off.getContext("2d");

// ---------- Física ----------
function setEq(i, r, vx, vy){
  const u2 = 1.5*(vx*vx + vy*vy);
  for (let q = 0; q < 9; q++){ const eu = EX[q]*vx + EY[q]*vy; f[q*N+i] = W[q]*r*(1 + 3*eu + 4.5*eu*eu - u2); }
  rho[i] = r; ux[i] = vx; uy[i] = vy;
}
function initFlow(){ for (let i = 0; i < N; i++) setEq(i, 1, bar[i] ? 0 : U, 0); }

// Colisión y transporte en una sola pasada: cada celda relaja hacia el equilibrio y empuja sus
// poblaciones a los vecinos; si el vecino es pared, la población rebota a la misma celda.
// (Verificado en Node: da el mismo campo que colisión + transporte por separado, 1,5× más rápido.)
function step(){
  const tau0 = 3*nu + 0.5, C = 18*Math.SQRT2*CS2;
  for (let y = 1; y < NY-1; y++){
    const row = y*NX;
    for (let x = 0; x < NX; x++){
      const i = row + x; if (bar[i]) continue;
      const f0=f[i],f1=f[N+i],f2=f[2*N+i],f3=f[3*N+i],f4=f[4*N+i],f5=f[5*N+i],f6=f[6*N+i],f7=f[7*N+i],f8=f[8*N+i];
      const r = f0+f1+f2+f3+f4+f5+f6+f7+f8, ir = 1/r;
      const vx = (f1-f3+f5-f6-f7+f8)*ir, vy = (f2-f4+f5+f6-f7-f8)*ir;
      const u2 = 1.5*(vx*vx+vy*vy), a = r/9, b = r/36, xp = vx+vy, xm = vx-vy;
      const ax = 4.5*vx*vx, ay = 4.5*vy*vy, bp = 4.5*xp*xp, bm = 4.5*xm*xm;
      const d0=f0-4*a*(1-u2), d1=f1-a*(1+3*vx+ax-u2), d3=f3-a*(1-3*vx+ax-u2), d2=f2-a*(1+3*vy+ay-u2), d4=f4-a*(1-3*vy+ay-u2);
      const d5=f5-b*(1+3*xp+bp-u2), d7=f7-b*(1-3*xp+bp-u2), d8=f8-b*(1+3*xm+bm-u2), d6=f6-b*(1-3*xm+bm-u2);
      const pxx=d1+d3+d5+d6+d7+d8, pyy=d2+d4+d5+d6+d7+d8, pxy=d5-d6+d7-d8;
      const om = 2/(tau0 + Math.sqrt(tau0*tau0 + C*Math.sqrt(pxx*pxx+pyy*pyy+2*pxy*pxy)*ir));
      rho[i] = r; ux[i] = vx; uy[i] = vy;
      g[i] = f0-om*d0;
      const L = x > 0, R = x < NX-1; let j;
      if (R){ j = i+1;    if (bar[j]) g[3*N+i] = f1-om*d1; else g[N+j]   = f1-om*d1; }
              j = i+NX;   if (bar[j]) g[4*N+i] = f2-om*d2; else g[2*N+j] = f2-om*d2;
      if (L){ j = i-1;    if (bar[j]) g[N+i]   = f3-om*d3; else g[3*N+j] = f3-om*d3; }
              j = i-NX;   if (bar[j]) g[2*N+i] = f4-om*d4; else g[4*N+j] = f4-om*d4;
      if (R){ j = i+NX+1; if (bar[j]) g[7*N+i] = f5-om*d5; else g[5*N+j] = f5-om*d5; }
      if (L){ j = i+NX-1; if (bar[j]) g[8*N+i] = f6-om*d6; else g[6*N+j] = f6-om*d6; }
      if (L){ j = i-NX-1; if (bar[j]) g[5*N+i] = f7-om*d7; else g[7*N+j] = f7-om*d7; }
      if (R){ j = i-NX+1; if (bar[j]) g[6*N+i] = f8-om*d8; else g[8*N+j] = f8-om*d8; }
    }
  }
  const t = f; f = g; g = t;
  for (let y = 1; y < NY-1; y++){
    const i = y*NX; if (!bar[i]) setEq(i, 1, U, 0);                                  // entrada
    const o = i + NX-1; if (!bar[o]) for (let q = 0; q < 9; q++) f[q*N+o] = f[q*N+o-1]; // salida libre
  }
}

// ---------- Obstáculos (en celdas) ----------
function shapePoly(o){
  const r = o.r, p = [];
  if (o.type === "circle"){ for (let k = 0; k < 40; k++){ const a = k/40*Math.PI*2; p.push([r*Math.cos(a), r*Math.sin(a)]); } }
  else if (o.type === "square"){ const s = 0.85*r; p.push([-s,-s],[s,-s],[s,s],[-s,s]); }
  else if (o.type === "triangle"){ p.push([-r,0],[0.75*r,-0.9*r],[0.75*r,0.9*r]); }
  else { for (let k = 0; k <= 24; k++){ const a = -Math.PI/2 + k/24*Math.PI; p.push([-0.45*r + r*Math.cos(a), r*Math.sin(a)]); } }
  const c = Math.cos(o.a), s = Math.sin(o.a);
  return p.map(([x, y]) => [o.x + x*c - y*s, o.y + x*s + y*c]);
}
function inPoly(x, y, p){
  let ins = false;
  for (let i = 0, j = p.length-1; i < p.length; j = i++){
    const [xi, yi] = p[i], [xj, yj] = p[j];
    if ((yi > y) !== (yj > y) && x < (xj-xi)*(y-yi)/(yj-yi) + xi) ins = !ins;
  }
  return ins;
}
function rebuildMask(){
  prevBar.set(bar); bar.fill(0);
  for (let x = 0; x < NX; x++){ bar[x] = 1; bar[x + (NY-1)*NX] = 1; }
  for (const o of obstacles){
    const p = shapePoly(o);
    let x0 = NX, x1 = 0, y0 = NY, y1 = 0;
    for (const [x, y] of p){ x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    for (let y = Math.max(1, Math.floor(y0)); y <= Math.min(NY-2, Math.ceil(y1)); y++)
      for (let x = Math.max(1, Math.floor(x0)); x <= Math.min(NX-2, Math.ceil(x1)); x++)
        if (inPoly(x+0.5, y+0.5, p)) bar[x + y*NX] = 1;
  }
  for (let i = 0; i < N; i++){
    if (prevBar[i] && !bar[i]) setEq(i, 1, 0, 0);
    else if (bar[i]){ ux[i] = 0; uy[i] = 0; }
  }
}
function clampO(o){
  o.r = Math.min(Math.max(o.r, NY*0.05), NY*0.3);
  o.x = Math.min(Math.max(o.x, o.r + 6), NX - o.r - 6);
  o.y = Math.min(Math.max(o.y, o.r + 3), NY - o.r - 4);
}

// ---------- Malla ajustada a la pantalla ----------
function layout(){
  const Wc = cv.clientWidth, Hc = cv.clientHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(Wc*dpr)); cv.height = Math.max(1, Math.round(Hc*dpr));
  const card = document.querySelector(".card"), top = card.offsetTop + card.offsetHeight + 16, side = 22, bottom = 34, aw = Math.max(40, Wc - 2*side), ah = Math.max(40, Hc - top - bottom);
  vertical = ah > aw*1.05;                           // celular en vertical: el tubo baja de arriba hacia abajo
  let Lg = vertical ? ah : aw, S = vertical ? aw : ah;
  if (Lg/S < 1.6) S = Lg/1.6; else if (Lg/S > 4) Lg = S*4;
  const w = vertical ? S : Lg, h = vertical ? Lg : S;
  rect = {x:(Wc - w)/2, y:top + (ah - h)/2, w, h};
  return Lg/S;
}
function build(){
  updateText();
  const ratio = layout(), oldNY = NY;
  NX = Math.round(Math.sqrt(LEVELS[level]*ratio)); NY = Math.max(30, Math.round(NX/ratio)); N = NX*NY;
  steps = Math.min(10, Math.max(6, Math.round(8*NY/100)));    // celdas más finas: más pasos para la misma rapidez
  f = new Float32Array(9*N); g = new Float32Array(9*N);
  rho = new Float32Array(N).fill(1); ux = new Float32Array(N); uy = new Float32Array(N); curl = new Float32Array(N);
  bar = new Uint8Array(N); prevBar = new Uint8Array(N);
  off.width = NX; off.height = NY; img = octx.createImageData(NX, NY); px32 = new Uint32Array(img.data.buffer);
  if (oldNY){ const k = NY/oldNY; for (const o of obstacles){ o.x *= k; o.y *= k; o.r *= k; clampO(o); } }
  else obstacles.push({type:"circle", x:NX*0.24, y:NY*0.493, r:NY*0.1, a:0});
  setFluid(fluid, true);
  rebuildMask(); initFlow();
  pxs = new Float32Array(NPART); pys = new Float32Array(NPART);
  for (let k = 0; k < NPART; k++) spawn(k, true);
  updateText();
  cv.dataset.grid = NX + "x" + NY;
}

// ---------- Partículas ----------
function spawn(k, anywhere){
  pxs[k] = anywhere ? 1 + Math.random()*(NX-2) : 1 + Math.random()*2;
  pys[k] = 1.5 + Math.random()*(NY-3);
}
function advect(n){
  for (let k = 0; k < NPART; k++){
    const i = (pxs[k]|0) + (pys[k]|0)*NX;
    pxs[k] += ux[i]*n; pys[k] += uy[i]*n;
    const x = pxs[k], y = pys[k];
    if (x < 0 || x >= NX-1 || y < 1 || y >= NY-1 || bar[(x|0)+(y|0)*NX] || Math.random() < 0.0015) spawn(k, false);
  }
}

// ---------- Dibujo ----------
function makeLut(stops){
  const t = new Uint32Array(256);
  for (let k = 0; k < 256; k++){
    const v = k/255; let j = 0;
    while (j < stops.length-2 && v > stops[j+1][0]) j++;
    const [a, ca] = stops[j], [b, cb] = stops[j+1], u = (v-a)/(b-a), c = [0, 1, 2].map(m => Math.round(ca[m] + (cb[m]-ca[m])*u));
    t[k] = 0xff000000 | (c[2] << 16) | (c[1] << 8) | c[0];
  }
  return t;
}
const SEQ = [[0,[11,18,38]],[0.3,[29,78,137]],[0.55,[42,157,143]],[0.8,[233,196,106]],[1,[255,244,214]]];
const DIV = [[0,[63,167,255]],[0.5,[14,21,40]],[1,[255,138,61]]];
const LUTS = {speed:makeLut(SEQ), curl:makeLut(DIV), pressure:makeLut(DIV)};
const WALL = 0xff000000 | (225 << 16) | (214 << 8) | 205;
const VIEWS = {speed:["Rapidez", "Quieto", "Rápido", SEQ], curl:["Remolinos", "Gira a la izquierda", "Gira a la derecha", DIV], pressure:["Presión", "Baja", "Alta", DIV]};
const css = s => "linear-gradient(90deg," + s.map(([p, c]) => `rgb(${c}) ${p*100}%`).join(",") + ")";

function toS(gx, gy){                               // celdas → pantalla
  return vertical ? [rect.x + rect.w - gy/NY*rect.w, rect.y + gx/NX*rect.h]
                  : [rect.x + gx/NX*rect.w, rect.y + gy/NY*rect.h];
}
function toG(X, Y){                                 // pantalla → celdas
  return vertical ? [(Y-rect.y)/rect.h*NX, (rect.x+rect.w-X)/rect.w*NY]
                  : [(X-rect.x)/rect.w*NX, (Y-rect.y)/rect.h*NY];
}
function render(){
  const lut = LUTS[mode];
  if (mode === "curl") for (let y = 1; y < NY-1; y++) for (let x = 1; x < NX-1; x++){
    const i = x + y*NX; curl[i] = uy[i+1] - uy[i-1] - ux[i+NX] + ux[i-NX];
  }
  let bad = false;
  const ks = 255/(1.7*U), kc = 127.5/(0.4*U), kp = 127.5/(1.5*U*U);
  for (let i = 0; i < N; i++){
    if (bar[i]){ px32[i] = WALL; continue; }
    const r = rho[i];
    if (!(r > 0.3 && r < 3)) bad = true;
    let v;
    if (mode === "speed") v = Math.sqrt(ux[i]*ux[i] + uy[i]*uy[i])*ks;
    else if (mode === "curl") v = 127.5 + curl[i]*kc;
    else v = 127.5 + (r-1)*kp;
    px32[i] = lut[v <= 0 ? 0 : v >= 255 ? 255 : v|0];
  }
  octx.putImageData(img, 0, 0);
  const Wc = cv.clientWidth, Hc = cv.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = (window.SyMulaColor && SyMulaColor("background")) || "#0b1226"; ctx.fillRect(0, 0, Wc, Hc);   // alrededor del tubo: color del tema
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  if (vertical){ ctx.save(); ctx.translate(rect.x + rect.w, rect.y); ctx.rotate(Math.PI/2); ctx.drawImage(off, 0, 0, rect.h, rect.w); ctx.restore(); }
  else ctx.drawImage(off, rect.x, rect.y, rect.w, rect.h);
  // paredes del tubo
  ctx.strokeStyle = "#7d8da1"; ctx.lineWidth = 3;
  ctx.beginPath();
  if (vertical){ ctx.moveTo(rect.x, rect.y); ctx.lineTo(rect.x, rect.y+rect.h); ctx.moveTo(rect.x+rect.w, rect.y); ctx.lineTo(rect.x+rect.w, rect.y+rect.h); }
  else { ctx.moveTo(rect.x, rect.y); ctx.lineTo(rect.x+rect.w, rect.y); ctx.moveTo(rect.x, rect.y+rect.h); ctx.lineTo(rect.x+rect.w, rect.y+rect.h); }
  ctx.stroke();
  // flecha de entrada
  ctx.fillStyle = "#ffc94a";
  const [ax, ay] = vertical ? [rect.x + rect.w/2, rect.y - 4] : [rect.x - 4, rect.y + rect.h/2];
  ctx.beginPath();
  if (vertical){ ctx.moveTo(ax-9, ay-9); ctx.lineTo(ax+9, ay-9); ctx.lineTo(ax, ay); }
  else { ctx.moveTo(ax-9, ay-9); ctx.lineTo(ax-9, ay+9); ctx.lineTo(ax, ay); }
  ctx.fill();
  // partículas trazadoras
  ctx.fillStyle = "rgba(255,255,255,0.62)";
  const s = Math.max(1.6, rect[vertical ? "h" : "w"]/NX*0.6);
  for (let k = 0; k < NPART; k++){ const [X, Y] = toS(pxs[k], pys[k]); ctx.fillRect(X - s/2, Y - s/2, s, s); }
  // forma elegida
  if (selected){
    ctx.beginPath();
    shapePoly(selected).forEach(([x, y], k) => { const [X, Y] = toS(x, y); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.closePath(); ctx.lineWidth = 3; ctx.strokeStyle = "#ffc94a"; ctx.stroke();
  }
  return bad;
}

// ---------- Bucle: pasos según el tiempo real y calidad automática ----------
let last = 0, acc = 0, perfN = 0, perfMs = 0, perfSteps = 0, decisions = 0, wentDown = false;
function frame(now){
  const dt = last ? Math.min(50, now - last) : 16.7; last = now;
  if (running){
    acc += steps*dt/16.7;
    const want = Math.min(Math.floor(acc), 2*steps); acc -= Math.floor(acc);
    const t0 = performance.now(); let done = 0;
    while (done < want){ step(); done++; if (performance.now() - t0 > BUDGET) break; }
    if (done < want) acc = 0;
    if (done) advect(done);
    quality(performance.now() - t0, done);
  }
  if (render()){ initFlow(); toast("El flujo se descontroló y empezó de nuevo. Prueba más lento o un fluido más espeso."); }
  requestAnimationFrame(frame);
}
function quality(ms, done){
  if (decisions >= 4 || !done) return;
  perfN++; if (perfN <= 15) return;                  // deja calentar el motor de JavaScript
  perfMs += ms; perfSteps += done;
  if (perfN < 60) return;
  const perFrame = perfMs/perfSteps*steps;           // ms que cuesta un cuadro a rapidez normal
  perfN = 0; perfMs = 0; perfSteps = 0;
  if (perFrame > BUDGET && level > 0){ level--; wentDown = true; decisions++; build(); }
  else if (perFrame < BUDGET*0.42 && level < LEVELS.length-1 && !wentDown){ level++; decisions++; build(); }
  else decisions = 4;
}

// ---------- Interfaz ----------
let toastT = 0;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.remove("off"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("off"), 4000); }
function updateText(){
  const ref = selected || obstacles[0], F = FLUIDS[fluid];
  $("say").textContent = selected ? "Arrastra la forma para moverla, o gírala con los botones."
                                  : obstacles.length ? "Arrastra la forma y mira cómo el " + F.name + " la rodea."
                                                     : "Elige una forma abajo para ponerla en el tubo.";
  $("data").textContent = (ref ? "Reynolds " + Math.round(U*2*ref.r/nu).toLocaleString("es-CL") + " · " : "") + "viscosidad " + F.real;
}
function setFluid(name, quiet){
  fluid = name; nu = FLUIDS[name].nu*NY/100;
  document.querySelectorAll("[data-fluid]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fluid === name));
  if (!quiet) updateText();
}
function setVel(v){
  U = 0.012*v;
  document.querySelectorAll("[data-vel]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.vel === v));
  updateText();
}
function select(o){
  selected = o;
  $("shapeRow").hidden = !!o; $("editRow").hidden = !o;
  $("clear").disabled = obstacles.length === 0;
  document.querySelectorAll("[data-add]").forEach(b => b.disabled = obstacles.length >= MAXOBJ);
  updateText();
}
function setView(m){
  mode = m; const [name, lo, hi, st] = VIEWS[m];
  $("viewLbl").textContent = name; $("lgLo").textContent = lo; $("lgHi").textContent = hi; $("lgBar").style.background = css(st);
}
const ORDER = ["speed", "curl", "pressure"];
$("view").addEventListener("click", () => setView(ORDER[(ORDER.indexOf(mode)+1) % ORDER.length]));

document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
  if (obstacles.length >= MAXOBJ) return;
  const SPOTS = [[0.24, 0.5], [0.45, 0.3], [0.45, 0.7], [0.66, 0.5], [0.8, 0.3]];
  const free = SPOTS.find(([sx, sy]) => !obstacles.some(q => Math.hypot(q.x - sx*NX, q.y - sy*NY) < NY*0.2)) || SPOTS[0];
  const o = {type:b.dataset.add, x:free[0]*NX, y:free[1]*NY - 0.7, r:NY*0.1, a:0};
  clampO(o); obstacles.push(o); rebuildMask(); select(o);
}));
$("clear").addEventListener("click", () => { obstacles = []; rebuildMask(); select(null); });
$("rot").addEventListener("click", () => { if (selected){ selected.a += Math.PI/6; rebuildMask(); } });
$("big").addEventListener("click", () => { if (selected){ selected.r *= 1.2; clampO(selected); rebuildMask(); updateText(); } });
$("small").addEventListener("click", () => { if (selected){ selected.r /= 1.2; clampO(selected); rebuildMask(); updateText(); } });
$("del").addEventListener("click", () => { obstacles = obstacles.filter(o => o !== selected); rebuildMask(); select(null); });
$("done").addEventListener("click", () => select(null));
document.querySelectorAll("[data-fluid]").forEach(b => b.addEventListener("click", () => setFluid(b.dataset.fluid)));
document.querySelectorAll("[data-vel]").forEach(b => b.addEventListener("click", () => setVel(+b.dataset.vel)));
const PLAY = '<path d="M7 4.5l13 7.5-13 7.5z" fill="currentColor"/>', PAUSE = '<rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"/>';
$("pause").addEventListener("click", () => {
  running = !running; $("pauseIco").innerHTML = running ? PAUSE : PLAY; $("pauseLbl").textContent = running ? "Pausa" : "Seguir";
});

function pos(e){ const r = cv.getBoundingClientRect(); return toG(e.clientX - r.left, e.clientY - r.top); }
function hit(x, y){
  const tol = 14/(rect[vertical ? "h" : "w"]/NX);    // 14 px de margen para el dedo
  for (let k = obstacles.length-1; k >= 0; k--){ const o = obstacles[k]; if (Math.hypot(x-o.x, y-o.y) <= o.r + tol) return o; }
  return null;
}
cv.addEventListener("pointerdown", e => {
  const [x, y] = pos(e), o = hit(x, y);
  select(o);
  if (o){ drag = {o, dx:o.x - x, dy:o.y - y}; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const [x, y] = pos(e); drag.o.x = x + drag.dx; drag.o.y = y + drag.dy; clampO(drag.o); rebuildMask();
});
const endDrag = () => { drag = null; };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
document.addEventListener("keydown", e => {
  if ((e.key === "Delete" || e.key === "Backspace") && selected){ e.preventDefault(); $("del").click(); }
});

let rt = 0, lastW = 0, lastH = 0;
new ResizeObserver(() => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (cv.clientWidth !== lastW || cv.clientHeight !== lastH){ lastW = cv.clientWidth; lastH = cv.clientHeight; build(); } }, 150);
}).observe(cv);

// ---------- Inicio ----------
$("pauseIco").innerHTML = PAUSE;
setVel(5); setView("speed");
build(); lastW = cv.clientWidth; lastH = cv.clientHeight; select(null);
requestAnimationFrame(frame);
})();
</script>
<!-- SyMula: selector de tema (botones con data-theme-set) -->
<script>(function(){
function sync(){var t=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-theme-set")===t);});
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--background").trim());}
window.SyMulaTheme=function(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("symula-tema",t);}catch(e){}sync();
  window.dispatchEvent(new Event("symula-tema"));};
// colores del tema para dibujar en el lienzo: SyMulaColor("sem-1"), SyMulaColor("primary")...
window.SyMulaColor=function(name){return getComputedStyle(document.documentElement).getPropertyValue("--"+name).trim();};
document.querySelectorAll("[data-theme-set]").forEach(function(b){b.addEventListener("click",function(){SyMulaTheme(b.getAttribute("data-theme-set"));});});
try{if(!localStorage.getItem("symula-tema")&&window.matchMedia)matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(e){document.documentElement.setAttribute("data-theme",e.matches?"light":"dark");sync();window.dispatchEvent(new Event("symula-tema"));});}catch(e){}
sync();})();</script>
<!-- fin SyMula: selector de tema -->
