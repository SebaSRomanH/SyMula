<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1226">
<!-- SyMula: tema (va antes del estilo para no parpadear) -->
<script>(function(){var t=null;try{t=localStorage.getItem("symula-tema");if(!t&&localStorage.getItem("symula-noche")==="1")t="night";}catch(e){}
if(t!=="light"&&t!=="dark"&&t!=="night")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
document.documentElement.setAttribute("data-theme",t);})();</script>
<!-- fin SyMula: tema -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lanzamiento vertical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== SyMula: estilo común (sistema de diseño v1.0, igual en todas las páginas) ===== */
:root,:root[data-theme="dark"]{
  --background:#0B1526;--surface:#15253A;--surface-2:#1B2E47;--text:#F0F6FC;--text-muted:#B8C6D3;
  --primary:#42C7CF;--primary-text:#0B1526;--accent:#E6B66A;--border:#30445B;--control-border:#5D7590;
  --sem-1:#6CB4F0;--sem-2:#F29C6B;--sem-3:#6FCF97;--sem-4:#C49BEA;--sem-5:#E6C15A;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --background:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F8;--text:#102A43;--text-muted:#526779;
  --primary:#087481;--primary-text:#FFFFFF;--accent:#D9A15B;--border:#DCE5EB;--control-border:#7B8FA1;
  --sem-1:#1F6FB2;--sem-2:#B4532A;--sem-3:#2E7D4F;--sem-4:#7E4AB0;--sem-5:#8A6400;
  color-scheme:light;
}
:root[data-theme="night"]{
  --background:#09221D;--surface:#12382F;--surface-2:#174238;--text:#E7F8F2;--text-muted:#C1F4DD;
  --primary:#21B68B;--primary-text:#09221D;--accent:#C1F4DD;--border:#286052;--control-border:#4E8A78;
  --sem-1:#8FD3FF;--sem-2:#F5B38A;--sem-3:#9BE8C0;--sem-4:#D5B8F2;--sem-5:#F0D58A;
  color-scheme:dark;
}
:root{
  /* nombres antiguos que usa el código de cada página */
  --bg:var(--background);--panel:var(--surface);--btn:var(--surface-2);--line:var(--border);--ink:var(--text);
  --soft:var(--text-muted);--acc:var(--primary);--acc-ink:var(--primary-text);--cyan:var(--primary);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--background)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--background);color:var(--text);
  font:500 15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--background)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
:root[data-theme="night"] .stage canvas{filter:grayscale(1) sepia(.8) hue-rotate(92deg) saturate(.85) brightness(.88)}   /* verde suave, sin fluorescencia */
.home{position:absolute;top:12px;left:12px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;z-index:3;
  background:var(--surface);border:1px solid var(--control-border);color:var(--text)}
.card{position:absolute;top:12px;left:72px;right:12px;max-width:480px;min-height:48px;padding:10px 16px;border-radius:12px;z-index:2;pointer-events:none;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border)}
.card h1{font:700 17px/1.2 Inter,sans-serif;margin:0;color:var(--text);letter-spacing:-.01em}
.card p{margin:3px 0 0;font-size:14px;color:var(--text-muted)}
.card .data{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
.card p:empty{display:none}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:92%;padding:10px 16px;border-radius:12px;z-index:3;
  background:var(--surface);color:var(--text);border:1px solid var(--primary);font-weight:600;text-align:center;pointer-events:none;transition:opacity .3s}
.toast.off{opacity:0}
.dock{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.dock>*{width:100%;max-width:760px;margin:0 auto}
.row{display:flex;gap:8px}
.tile{flex:1 1 0;min-width:0;min-height:56px;padding:6px 4px;border-radius:12px;border:1px solid var(--control-border);background:var(--surface-2);color:var(--text);
  font:600 13px/1.15 Inter,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  touch-action:manipulation;transition:border-color .15s,background-color .15s}
.tile svg{width:24px;height:24px;flex:none}
.tile small{font-size:11px;font-weight:500;opacity:.85}
@media (hover:hover){.tile:hover:not(:disabled),.home:hover{border-color:var(--primary)}}
.tile[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile[aria-busy="true"]{position:relative;color:transparent}
.tile[aria-busy="true"]::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--text-muted);border-top-color:var(--primary);animation:sy-spin .8s linear infinite}
@keyframes sy-spin{to{transform:rotate(360deg)}}
.lbl{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:-4px;padding:0 2px;letter-spacing:.02em}
.themes{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.themes button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--text);font:600 13px Inter,sans-serif;cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--primary);color:var(--primary-text)}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
/* ===== fin del estilo común ===== */
.hud{position:absolute;left:56px;right:12px;pointer-events:none}
.alt{font:800 clamp(32px,9vw,46px)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.alt small{font-size:.48em;color:var(--soft);margin-left:4px}
.stats{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv" aria-label="Lanzamiento vertical: toma la pelota y lánzala hacia arriba"></canvas>
  <a class="home" href="index.html" aria-label="Volver al inicio"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5.5 9.5V20h13V9.5"/></svg></a>
  <div class="card" id="card" aria-live="polite"><h1>Lanzamiento vertical</h1><p id="say">Toma la pelota y lánzala hacia arriba.</p><p class="data" id="pred"></p></div>
  <div class="hud" id="hud">
    <div class="alt" id="alt">0,00<small>m</small></div>
    <div class="stats">
      <span>Máx <b id="max">0,00 m</b></span>
      <span>Velocidad <b id="vel">0,0 m/s</b></span>
      <span>Tiempo <b id="time">0,00 s</b></span>
    </div>
  </div>
</div>
<nav class="dock" aria-label="Controles">
  <div class="lbl">Dónde lanzas</div>
  <div class="row" role="group" aria-label="Gravedad">
    <button class="tile" type="button" data-g="9.81" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#3f8fd8"/><path d="M7 8c2 0 3 2 5 1s2-3 4-2M6 15c3-1 4 2 7 1" stroke="#7fd07a" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>Tierra</button>
    <button class="tile" type="button" data-g="1.62" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#c9ccd6"/><circle cx="9" cy="9" r="2" fill="#9ea3b2"/><circle cx="15" cy="15" r="2.6" fill="#9ea3b2"/></svg>Luna</button>
    <button class="tile" type="button" data-g="3.71" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#d9663a"/><path d="M6 10c3 1 6-1 12 1" stroke="#a8432a" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>Marte</button>
    <button class="tile" type="button" data-g="24.79" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#d8b48a"/><path d="M3.6 9h16.8M3.4 14h17.2" stroke="#a9744b" stroke-width="2.2"/></svg>Júpiter</button>
  </div>
  <div class="row">
    <button class="tile" type="button" id="slow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V8.5M12 3v2"/></svg><span id="slowLbl">Normal</span></button>
    <button class="tile" type="button" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>Otra vez</button>
    <button class="tile" type="button" id="fs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" id="fsIco"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg><span id="fsLbl">Pantalla</span></button>
  </div>
</nav>
<script>
(function(){
"use strict";
// ---------- Escala real ----------
const BASE_VIEW = 4;       // metros visibles sobre el suelo al inicio
const R = 0.11;            // radio de la pelota (m), como un balón de fútbol
const GROUND = 64;         // px de suelo en pantalla
let TOP = 175;             // px reservados para la tarjeta y el panel de datos (se mide)
const STROBE = 0.1;        // una marca cada 0,1 s de vuelo
const VMAX = 60;           // m/s
const REST = 0.55, FRICTION = 0.85, WALL = 0.8;

let g = 9.81, timeScale = 1, view = BASE_VIEW, viewTarget = BASE_VIEW;
const ball = {x:0, y:R, vx:0, vy:0};
let phase = "rest", restT = 0, hist = [], strobe = [], path = [];
let tFlight = 0, landed = true, maxY = 0, nextStrobe = 0;

const $ = id => document.getElementById(id), cv = $("cv"), ctx = cv.getContext("2d");
let Wp = 0, Hp = 0, dpr = 1, XW = 1;
const fmt = (v, d) => v.toFixed(d).replace(".", ",");

function resize(){
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  Wp = cv.clientWidth; Hp = cv.clientHeight;
  const card = $("card"), hud = $("hud");
  hud.style.top = (card.offsetTop + card.offsetHeight + 8) + "px";
  TOP = hud.offsetTop + hud.offsetHeight + 14;
  cv.width = Math.round(Wp*dpr); cv.height = Math.round(Hp*dpr);
  XW = (Wp/2) / ((Hp-GROUND-TOP)/BASE_VIEW);    // medio ancho de la "habitación" en metros
  ball.x = Math.max(-XW+R, Math.min(XW-R, ball.x));
}
new ResizeObserver(resize).observe(cv);
const scale = () => (Hp-GROUND-TOP)/view;      // px por metro
const toScreen = (x, y) => { const s = scale(); return [Wp/2 + x*s, Hp-GROUND - y*s]; };
const toWorld = (X, Y) => { const s = scale(); return [(X-Wp/2)/s, (Hp-GROUND-Y)/s]; };

// ---------- Interacción ----------
function pos(e){ const r = cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
cv.addEventListener("pointerdown", e => {
  const [X, Y] = pos(e), [bx, by] = toScreen(ball.x, ball.y);
  const rp = Math.max(R*scale(), 7);
  if (Math.hypot(X-bx, Y-by) > Math.max(60, rp*2)) return;
  cv.setPointerCapture(e.pointerId);
  phase = "held"; hist = [];
  move(X, Y);
});
cv.addEventListener("pointermove", e => { if (phase === "held") move(...pos(e)); });
function move(X, Y){
  const [x, y] = toWorld(X, Y);
  ball.x = Math.max(-XW+R, Math.min(XW-R, x)); ball.y = Math.max(R, y);
  const t = performance.now()/1000;
  hist.push({t, x:ball.x, y:ball.y});
  while (hist.length > 2 && t-hist[0].t > 0.1) hist.shift();
}
function release(){
  if (phase !== "held") return;
  let vx = 0, vy = 0;
  if (hist.length > 1){
    const a = hist[0], b = hist[hist.length-1], dt = b.t-a.t;
    if (dt > 0.015 && performance.now()/1000-b.t < 0.08){ vx = (b.x-a.x)/dt; vy = (b.y-a.y)/dt; }
  }
  const v = Math.hypot(vx, vy); if (v > VMAX){ vx *= VMAX/v; vy *= VMAX/v; }
  ball.vx = vx; ball.vy = vy;
  phase = "flight"; landed = false; tFlight = 0; maxY = ball.y; nextStrobe = 0;
  strobe = []; path = [[ball.x, ball.y]]; viewTarget = BASE_VIEW;
  if (vy > 0.3){
    const h = vy*vy/(2*g), tu = vy/g;
    $("pred").textContent = `Predicción: sube ${fmt(h, 2)} m más en ${fmt(tu, 2)} s (h = v²/2g, t = v/g)`;
  } else $("pred").textContent = "";
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);

const PLACES = {"9.81":"la Tierra", "1.62":"la Luna", "3.71":"Marte", "24.79":"Júpiter"};
function setG(v){
  g = +v;
  document.querySelectorAll("[data-g]").forEach(b => b.setAttribute("aria-pressed", b.dataset.g === v));
  $("say").textContent = `En ${PLACES[v]} la gravedad es ${fmt(g, 2)} m/s². Toma la pelota y lánzala hacia arriba.`;
}
document.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => setG(b.dataset.g)));
const SPEEDS = [1, 0.5, 0.25];
$("slow").addEventListener("click", () => {
  timeScale = SPEEDS[(SPEEDS.indexOf(timeScale)+1) % SPEEDS.length];
  $("slowLbl").textContent = timeScale === 1 ? "Normal" : "Lento " + String(timeScale).replace(".", ",") + "x";
  $("slow").setAttribute("aria-pressed", timeScale !== 1);
});
$("reset").addEventListener("click", () => {
  Object.assign(ball, {x:0, y:R, vx:0, vy:0}); phase = "rest"; strobe = []; path = [];
  maxY = 0; tFlight = 0; viewTarget = BASE_VIEW; $("pred").textContent = "";
});

// Pantalla completa (oculto donde el navegador no lo permite, como Safari en iPhone)
const fsBtn = $("fs"), root = document.documentElement;
const reqFs = root.requestFullscreen || root.webkitRequestFullscreen;
const isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
if (!reqFs) fsBtn.hidden = true;
fsBtn.addEventListener("click", () => {
  try {
    const p = isFs() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document) : reqFs.call(root);
    if (p && p.catch) p.catch(() => { fsBtn.hidden = true; });
  } catch (err) { fsBtn.hidden = true; }
});
const ENTER = '<path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/>', EXIT = '<path d="M8 3v5H3M21 8h-5V3M16 21v-5h5M3 16h5v5"/>';
const syncFs = () => { const on = !!isFs(); $("fsIco").innerHTML = on ? EXIT : ENTER; $("fsLbl").textContent = on ? "Salir" : "Pantalla"; setTimeout(resize, 200); };
document.addEventListener("fullscreenchange", syncFs);
document.addEventListener("webkitfullscreenchange", syncFs);

// ---------- Física (solución exacta con g constante) ----------
function physics(dt){
  if (phase !== "flight") return;
  const H = 1/240;
  for (let t = 0; t < dt; t += H){
    const h = Math.min(H, dt-t);
    ball.x += ball.vx*h; ball.y += ball.vy*h - 0.5*g*h*h; ball.vy -= g*h;
    if (!landed){
      tFlight += h;
      while (tFlight >= nextStrobe){ strobe.push([ball.x, ball.y]); nextStrobe += STROBE; }
    }
    if (ball.x > XW-R){ ball.x = XW-R; ball.vx = -WALL*Math.abs(ball.vx); }
    if (ball.x < -XW+R){ ball.x = -XW+R; ball.vx = WALL*Math.abs(ball.vx); }
    if (ball.y < R){
      ball.y = R; landed = true;
      ball.vy = -ball.vy*REST; ball.vx *= FRICTION;
      if (ball.vy < 0.6){ ball.vy = 0; ball.vx = 0; phase = "rest"; restT = 0; break; }
    }
    maxY = Math.max(maxY, ball.y);
  }
  path.push([ball.x, ball.y]); if (path.length > 4000) path.shift();
  if (ball.vy > 0) viewTarget = Math.max(viewTarget, (ball.y + ball.vy*ball.vy/(2*g))*1.12 + 0.4);
}

// ---------- Dibujo ----------
function niceStep(raw){
  const p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10)*p;
}
// Escenario de cada lugar: cielo (arriba, abajo), suelo (relleno, borde), cerros lejanos y cuánto se ven las estrellas.
const SCENE = {
  "9.81": {sky:["#0b1430", "#2d4d7c"], ground:["#1d3020", "#4f8a52"], hills:"#18284a", stars:0.5},
  "1.62": {sky:["#03050b", "#0e1424"], ground:["#4b4d54", "#a3a5ad"], hills:"#22252e", stars:1},
  "3.71": {sky:["#1d0f0c", "#6e3622"], ground:["#4a2416", "#b5643c"], hills:"#3a1d13", stars:0.35},
  "24.79":{sky:["#1f1810", "#7a5b38"], ground:["#5a4128", "#c9a36f"], hills:"#3e2e1d", stars:0.2}
};
const STARS = Array.from({length:90}, () => [Math.random(), Math.random()*0.75, Math.random() < 0.15 ? 1.6 : 1, Math.random()]);
const HILLS = Array.from({length:13}, (_, k) => 0.35 + 0.65*Math.abs(Math.sin(k*1.7 + 0.4)*Math.cos(k*0.9)));
function person(x){
  const s = scale(), c = (a, b) => toScreen(x+a, b);
  ctx.strokeStyle = "#0f1626"; ctx.fillStyle = "#0f1626"; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = Math.max(2, 0.12*s);
  const line = (a, b, c2, d) => { const [X1, Y1] = c(a, b), [X2, Y2] = c(c2, d); ctx.beginPath(); ctx.moveTo(X1, Y1); ctx.lineTo(X2, Y2); ctx.stroke(); };
  ctx.save(); ctx.lineWidth = Math.max(3, 0.2*s); line(0, 1.36, 0, 0.92); ctx.restore();   // tronco
  line(0, 0.88, -0.13, 0.05); line(0, 0.88, 0.13, 0.05);
  line(0, 1.35, -0.2, 0.95); line(0, 1.35, 0.2, 0.95);
  const [hx, hy] = c(0, 1.58); ctx.beginPath(); ctx.arc(hx, hy, Math.max(2, 0.11*s), 0, Math.PI*2); ctx.fill();
}
function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = scale(), gy = Hp-GROUND;
  const sc = SCENE[String(g)] || SCENE["9.81"];
  const sky = ctx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, sc.sky[0]); sky.addColorStop(1, sc.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, Wp, gy);
  for (const [fx, fy, r, a] of STARS){                // estrellas: más tenues cerca del horizonte
    const Y = fy*gy; ctx.fillStyle = `rgba(235,240,255,${(sc.stars*(0.35 + 0.65*a)*(1 - fy)).toFixed(3)})`;
    ctx.fillRect(fx*Wp, Y, r, r);
  }
  ctx.fillStyle = sc.hills; ctx.beginPath(); ctx.moveTo(0, gy);   // cerros lejanos
  HILLS.forEach((h, k) => ctx.lineTo(k/(HILLS.length - 1)*Wp, gy - 8 - h*Math.min(46, gy*0.08)));
  ctx.lineTo(Wp, gy); ctx.fill();
  // regla de alturas
  const step = niceStep(view/6), top = (gy)/s;
  ctx.font = "700 12px Inter, sans-serif"; ctx.textBaseline = "middle";
  for (let h = step; h <= top; h += step){
    const Y = gy - h*s;
    if (Y < 72) break;                               // deja libre la esquina del botón de inicio
    ctx.strokeStyle = "rgba(230,237,245,0.07)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(44, Y); ctx.lineTo(Wp, Y); ctx.stroke();
    ctx.strokeStyle = "rgba(230,237,245,0.5)"; ctx.beginPath(); ctx.moveTo(34, Y); ctx.lineTo(44, Y); ctx.stroke();
    ctx.fillStyle = "rgba(230,237,245,0.7)";
    ctx.fillText(fmt(h, step < 1 ? 1 : 0) + " m", 4, Y);
  }
  ctx.strokeStyle = "rgba(230,237,245,0.3)"; ctx.beginPath(); ctx.moveTo(44, 0); ctx.lineTo(44, gy); ctx.stroke();
  // paredes de la habitación cuando la cámara se aleja
  for (const sx of [-XW, XW]){
    const [X] = toScreen(sx, 0);
    if (X > 46 && X < Wp-2){ ctx.strokeStyle = "rgba(230,237,245,0.15)"; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(X, 0); ctx.lineTo(X, gy); ctx.stroke(); ctx.setLineDash([]); }
  }
  // altura máxima alcanzada
  if (maxY > R+0.05){
    const Y = gy - (maxY-R)*s;
    ctx.strokeStyle = "rgba(240,167,66,0.55)"; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(44, Y); ctx.lineTo(Wp, Y); ctx.stroke(); ctx.setLineDash([]);
  }
  person(Math.max(-XW+0.3, -0.75));
  // trayectoria y marcas cada 0,1 s
  if (path.length > 1){
    ctx.strokeStyle = "rgba(240,167,66,0.35)"; ctx.lineWidth = 1.5; ctx.beginPath();
    path.forEach(([x, y], k) => { const [X, Y] = toScreen(x, y); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.stroke();
  }
  const rp = Math.max(R*s, 6);
  ctx.lineWidth = 1;
  for (const [x, y] of strobe){                       // marcas cada 0,1 s: pelotas fantasma
    const [X, Y] = toScreen(x, y);
    ctx.fillStyle = "rgba(255,200,140,0.14)"; ctx.strokeStyle = "rgba(240,230,215,0.5)";
    ctx.beginPath(); ctx.arc(X, Y, rp, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  // suelo
  const gg = ctx.createLinearGradient(0, gy, 0, gy + GROUND);
  gg.addColorStop(0, sc.ground[0]); gg.addColorStop(1, "#05070c");
  ctx.fillStyle = gg; ctx.fillRect(0, gy, Wp, GROUND);
  ctx.fillStyle = sc.ground[1]; ctx.fillRect(0, gy, Wp, 3);
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let k = 0; k < 40; k++){ const X = (k*97.3) % Wp, Y = gy + 8 + (k*37) % (GROUND - 14); ctx.fillRect(X, Y, 10 + (k*13) % 22, 2); }
  // pelota y su sombra en el suelo (más chica y tenue mientras más alto va)
  const [bx, by] = toScreen(ball.x, ball.y), hgt = Math.max(0, ball.y - R), sh = 1/(1 + hgt/1.5);
  ctx.fillStyle = `rgba(0,0,0,${(0.45*sh).toFixed(3)})`;
  ctx.beginPath(); ctx.ellipse(bx, gy + 2, rp*(0.6 + 0.6*sh), rp*0.28*(0.6 + 0.6*sh), 0, 0, Math.PI*2); ctx.fill();
  const gr = ctx.createRadialGradient(bx-rp*0.35, by-rp*0.35, rp*0.1, bx, by, rp);
  gr.addColorStop(0, "#ffe3b8"); gr.addColorStop(0.55, "#f0943a"); gr.addColorStop(1, "#a9520f");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(bx, by, rp, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(60,25,0,0.55)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.beginPath(); ctx.arc(bx - rp*0.38, by - rp*0.4, rp*0.18, 0, Math.PI*2); ctx.fill();   // brillo
  if (phase === "flight" && Math.hypot(ball.vx, ball.vy) > 0.2){
    const k = 0.12*s, ex = bx + ball.vx*k, ey = by - ball.vy*k;
    ctx.strokeStyle = "#7fd3ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
    const a = Math.atan2(ey-by, ex-bx);
    ctx.fillStyle = "#7fd3ff"; ctx.beginPath(); ctx.moveTo(ex, ey);
    ctx.lineTo(ex-8*Math.cos(a-0.45), ey-8*Math.sin(a-0.45)); ctx.lineTo(ex-8*Math.cos(a+0.45), ey-8*Math.sin(a+0.45)); ctx.fill();
  }
  if (phase === "held"){ ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx, by, rp+6, 0, Math.PI*2); ctx.stroke(); }
}
function hud(){
  $("alt").innerHTML = fmt(Math.max(0, ball.y-R), 2) + "<small>m</small>";
  $("max").textContent = fmt(Math.max(0, maxY-R), 2) + " m";
  $("vel").textContent = fmt(phase === "flight" ? Math.hypot(ball.vx, ball.vy) : 0, 1) + " m/s";
  $("time").textContent = fmt(tFlight, 2) + " s";
}

let last = 0;
function frame(now){
  const dt = last ? Math.min(0.05, (now-last)/1000) : 0; last = now;
  physics(dt*timeScale);
  if (phase === "rest"){ restT += dt; if (restT > 1.5) viewTarget = BASE_VIEW; }
  view += (viewTarget-view)*Math.min(1, dt*2.5);
  draw(); hud();
  requestAnimationFrame(frame);
}
setG("9.81"); resize();
requestAnimationFrame(frame);
})();
</script>
<!-- SyMula: selector de tema (botones con data-theme-set) -->
<script>(function(){
function sync(){var t=document.documentElement.getAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-theme-set")===t);});
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--background").trim());}
window.SyMulaTheme=function(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("symula-tema",t);}catch(e){}sync();
  window.dispatchEvent(new Event("symula-tema"));};
// colores del tema para dibujar en el lienzo: SyMulaColor("sem-1"), SyMulaColor("primary")...
window.SyMulaColor=function(name){return getComputedStyle(document.documentElement).getPropertyValue("--"+name).trim();};
document.querySelectorAll("[data-theme-set]").forEach(function(b){b.addEventListener("click",function(){SyMulaTheme(b.getAttribute("data-theme-set"));});});
try{if(!localStorage.getItem("symula-tema")&&window.matchMedia)matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(e){document.documentElement.setAttribute("data-theme",e.matches?"light":"dark");sync();window.dispatchEvent(new Event("symula-tema"));});}catch(e){}
sync();})();</script>
<!-- fin SyMula: selector de tema -->
